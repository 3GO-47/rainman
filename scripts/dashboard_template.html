<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="RAINMAN — NFL defense-vs-position intelligence terminal">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><ellipse cx=%228%22 cy=%228%22 rx=%227%22 ry=%224.4%22 transform=%22rotate(-28 8 8)%22 fill=%22%235c3a1e%22/><path d=%22M5.8 9.7 L10.2 6.3%22 stroke=%22white%22/></svg>">
<title>RAINMAN — Defense-vs-Position Field Theory</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root{--bg:#000;--panel:#050505;--edge:#262626;--edge2:#3d3d3d;--txt:#e6e6e6;--dim:#7d7d7d;
--amber:#58a6ff;--green:#00c853;--red:#ff453a;--cyan:#4dd0e1;--violet:#b388ff;}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--txt);font:12px/1.45 Consolas,"IBM Plex Mono","Cascadia Code",monospace;overflow-x:auto}
header{display:flex;align-items:baseline;gap:14px;padding:10px 18px 8px;border-bottom:2px solid var(--amber);background:#000;flex-wrap:wrap}
h1{font-size:16px;margin:0;color:var(--amber);letter-spacing:3px;font-weight:bold}
.sub{color:var(--dim);font-size:11px;letter-spacing:.5px}
.sub b{color:var(--amber)}
nav{display:flex;gap:2px;padding:6px 18px;border-bottom:1px solid var(--edge);flex-wrap:wrap;background:#000;position:sticky;top:0;z-index:5}
nav button{background:#000;border:1px solid var(--edge);color:var(--amber);padding:4px 12px;cursor:pointer;font:inherit;letter-spacing:1px;text-transform:uppercase;font-size:11px}
nav button:hover{border-color:var(--amber)}
nav button.on{background:var(--amber);color:#000;font-weight:bold;border-color:var(--amber)}
nav button .fk{color:var(--dim);font-size:9.5px;margin-right:5px}
nav button.on .fk{color:#000}
main{padding:12px 18px}
table{border-collapse:collapse;width:100%;font-size:11.5px}
th,td{padding:2px 7px;border-bottom:1px solid #141414;text-align:right;white-space:nowrap}
th{color:#8b98a5;cursor:pointer;position:sticky;top:33px;background:#000;z-index:2;font-weight:normal;text-transform:uppercase;font-size:10px;letter-spacing:1px;border-bottom:1px solid var(--edge2)}
th.rk{color:var(--cyan)}
td:first-child,th:first-child{text-align:left}
tr:hover td{background:#0a0f14}
.controls{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
select,input{background:#000;color:var(--txt);border:1px solid var(--edge2);padding:4px 7px;font:inherit}
.panel{background:var(--panel);border:1px solid var(--edge);padding:10px 12px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
h3{color:var(--amber);font-size:11.5px;margin:2px 0 8px;text-transform:uppercase;letter-spacing:2px;border-bottom:1px solid var(--edge);padding-bottom:4px}
h3 .f{color:var(--dim);text-transform:none;letter-spacing:0;font-weight:normal}
.note{color:var(--dim);font-size:10.5px;margin:6px 0}
.badge{display:inline-block;min-width:26px;text-align:center;padding:0 4px;color:#000;font-weight:bold}
.psi{font-weight:bold}
.specwrap{position:relative;display:inline-block;min-width:50px;text-align:right}
.spec{position:absolute;right:0;top:15%;height:70%;background:linear-gradient(90deg,transparent,rgba(88,166,255,.20));z-index:-1}
.inj0{color:#ffd600}.injm1{color:var(--red)}
.up{color:var(--red)}.dn{color:var(--green)}
.tabs{display:flex;gap:2px;margin-bottom:10px}
.tabs button{background:#000;border:1px solid var(--edge);color:var(--amber);padding:3px 11px;cursor:pointer;font:inherit;font-size:11px;text-transform:uppercase}
.tabs button.on{background:var(--amber);color:#000;font-weight:bold;border-color:var(--amber)}
.cell{cursor:pointer}
#matrixTbl td{text-align:center}
.mini{font-size:10.5px;color:var(--dim)}
.tl{vertical-align:-4px;margin-right:4px}
.tc{display:inline-flex;align-items:center;gap:2px}
.specband{position:relative;height:92px;border:1px solid var(--edge);
 background:linear-gradient(90deg,rgba(0,200,83,.14),rgba(120,130,140,.08) 50%,rgba(255,69,58,.14))}
.specband img{position:absolute;width:22px;height:22px;transform:translateX(-50%);transition:.2s;cursor:help}
.specband img:hover{transform:translateX(-50%) scale(1.6);z-index:3}
.specband img.selA{width:30px;height:30px;z-index:2;border-radius:50%;box-shadow:0 0 0 2px var(--amber)}
.specband img.selB{width:26px;height:26px;z-index:2;border-radius:50%;box-shadow:0 0 0 2px var(--violet)}
.specscale{display:flex;justify-content:space-between;color:var(--dim);font-size:10px;margin-top:5px;letter-spacing:1px}
.wave{vertical-align:middle}
.gamecard table{font-size:11px}
.gamecard h3{font-size:11.5px}
.advbar{position:relative;height:5px;margin:2px 0 10px;opacity:.9}
.advdot{position:absolute;top:-3px;width:11px;height:11px;border-radius:50%;background:var(--amber);
 box-shadow:0 0 0 1px #000;transform:translateX(-50%);transition:left .4s}
td.st{min-width:88px;text-align:right}
td.st .mini{margin:0 3px 0 2px}
table.fx{table-layout:fixed}
table.fx td,table.fx th{overflow:hidden;text-overflow:ellipsis}
.sep{border:0;border-top:1px solid var(--edge);margin:14px 0}
.pos{display:inline-flex;align-items:center;gap:3px;border:1px solid;padding:0 5px;font-size:10px;letter-spacing:1px;border-radius:2px;line-height:15px}
.plink{cursor:pointer}
.plink:hover{text-decoration:underline;color:var(--amber)}
canvas.chart{max-height:260px}
.sm-row{display:grid;grid-template-columns:88px 225px 1fr 106px 106px 106px 106px 52px;align-items:center;gap:6px;padding:7px 8px;border-left:3px solid;border-bottom:1px solid #101010}
.sm-row:hover{background:#0a0f14}
.sm-role{display:flex;align-items:center;gap:5px;font-size:11px}
.sm-who{display:flex;flex-direction:column;line-height:1.35;overflow:hidden}
.sm-track{position:relative;height:10px;background:#0d1117;border-radius:5px;margin-bottom:3px}
.sm-fill{height:100%;border-radius:5px;opacity:.8;animation:grow .9s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{width:0}}
.sm-tick{position:absolute;top:-3px;width:2px;height:16px;background:#e6e6e6;opacity:.85}
.sm-stat{display:flex;align-items:baseline;gap:4px;justify-content:flex-end;font-size:11.5px;white-space:nowrap}
.sm-stat b{color:#e6e6e6}
.sm-stat span{color:#7d7d7d;font-size:9.5px}
.sm-stat.dim{color:#2a2a2a;justify-content:center}
.sm-psi{text-align:right;font-size:13px}
.tdbar{position:relative;height:15px;background:#0b0e12;border:1px solid #1c232c;border-radius:7px;max-width:300px;overflow:hidden}
.tdbar .fill{height:100%;border-radius:7px 0 0 7px;animation:grow .9s cubic-bezier(.2,.8,.2,1)}
.tdbar .tick{position:absolute;top:0;bottom:0;width:2px;background:#e6e6e6;opacity:.75}
.tdbar .val{position:absolute;right:7px;top:0;font-size:9.5px;color:#dfe6ec;line-height:15px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;overflow:auto}
.modalbox{background:#060606;border:1px solid var(--edge2);max-width:920px;width:100%;padding:14px 18px;position:relative;box-shadow:0 0 40px rgba(0,0,0,.9)}
.mclose{cursor:pointer;color:var(--dim);border:1px solid var(--edge);padding:2px 8px;background:#000;font:inherit}
.modalbox .mclose{position:absolute;top:8px;right:10px}
@media (max-width:840px){
 main{padding:10px 8px}
 header{padding:8px 10px;gap:8px}
 h1{font-size:14px;letter-spacing:2px}
 .sub{font-size:9.5px}
 nav{padding:5px 8px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:thin}
 nav button{padding:4px 8px;font-size:10px;white-space:nowrap}
 nav button .fk{display:none}
 .grid2,.grid3{grid-template-columns:1fr}
 .panel{overflow-x:auto}
 .sm-row{min-width:860px}
 #tdTbl,#labTbl,#rkTbl,#skTbl,#chOut,#inSm,#inRest,#dcOut,#pOut,#matrixTblWrap,#tdb>.controls{overflow-x:auto}
 table{font-size:10.5px}
 th{position:static}
 .controls{gap:6px}
 select,input{padding:4px 5px;font-size:11px}
 .modal{padding:10px 4px}
 .modalbox{padding:10px 8px}
 canvas.chart{max-height:220px}
}
</style></head><body>
<header><h1><svg width="17" height="17" viewBox="0 0 16 16" style="vertical-align:-3px"><ellipse cx="8" cy="8" rx="7" ry="4.4" transform="rotate(-28 8 8)" fill="#5c3a1e" stroke="#8b98a5" stroke-width=".8"/><path d="M5.8 9.7 L10.2 6.3 M6.7 10.1 L7.4 8.4 M8.3 7.7 L9 6" stroke="#e6e6e6" stroke-width="1" fill="none"/></svg> RAINMAN</h1><span class="sub">DVP TERMINAL &middot; NFL DEFENSE-VS-POSITION &middot; DATA <b>24/25 + 25/26</b> (544 GM &middot; 10,702 ROWS) &middot; SCHED <b>26/27</b> &middot; BUILT <b>__BUILT__</b> &middot; BLEND <b>__BLEND__</b> &middot; RANK <b>1</b>/32 = MOST ALLOWED &middot; p&#8407; = m&middot;v&#8407;</span></header>
<nav>
<button data-v="home" class="on"><span class="fk">F1</span>Home</button>
<button data-v="tdb"><span class="fk">F2</span>TD Board</button>
<button data-v="chamber"><span class="fk">F3</span>Weekly Matchups</button>
<button data-v="players"><span class="fk">F4</span>Players</button>
<button data-v="defenses"><span class="fk">F5</span>Defenses</button>
<button data-v="sked"><span class="fk">F6</span>Schedule</button>
</nav>
<main>
<div id="home"><div id="homeTop"></div><div id="insights"></div></div>
<div id="chamber" hidden></div>
<div id="players" hidden><div id="dcView" class="panel"></div><div id="lab"></div><hr class="sep"><div id="player"></div></div>
<div id="defenses" hidden><div class="tabs" id="defTabs">
<button data-t="ranks" class="on">Rankings</button><button data-t="matrix">Matrix</button><button data-t="defense">Observatory</button></div>
<div id="ranks"></div><div id="matrix" hidden></div><div id="defense" hidden></div></div>
<div id="sked" hidden></div>
<div id="tdb" hidden></div>
</main>
<script>
const J = __DATA__;
/* ---------- helpers ---------- */
const $=q=>document.querySelector(q);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const stdev=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)*(x-m))))};
function gradeColor(rank,n=32){const t=Math.max(0,Math.min(1,(rank-1)/(n-1)));
  const h=t<.5?145-(t*2)*85:60-((t-.5)*2)*60;return `hsl(${h},52%,${45-t*4}%)`}
function gradeBg(rank){ // 6 discrete bands: greens -> slate middle -> reds
  if(rank<=5)  return 'hsla(145,70%,38%,.85)';
  if(rank<=10) return 'hsla(150,45%,29%,.85)';
  if(rank<=16) return 'hsla(210,16%,30%,.85)';
  if(rank<=21) return 'hsla(222,18%,22%,.85)';
  if(rank<=27) return 'hsla(8,45%,33%,.85)';
  return 'hsla(2,70%,42%,.85)';}
const SCACHE={};
function series(def,stat){const se=Math.max(...J.weekly.map(r=>r[1]));const k=def+'|'+stat;
  if(SCACHE[k])return SCACHE[k];
  return SCACHE[k]=J.weekly.filter(r=>r[0]===def&&r[1]===se).sort((a,b)=>a[2]-b[2]).map(r=>r[WCOL[stat]]);}
function sparkWave(vals,color,w=96,h=24){
  if(!vals||vals.length<2)return '';
  const mx=Math.max(...vals,1),mn=Math.min(...vals,0);
  const X=i=>(i/(vals.length-1))*(w-4)+2, Y=v=>h-3-((v-mn)/((mx-mn)||1))*(h-7);
  let dp=`M${X(0).toFixed(1)},${Y(vals[0]).toFixed(1)}`;
  for(let i=1;i<vals.length;i++){const xc=((X(i-1)+X(i))/2).toFixed(1);
    dp+=` Q${xc},${Y(vals[i-1]).toFixed(1)} ${X(i).toFixed(1)},${Y(vals[i]).toFixed(1)}`;}
  const ym=Y(mean(vals)).toFixed(1);
  return `<svg class="wave" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`+
   `<path d="${dp} L${X(vals.length-1).toFixed(1)},${h} L2,${h} Z" fill="${color}22" stroke="none"/>`+
   `<path d="${dp}" fill="none" stroke="${color}" stroke-width="1.4"/>`+
   `<line x1="2" y1="${ym}" x2="${w-2}" y2="${ym}" stroke="#5d7186" stroke-dasharray="3,3" stroke-width=".7"/>`+
   `<circle cx="${X(vals.length-1).toFixed(1)}" cy="${Y(vals[vals.length-1]).toFixed(1)}" r="1.8" fill="${color}"/></svg>`;}
const lbl=c=>c.includes('P+R')||c.includes('R+R')?'+':c.includes('PY')?'PaYd':c==='P TD'?'PaTD':c.includes('RecY')?'RcYd':c.includes('Recep')?'Rec':c.includes('RY')?'RuYd':c.includes('TD')?'TD':c;
function allowLine(def,grp,D){
  const d=D[def];if(!d||!J.groupStats[grp])return '—';
  return J.groupStats[grp].filter(c=>!c.includes('P+R')&&!c.includes('R+R')).map(c=>{const o=d.stats[c];
    return `${(+o.avg).toFixed(1)}<span class="mini">${lbl(c)}</span>&nbsp;${badge(o.rank)}`}).join(' &nbsp;');}
const ORDER={QB:['QB PY','QB RY','P TD','QB TD'],
 RB1:['RB1 RY','RB1 Recep','RB1 RecY','RB1 TD'],
 RB2:['RB2+ RY','RB2 Recep','RB2 RecY','RB2 TD'],
 WR1:['WR1 RecY','WR1 Recep',null,'WR1 TD'],WR2:['WR2 RecY','WR2 Recep',null,'WR2 TD'],
 WR3:['WR3 RecY','WR3 Recep',null,'WR3 TD'],'WR4+':['WR4+ RecY','WR4+ Recep',null,'WR4+ TD'],
 TE1:['TE1 RecY','TE1 Recep',null,'TE1 TD'],TE2:['TE2 RecY','TE2 Recep',null,'TE2 TD'],
 'D/ST':[null,null,null,'D/ST TD']};
function allowCells(def,grp,D){const d=D[def];
  return (ORDER[grp]||[null,null,null,null]).map(c=>{
    if(!c||!d)return '<td class="st"></td>';
    const o=d.stats[c];
    return `<td class="st">${(+o.avg).toFixed(1)}<span class="mini">${lbl(c)}</span>${badge(o.rank)}</td>`}).join('');}
function fieldTilt(vis,home,pos){
  let yl='';for(let i=1;i<10;i++){const x=26+i*26.8;
    yl+=`<line x1="${x.toFixed(1)}" y1="2" x2="${x.toFixed(1)}" y2="16" stroke="${i===5?'#3f7a4e':'#274d33'}" stroke-width="${i===5?1.6:1}"/>`;
    yl+=`<line x1="${(x-13.4).toFixed(1)}" y1="6" x2="${(x-13.4).toFixed(1)}" y2="8" stroke="#274d33" stroke-width="1"/>`;
    yl+=`<line x1="${(x-13.4).toFixed(1)}" y1="10" x2="${(x-13.4).toFixed(1)}" y2="12" stroke="#274d33" stroke-width="1"/>`;}
  const cx=26+(Math.max(0,Math.min(100,pos))/100)*268;
  return `<svg viewBox="0 0 320 18" preserveAspectRatio="none" style="width:100%;height:16px;display:block;margin:2px 0 10px">
   <rect x="0" y="2" width="320" height="14" fill="#0a2414"/>
   <rect x="0" y="2" width="26" height="14" fill="${hex2rgba(vivid(vis),.55)}"/>
   <rect x="294" y="2" width="26" height="14" fill="${hex2rgba(vivid(home),.55)}"/>${yl}
   <ellipse cx="${cx.toFixed(1)}" cy="9" rx="5.2" ry="3.4" fill="#5c3a1e" stroke="#cfd8dc" stroke-width=".6"/>
   <line x1="${(cx-2.4).toFixed(1)}" y1="9" x2="${(cx+2.4).toFixed(1)}" y2="9" stroke="#e6e6e6" stroke-width=".8"/></svg>`;}
function badge(rank){if(rank===''||rank==null||isNaN(rank))return '<span class="dim">—</span>';
  return `<span class="badge" style="background:${gradeColor(+rank)}">${(+rank).toFixed(+rank%1?1:0)}</span>`}
function psi(v){if(v==null||isNaN(v))return '—';
  return `<span class="psi" style="color:${gradeColor(+v)}">${(+v).toFixed(1)}</span>`}
function spec(v,max){const w=max>0?Math.min(100,100*v/max):0;
  return `<span class="specwrap"><span class="spec" style="width:${w}%"></span>${v}</span>`}
const TEAM={
 ARI:{n:'Cardinals',s:'ari',c1:'#e05a7e'},ATL:{n:'Falcons',s:'atl',c1:'#d94f5c'},
 BAL:{n:'Ravens',s:'bal',c1:'#9d7bff'},BUF:{n:'Bills',s:'buf',c1:'#4c8fe0'},
 CAR:{n:'Panthers',s:'car',c1:'#0085CA'},CHI:{n:'Bears',s:'chi',c1:'#C83803'},
 CIN:{n:'Bengals',s:'cin',c1:'#FB4F14'},CLE:{n:'Browns',s:'cle',c1:'#FF3C00'},
 DAL:{n:'Cowboys',s:'dal',c1:'#7ba7de'},DEN:{n:'Broncos',s:'den',c1:'#FB4F14'},
 DET:{n:'Lions',s:'det',c1:'#2f9fe0'},GB:{n:'Packers',s:'gb',c1:'#FFB612'},
 HOU:{n:'Texans',s:'hou',c1:'#d94f5c'},IND:{n:'Colts',s:'ind',c1:'#7ba7de'},
 JAX:{n:'Jaguars',s:'jax',c1:'#D7A22A'},KC:{n:'Chiefs',s:'kc',c1:'#ff5d54'},
 LV:{n:'Raiders',s:'lv',c1:'#A5ACAF'},LAC:{n:'Chargers',s:'lac',c1:'#2fa5e0'},
 LAR:{n:'Rams',s:'lar',c1:'#FFA300'},MIA:{n:'Dolphins',s:'mia',c1:'#12b5c0'},
 MIN:{n:'Vikings',s:'min',c1:'#9d7bff'},NE:{n:'Patriots',s:'ne',c1:'#d94f5c'},
 NO:{n:'Saints',s:'no',c1:'#D3BC8D'},NYG:{n:'Giants',s:'nyg',c1:'#7ba7de'},
 NYJ:{n:'Jets',s:'nyj',c1:'#3fd08e'},PHI:{n:'Eagles',s:'phi',c1:'#0fae94'},
 PIT:{n:'Steelers',s:'pit',c1:'#FFB612'},SEA:{n:'Seahawks',s:'sea',c1:'#69BE28'},
 SF:{n:'49ers',s:'sf',c1:'#e04646'},TB:{n:'Buccaneers',s:'tb',c1:'#e0654f'},
 TEN:{n:'Titans',s:'ten',c1:'#4B92DB'},WAS:{n:'Commanders',s:'wsh',c1:'#c04141'}};
const LOGO=t=>`https://a.espncdn.com/i/teamlogos/nfl/500/${(TEAM[t]||{s:t.toLowerCase()}).s}.png`;
const tlogo=(t,px=17)=>TEAM[t]?`<img class="tl" src="${LOGO(t)}" style="width:${px}px;height:${px}px" alt="">`:'';
const tcell=t=>TEAM[t]?`<span class="tc">${tlogo(t)}<span style="color:${TEAM[t].c1}">${t}</span></span>`:esc(t||'');
const oppcell=o=>!o||o==='BYE'?(o||'—'):(o[0]==='@'?'@':'')+tcell(o.replace('@',''));
const POSC={QB:'#4fc3f7',RB:'#b388ff',FB:'#b388ff',WR:'#f06292',TE:'#ffd600','D/ST':'#90a4ae'};
const posOf=x=>!x?'':(x[0]==='D'?'D/ST':x.slice(0,2));
function posIcon(p,px=12){const c=POSC[p]||'#8b98a5';
  const G={QB:`<ellipse cx="8" cy="8" rx="6" ry="3.7" transform="rotate(-28 8 8)" fill="none" stroke="${c}" stroke-width="1.2"/><path d="M6.2 9.4 L9.8 6.6 M7 9.9 L7.6 8.4 M8.4 7.8 L9 6.3" stroke="${c}" stroke-width="1" fill="none"/>`,
  RB:`<path d="M2 12 C5.5 12 5.5 5 8.5 5 L12.5 5 M12.5 5 L10 2.8 M12.5 5 L10 7.2" fill="none" stroke="${c}" stroke-width="1.4"/>`,
  WR:`<path d="M8 14.5 L8 4 M8 7 L12.4 3.4 M8 7 L3.6 3.4 M8 10.5 L12.4 10.5" fill="none" stroke="${c}" stroke-width="1.3"/>`,
  TE:`<rect x="3" y="9.5" width="5" height="5" fill="none" stroke="${c}" stroke-width="1.2"/><path d="M8 9.5 C8 5.5 10.5 5 13 2.8 M13 2.8 L12.6 5.6 M13 2.8 L10.2 3.2" fill="none" stroke="${c}" stroke-width="1.2"/>`,
  'D/ST':`<path d="M8 1.8 L13.2 3.8 V8 C13.2 11.6 10.9 13.7 8 14.8 C5.1 13.7 2.8 11.6 2.8 8 V3.8 Z" fill="none" stroke="${c}" stroke-width="1.3"/>`};
  return `<svg width="${px}" height="${px}" viewBox="0 0 16 16" style="vertical-align:-2px">${G[p]||G['D/ST']}</svg>`;}
const slotchip=x=>{const p=posOf(x);const c=POSC[p]||'#8b98a5';
  return `<span class="pos" style="color:${c};border-color:${c}55">${posIcon(p,11)}${x}</span>`};
const LCACHE={};
function logoPt(t,px=22){const k=t+'_'+px;if(LCACHE[k])return LCACHE[k];
  const cv=document.createElement('canvas');cv.width=cv.height=px;LCACHE[k]=cv;
  const im=new Image();im.onload=()=>{try{cv.getContext('2d').drawImage(im,0,0,px,px)}catch(e){}
    if(window.phChart)try{phChart.update('none')}catch(e){}
    if(window.tdChart)try{tdChart.update('none')}catch(e){}

      a.air+=l[LOG.ptd];a.gnd+=l[LOG.rtd];a.g.add(l[LOG.season]+'-'+l[LOG.week]);});

      data:{datasets:[{data:ps,parsing:false,pointStyle:ps.map(p2=>logoPt(p2.t,19)),borderColor:'transparent'}]},
      options:{maintainAspectRatio:false,plugins:{legend:{display:false},
        tooltip:{callbacks:{label:c2=>`${c2.raw.t}: ${c2.raw.x} air &middot; ${c2.raw.y} ground TD/gm — \u03a3 ${(c2.raw.x+c2.raw.y).toFixed(2)}`.replace(/&middot;/g,'·')}}},
      scales:{x:{title:{display:true,text:'passing TDs allowed /gm',color:'#7d7d7d',font:{family:'monospace',size:10}},ticks:{color:'#5d7186'},grid:{color:'#141414'}},
        y:{title:{display:true,text:'rushing TDs allowed /gm',color:'#7d7d7d',font:{family:'monospace',size:10}},ticks:{color:'#5d7186'},grid:{color:'#141414'}}}},
      plugins:[equip]});
  })();
  function render(){
    const wk=+$('#tdWk').value,fp=$('#tdPos').value,sc=$('#tdSlot').value,tm=$('#tdTeam').value,D=J.dvp.combined;
    const groups=['QB','RB1','RB2','WR1','WR2','WR3','WR4+','TE1','TE2'];
    const rows=[];
    const lg={};groups.forEach(g=>{const arr=Object.keys(D).map(t=>g==='QB'?D[t].stats['P TD'].avg+D[t].stats['QB TD'].avg:D[t].stats[g+' TD'].avg);lg[g]={mx:Math.max(...arr),av:mean(arr)}});
    groups.forEach(g=>{
      if(sc&&sc!=='core'&&g!==sc)return;
      UNIVERSE.filter(u=>u.grp===g&&u.inj!=='-1'&&u.slot===(g==='QB'?'QB1':g)).forEach(u=>{
      if(fp&&posOf(g)!==fp)return;
      if(tm&&u.team!==tm)return;
      if(sc==='core'&&g==='WR4+'&&u.dslot!=='WR4')return;
      if(sc==='core'&&g==='TE2'&&u.depth>2)return;
      const o=(J.sched26[u.team]||[])[wk-1]||'';if(!o||o==='BYE')return;
      const def=o.replace('@','');const d=D[def];if(!d)return;
      let cols,score;
      let meas;
      if(g==='QB'){cols=[['PaTD',d.stats['P TD']],['ruTD',d.stats['QB TD']]];
        score=(d.stats['P TD'].rank+d.stats['QB TD'].rank)/2;meas=d.stats['P TD'].avg+d.stats['QB TD'].avg;}
      else{cols=[['TD',d.stats[g+' TD']]];score=d.stats[g+' TD'].rank;meas=d.stats[g+' TD'].avg;}
      rows.push({u,g,o,def,cols,score,meas});});});
    rows.sort((a,b)=>a.score-b.score);
    /* collider scatter: x = TD matchup rank (reversed), y = player's own TDs/gm 2025 */
    const plot=rows.slice(0,130).map(r=>{
      const Ls=J.logs.filter(l=>l[LOG.player]===r.u.player&&l[LOG.season]===2025);
      const y2=Ls.length?mean(Ls.map(l=>l[LOG.ptd]+l[LOG.rtd]+l[LOG.rectd])):0;
      return {x:r.score,y:+y2.toFixed(2),t:r.u.player,tm:r.u.team,g:r.g};});
    const YM=mean(plot.map(p2=>p2.y));
    if(tdChart)tdChart.destroy();
    const quad={id:'quad',afterDraw(ch){const x2=ch.scales.x,y3=ch.scales.y;if(!x2||!y3)return;
      const ctx=ch.ctx;ctx.save();
      ctx.strokeStyle='rgba(230,230,230,.22)';ctx.setLineDash([5,5]);
      ctx.beginPath();ctx.moveTo(x2.getPixelForValue(16.5),y3.top);ctx.lineTo(x2.getPixelForValue(16.5),y3.bottom);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x2.left,y3.getPixelForValue(YM));ctx.lineTo(x2.right,y3.getPixelForValue(YM));ctx.stroke();
      ctx.setLineDash([]);ctx.font='10px monospace';
      ctx.fillStyle='rgba(0,200,83,.75)';ctx.textAlign='right';
      ctx.fillText('FUSION CORE — scorers in open fields',x2.right-8,y3.top+14);
      ctx.fillStyle='rgba(125,125,125,.7)';ctx.textAlign='left';
      ctx.fillText('PROVEN, BUT WALLED OFF',x2.left+8,y3.top+14);
      ctx.fillText('DEAD ZONE',x2.left+8,y3.bottom-8);
      ctx.fillStyle='rgba(77,208,225,.75)';ctx.textAlign='right';
      ctx.fillText('OPEN FIELD, UNPROVEN',x2.right-8,y3.bottom-8);
      ctx.restore();}};
    tdChart=new Chart($('#tdCanvas'),{type:'scatter',
      data:{datasets:[{data:plot,parsing:false,pointStyle:plot.map(p2=>logoPt(p2.tm,17)),borderColor:'transparent'}]},
      options:{maintainAspectRatio:false,plugins:{legend:{display:false},
        tooltip:{callbacks:{label:c2=>`${c2.raw.t} (${c2.raw.g}) — TD field rank ${c2.raw.x} · ${c2.raw.y} TD/gm '25`}}},
      scales:{x:{reverse:true,title:{display:true,text:'TD matchup rank (right = opponent allows the most TDs)',color:'#7d7d7d',font:{family:'monospace',size:10}},ticks:{color:'#5d7186'},grid:{color:'#141414'}},
        y:{title:{display:true,text:"player TDs per game ('25)",color:'#7d7d7d',font:{family:'monospace',size:10}},ticks:{color:'#5d7186'},grid:{color:'#141414'}}}},
      plugins:[quad]});
    $('#tdTbl').innerHTML=`<table class="fx"><colgroup><col style="width:34px"><col style="width:170px"><col style="width:58px"><col style="width:82px"><col style="width:66px"><col style="width:230px"><col style="width:60px"><col style="width:96px"><col></colgroup>
      <thead><tr><th>#</th><th>player</th><th>tm</th><th>slot</th><th>opp</th>
      <th style="text-align:left">TDs opp allows /gm (rank)</th><th class="rk">TD &Psi;</th><th>&omega; wkly TD</th><th style="text-align:left">TD volume vs role league range (tick = lg avg)</th></tr></thead><tbody>
      ${rows.map((r,i)=>`<tr><td class="mini">${i+1}</td><td class="pp plink" data-p="${r.u.player}">${esc(r.u.player)}</td><td>${tcell(r.u.team)}</td>
      <td>${slotchip(r.u.dslot||r.g)}</td><td>${oppcell(r.o)}</td>
      <td style="text-align:left">${r.cols.map(([n,o2])=>`${(+o2.avg).toFixed(1)}<span class="mini">${n}</span>&nbsp;${badge(o2.rank)}`).join(' &nbsp;')}</td>
      <td>${psi(r.score)}</td><td>${sparkWave(series(r.def,r.g==='QB'?'P TD':r.g+' TD'),vivid(r.def),80,18)}</td>
      <td><div class="tdbar"><div class="fill" style="width:${(r.meas/lg[r.g].mx*100).toFixed(1)}%;background:linear-gradient(90deg,${gradeColor(r.score)}55,${gradeColor(r.score)})"></div><span class="tick" style="left:${(lg[r.g].av/lg[r.g].mx*100).toFixed(1)}%"></span><span class="val">${r.meas.toFixed(1)}/gm</span></div></td></tr>`).join('')}
      </tbody></table><p class="note">${rows.length} players &middot; combined ${J.blend} DvP</p>`;
  }
  ['tdWk','tdPos','tdSlot','tdTeam'].forEach(id=>$('#'+id).onchange=render);render();
}
home();dchart();lab();ranks();matrix();sked();tdboard();chamber();defense();player();insights();
</script></body></html>
