/* ============================================================
   RAINMAN v2 shell — Bloomberg-grade terminal
   type: Inter for UI chrome, JetBrains Mono for data · one accent (amber) · muted surfaces
   ============================================================ */
#legacyNav{display:none}
#app{min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
/* row 1: brand · section tabs · find / week / tools */
#hdr{display:flex;align-items:stretch;gap:0;padding:0 20px;height:46px;border-bottom:1px solid var(--edge);font-family:var(--ui)}
.brand{display:flex;align-items:center;gap:8px;padding-right:16px;margin-right:6px;border-right:1px solid var(--edge);font:700 13.5px/1 var(--ui);letter-spacing:.12em;color:var(--txt);white-space:nowrap}
.lgsw{display:inline-flex;border:1px solid var(--edge2);border-radius:4px;overflow:hidden;margin-left:4px}
.lgsw a{padding:3px 7px;font:600 10px/1.2 var(--ui);letter-spacing:.06em;color:var(--dim);text-decoration:none;border-right:1px solid var(--edge2)}
.lgsw a:last-child{border-right:0}.lgsw a:hover{color:var(--txt)}.lgsw a.on{background:var(--accent);color:#1a1200}
#tnav{display:flex;flex-wrap:nowrap;gap:0;overflow-x:auto;scrollbar-width:none;min-width:0;padding:0}
#tnav button{background:none;border:0;border-bottom:2px solid transparent;border-top:2px solid transparent;border-radius:0;color:var(--dim);padding:0 10px;font:500 12.5px/1 var(--ui);letter-spacing:.01em;text-transform:none;cursor:pointer;white-space:nowrap;flex:none}
#tnav button:hover{color:var(--txt)}#tnav button.on{color:var(--txt);border-bottom-color:var(--accent);font-weight:600}
#tnav button .fk{display:inline;font:500 9px/1 var(--mono);color:var(--dim2);margin-right:5px;letter-spacing:0}#tnav button.on .fk{color:var(--accent)}
#snav[hidden]{display:none}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px;padding-left:12px}
.hright .gl{margin-left:4px}
#gFind{background:var(--s2);border:1px solid var(--edge2);color:var(--dim);padding:5px 9px;font:500 11.5px/1.2 var(--ui);border-radius:5px;cursor:pointer;display:flex;align-items:center;gap:6px;letter-spacing:0;white-space:nowrap}
#gFind:hover{border-color:var(--accent);color:var(--txt)}#gFind kbd{font:500 9.5px/1 var(--mono);color:var(--dim2);border:1px solid var(--edge2);border-radius:3px;padding:2px 4px}
#gHelp,#gShare{background:var(--s2);border:1px solid var(--edge2);color:var(--dim);width:28px;height:28px;border-radius:5px;cursor:pointer;font:600 12px/1 var(--ui)}
#gHelp:hover,#gShare:hover{color:var(--txt);border-color:var(--accent)}
/* row 2: views of the active section · one-line description of the current view */
#sub{display:flex;align-items:stretch;gap:14px;padding:0 20px;height:36px;background:var(--panel);border-bottom:1px solid var(--edge);font-family:var(--ui)}
#snav{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;min-width:0;flex:none;max-width:100%}
#snav .sitem{display:flex;align-items:center;gap:6px;padding:0 12px;color:var(--dim);text-decoration:none;font:500 12px/1 var(--ui);border-bottom:2px solid transparent;border-top:2px solid transparent;white-space:nowrap}
#snav .sitem:hover{color:var(--txt);background:var(--s2)}
#snav .sitem.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
#snav .sitem kbd{font:500 9.5px/1 var(--mono);color:var(--dim2);border:1px solid var(--edge2);border-radius:3px;padding:2px 4px}
#snav .sitem.on kbd{color:var(--accent);border-color:var(--accent)}
#crumb{display:flex;align-items:center;min-width:0;flex:1;color:var(--dim);font:400 11.5px/1.3 var(--ui)}
#crumb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* footer: data provenance */
.sfoot{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:10px 20px 14px;border-top:1px solid var(--edge);font:400 10.5px/1.4 var(--ui);color:var(--dim2)}
.sfoot .sub{white-space:nowrap}.sfoot .sub b{color:var(--dim);font-weight:600}
.sfoot a{color:var(--dim);text-decoration:none;border:1px solid var(--edge2);border-radius:4px;padding:2px 8px}.sfoot a:hover{color:var(--txt);border-color:var(--accent)}
/* top bar + filters */
#top{position:sticky;top:0;z-index:15;background:rgba(10,12,16,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--edge)}
#gSum{font:400 11px/1.3 var(--ui);color:var(--dim);margin-left:auto;max-width:40vw;text-align:right}
.gl{color:var(--dim2);font:600 9.5px/1 var(--ui);letter-spacing:.14em}
#gbar{display:flex;gap:8px;align-items:center;padding:6px 20px 7px;flex-wrap:wrap;border-bottom:0;background:transparent}
#gbar.live{border-bottom:0}#gbar.has #gClear{color:var(--accent);border-color:var(--accent)}
#gbar .gl{margin-left:6px}#gbar .gl:first-child{margin-left:0}
.fanonly{display:none!important}
.chips{display:flex;gap:3px;flex-wrap:wrap}
.chips button,#gClear,.tabs button,.r11seg button,.r11mk button,.r11lc button,.r11rg button{font-family:var(--ui)}
.chips button{background:var(--s2);border:1px solid var(--edge2);color:var(--dim);padding:3px 9px;border-radius:4px;font:500 10.5px/1.3 var(--ui);letter-spacing:.04em;text-transform:none;cursor:pointer}
.chips button:hover{border-color:var(--accent);color:var(--txt)}
.chips button.on{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:600}
.chips button .n{color:var(--dim2);font-size:9.5px;margin-left:3px}.chips button.on .n{color:#1a1200}
#gClear{background:var(--s2);border:1px solid var(--edge2);color:var(--dim);padding:3px 9px;border-radius:4px;font:500 10.5px/1.3 var(--ui);letter-spacing:0;cursor:pointer}
#gClear:hover{color:var(--red);border-color:var(--red)}
select,input{background:var(--s2);color:var(--txt);border:1px solid var(--edge2);padding:4px 8px;font:500 11.5px/1.3 var(--ui);border-radius:4px}
select:focus,input:focus{outline:none;border-color:var(--accent)}
#gWk{font-weight:600}
/* content */
main{padding:14px 20px 40px;font-family:var(--mono)}
main>div{animation:fadein .14s ease-out}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:12px 14px;margin-bottom:14px}
h3{color:var(--txt);font:600 12.5px/1.3 var(--ui);margin:0 0 10px;text-transform:none;letter-spacing:0;border-bottom:1px solid var(--edge);padding-bottom:8px}
h3 .f{color:var(--dim);font:400 11px/1.4 var(--ui);letter-spacing:0;text-transform:none;margin-left:6px}
table{font-size:11.5px}
th,td{border-bottom:1px solid var(--edge)}
th{color:var(--dim);background:var(--panel);font:600 10px/1.3 var(--ui);letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--edge2)}
th.rk{color:var(--cyan)}
tr:hover td{background:var(--s2)}
.note{color:var(--dim);font:400 11px/1.5 var(--ui)}
.mini{font-size:10.5px;color:var(--dim)}
.controls{gap:8px}
.tabs{gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:var(--s2);border:1px solid var(--edge2);color:var(--dim);padding:5px 12px;border-radius:5px;font:500 11.5px/1.3 var(--ui);text-transform:none;letter-spacing:0}
.tabs button:hover{color:var(--txt);border-color:var(--accent)}
.tabs button.on{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:600}
#defTabs,#r11Tabs{display:none}
/* matchup board: player-average block */
#labTbl tr.grp th{font:600 9.5px/1.2 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);text-align:center;border-bottom:1px solid var(--edge);border-left:1px solid var(--edge2);padding:4px 6px;background:var(--s2)}
#labTbl tr.grp th:first-child,#labTbl tr.grp th:last-child{border-left:0;background:transparent}
#labTbl tr.grp th.pa{color:var(--cyan)}#labTbl tr.grp th.pa b{color:var(--txt)}#labTbl tr.grp th.pa span{text-transform:none;letter-spacing:0}
#labTbl th.pa{color:var(--cyan)}
#labTbl table.lab2 th.gs,#labTbl table.lab2 td.gs{border-left:2px solid var(--edge2)}#labTbl table.lab2 th.md:first-of-type,#labTbl table.lab2 td.md:first-of-type{border-left:2px solid var(--edge2)}
#labTbl table.lab2 tr.grp th.g0{text-align:left;background:transparent;border-left:0}#labTbl table.lab2 tr.grp th.op{color:var(--acc)}#labTbl table.lab2 tr.grp th.md{color:var(--dim)}
#labTbl table.lab2 th.op{color:var(--acc)}#labTbl table.lab2 td.op{white-space:nowrap;text-align:right}#labTbl table.lab2 td.op .ov{display:inline-block;min-width:38px;text-align:right;font-weight:600;margin-right:5px;color:var(--txt)}
#labTbl table.lab2 td.pa{text-align:right}#labTbl table.lab2 td.md{color:var(--dim)}#labTbl table.lab2 tbody tr:hover td.op{background:rgba(232,179,57,.05)}#labTbl table.lab2 tbody tr:hover td.pa{background:rgba(88,166,255,.05)}

<script>
const J = __DATA__;
const LG=J.league||{code:'nfl'};const NWK=LG.weeks||18;const IS_NFL=LG.code!=='ncaa';const NT=LG.nTeams||32,MID=(NT+1)/2,HALF=(NT-1)/2,RS=NT/32;
/* ---------- helpers ---------- */
const $=q=>document.querySelector(q);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const stdev=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)*(x-m))))};
const gradeT=(rank,n=NT)=>Math.max(0,Math.min(1,(rank-1)/(n-1)));
const gradeH=t=>t<.5?145-(t*2)*85:60-((t-.5)*2)*60;
function gradeColor(rank,n=NT){const t=gradeT(rank,n);const h=gradeH(t);return `hsl(${h},${h>100?45:60}%,${h>100?48:58}%)`}
// tinted pill: colored figure on a translucent tint of the same hue — reads on pure black without shouting
function gradeStyle(rank,n=NT){const t=gradeT(rank,n);const h=gradeH(t);const sat=h>100?45:62;
  return `background:hsla(${h},${sat}%,45%,.17);color:hsl(${h},${sat}%,${h>100?55:64}%);box-shadow:inset 0 0 0 1px hsla(${h},${sat}%,50%,.32)`}
function gradeBg(rank){ // 6 discrete bands: greens -> slate middle -> reds
  if(rank<=5*RS)  return 'hsla(145,55%,34%,.9)';
  if(rank<=10*RS) return 'hsla(150,38%,25%,.9)';
  if(rank<=16*RS) return 'hsla(220,6%,20%,.9)';
  if(rank<=21*RS) return 'hsla(220,6%,14%,.9)';
  if(rank<=27*RS) return 'hsla(8,42%,30%,.9)';
  return 'hsla(4,58%,40%,.9)';}
const SCACHE={};
function series(def,stat){const se=TREND_SE;const k=def+'|'+stat;
  if(SCACHE[k])return SCACHE[k];
  return SCACHE[k]=J.weekly.filter(r=>r[0]===def&&r[1]===se).sort((a,b)=>a[2]-b[2]).map(r=>r[WCOL[stat]]);}
function sparkWave(vals,color,w=96,h=24){
  if(!vals||vals.length<2)return '';
  const mx=Math.max(...vals,1),mn=Math.min(...vals,0);
  const X=i=>(i/(vals.length-1))*(w-4)+2, Y=v=>h-3-((v-mn)/((mx-mn)||1))*(h-7);
  let dp=`M${X(0).toFixed(1)},${Y(vals[0]).toFixed(1)}`;
  for(let i=1;i<vals.length;i++){const xc=((X(i-1)+X(i))/2).toFixed(1);
    dp+=` Q${xc},${Y(vals[i-1]).toFixed(1)} ${X(i).toFixed(1)},${Y(vals[i]).toFixed(1)}`;}
  const ym=Y(mean(vals)).toFixed(1);
  return `<svg class="wave" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`+
   `<path d="${dp} L${X(vals.length-1).toFixed(1)},${h} L2,${h} Z" fill="${color}22" stroke="none"/>`+
   `<path d="${dp}" fill="none" stroke="${color}" stroke-width="1.4"/>`+
   `<line x1="2" y1="${ym}" x2="${w-2}" y2="${ym}" stroke="#5d7186" stroke-dasharray="3,3" stroke-width=".7"/>`+
   `<circle cx="${X(vals.length-1).toFixed(1)}" cy="${Y(vals[vals.length-1]).toFixed(1)}" r="1.8" fill="${color}"/></svg>`;}
const lbl=c=>c.includes('P+R')||c.includes('R+R')?'+':c.includes('PY')?'PaYd':c==='P TD'?'PaTD':c.includes('RecY')?'RcYd':c.includes('Recep')?'Rec':c.includes('RY')?'RuYd':c.includes('TD')?'TD':c;
function allowLine(def,grp,D){
  const d=D[def];if(!d||!J.groupStats[grp])return '—';
  return J.groupStats[grp].filter(c=>!c.includes('P+R')&&!c.includes('R+R')).map(c=>{const o=d.stats[c];
    return `${(+o.avg).toFixed(1)}<span class="mini">${lbl(c)}</span>&nbsp;${badge(o.rank)}`}).join(' &nbsp;');}
const ORDER={QB:['QB PY','QB RY','P TD','QB TD'],
 RB1:['RB1 RY','RB1 Recep','RB1 RecY','RB1 TD'],
 RB2:['RB2+ RY','RB2 Recep','RB2 RecY','RB2 TD'],
 WR1:['WR1 RecY','WR1 Recep',null,'WR1 TD'],WR2:['WR2 RecY','WR2 Recep',null,'WR2 TD'],
 WR3:['WR3 RecY','WR3 Recep',null,'WR3 TD'],'WR4+':['WR4+ RecY','WR4+ Recep',null,'WR4+ TD'],
 TE1:['TE1 RecY','TE1 Recep',null,'TE1 TD'],TE2:['TE2 RecY','TE2 Recep',null,'TE2 TD'],
 'D/ST':[null,null,null,'D/ST TD']};
function allowCells(def,grp,D,u){const d=D[def];
  const L=u?(PLOGS[u.ln||u.player]||[]).filter(l=>l[LOG.season]===LAST_SE):[];
  return (ORDER[grp]||[null,null,null,null]).map(c=>{
    if(!c||!d)return '<td class="st"></td>';
    const o=d.stats[c];let his='';
    if(u&&L.length){const a=avgOf(L,c);const up=o.avg>a+1e-9;his=`<div class="his" title="his own per-game average this season (${L.length} gp) vs what ${def} allows to the slot">his ${a.toFixed(decOf(c))} <i class="${up?'pa-up':'pa-dn'}">${up?'&#9650;':'&#9660;'}</i></div>`}
    return `<td class="st">${badge(o.rank)} ${(+o.avg).toFixed(1)}<span class="mini">${lbl(c)}</span>${his}</td>`}).join('');}
function fieldTilt(vis,home,pos){
  let yl='';for(let i=1;i<10;i++){const x=26+i*26.8;
    yl+=`<line x1="${x.toFixed(1)}" y1="2" x2="${x.toFixed(1)}" y2="16" stroke="${i===5?'#3f7a4e':'#274d33'}" stroke-width="${i===5?1.6:1}"/>`;
    yl+=`<line x1="${(x-13.4).toFixed(1)}" y1="6" x2="${(x-13.4).toFixed(1)}" y2="8" stroke="#274d33" stroke-width="1"/>`;
    yl+=`<line x1="${(x-13.4).toFixed(1)}" y1="10" x2="${(x-13.4).toFixed(1)}" y2="12" stroke="#274d33" stroke-width="1"/>`;}
  const cx=26+(Math.max(0,Math.min(100,pos))/100)*268;
  return `<svg viewBox="0 0 320 18" preserveAspectRatio="none" style="width:100%;height:16px;display:block;margin:2px 0 10px">
   <rect x="0" y="2" width="320" height="14" fill="#0a2414"/>
   <rect x="0" y="2" width="26" height="14" fill="${hex2rgba(vivid(vis),.55)}"/>
   <rect x="294" y="2" width="26" height="14" fill="${hex2rgba(vivid(home),.55)}"/>${yl}
   <ellipse cx="${cx.toFixed(1)}" cy="9" rx="5.2" ry="3.4" fill="#5c3a1e" stroke="#cfd8dc" stroke-width=".6"/>
   <line x1="${(cx-2.4).toFixed(1)}" y1="9" x2="${(cx+2.4).toFixed(1)}" y2="9" stroke="#e6e6e6" stroke-width=".8"/></svg>`;}
function badge(rank){if(rank===''||rank==null||isNaN(rank))return '<span class="dim">—</span>';
  return `<span class="badge" style="${gradeStyle(+rank)}">${(+rank).toFixed(+rank%1?1:0)}</span>`}
function psi(v){if(v==null||isNaN(v))return '—';

function irank(block,team,key,hi=true){const vals=Object.entries(block).map(([t,r])=>[t,r[key]]).filter(x=>x[1]!=null&&!isNaN(x[1]));
  vals.sort((a,b)=>hi?b[1]-a[1]:a[1]-b[1]);const i=vals.findIndex(x=>x[0]===team);return i<0?null:i+1}

const pkWho=p=>p.player?pn(p.player,p.team):p.team?p.team.split('@').map(x=>tcell(x)).join(' <span class="mini">@</span> '):'';

function games(){
  $('#games').innerHTML=`<div id="gmOut"></div>`;
  const bt=BET.backtest;const TYPES=['ALL','ML','ATS','TOTAL','PROP','TD'];
  let ft='ALL',hist=false,grp=true,minE=3,one=true,sk='edge',sa=false,gsel='';
  const ALL=PICKS.filter(p=>p.type!=='DFS');
  const pkEdgePct=pkEdgeVal;
  const resChipP=r=>r==='W'?'<span class="badge" style="background:#00c853">W</span>':r==='L'?'<span class="badge" style="background:#ff5252">L</span>':r==='P'||r==='PUSH'?'<span class="badge" style="background:#7d7d7d">P</span>':'<span class="pend">live</span>';
  /* every filter the card honours: header slate / game / team, its own game picker, type, minimum edge, one line per player */
  function pass(p){
    const t=pkTeams(p);
    if(ACT&&!t.some(inF))return false;
    if(gsel&&pkGame(p)!==gsel)return false;
    if(ft!=='ALL'&&p.type!==ft)return false;
    if(G.pos.size&&p.player){const u=UNIVERSE.find(x=>x.player===p.player&&x.team===p.team);if(u&&!G.pos.has(u.pos))return false}
    const e=pkEdgePct(p);
    if(minE>0&&(e==null||e<minE/100))return false;
    return true}
  const dedupe=rows=>{if(!one)return rows;const seen={},out=[];
    rows.slice().sort((a,b)=>(pkEdgePct(b)||-9)-(pkEdgePct(a)||-9)).forEach(p=>{const k=p.player?`${p.player}|${p.market}`:`${pkGame(p)}|${p.type}`;if(seen[k])return;seen[k]=1;out.push(p)});
    return out};
  const SORT={edge:p=>pkEdgePct(p)??-9,type:p=>p.type,who:p=>(p.player||p.team||''),market:p=>p.market,model:p=>pkProb(p)??(+p.model||0),result:p=>p.result||'zz',game:p=>pkGame(p),week:p=>+p.week};
  const sortRows=rows=>rows.slice().sort((a,b)=>{const x=SORT[sk](a),y=SORT[sk](b);return (x<y?-1:x>y?1:0)*(sa?1:-1)});
  const th=(k,l,t)=>`<th data-k="${k}" class="${sk===k?(sa?'srt-asc':'srt-desc'):''}" title="${t||''}">${l}</th>`;
  const row=p=>`<tr class="${p.result?'done':''}"><td><span class="ptype ${p.type}">${PK_TL[p.type]}</span></td>
    <td class="pw">${pkWho(p)}${p.opp?` <span class="mini">${p.opp[0]==='@'?'@':'vs'} ${p.opp.replace('@','')}</span>`:''}</td>
    <td class="mini">${pkMk(p.market)}</td><td><b>${esc(String(p.side))}</b>${p.line&&p.type==='PROP'?` <span class="mini">${p.line}</span>`:''}</td>
    <td class="r mono">${pkModel(p)}</td><td class="r mono mini">${pkMref(p)} <span class="dim">${esc(p.market_src||'')}</span></td>

   Everything here reads the same payload as the live tabs and writes to none of
   them. Promote a view by moving its item into another section. */
const TPOS=['QB','RB','WR','TE'];
const tKey=p=>p==='QB'?'QB':p==='RB'?'RB1':p==='WR'?'WR1':'TE1';

/* one Matchup Lab row, reduced to what the opponent allows */
function tRows(pos,src,o){
  const D=J.dvp[src]||{},wk=G.week,q=(o.q||'').toLowerCase();
  return UNIVERSE.filter(u=>u.pos===pos&&u.grp&&inU(u)
      &&(!o.dep||u.depth<=+o.dep)
      &&(o.hin!=='x'||u.inj!=='-1')
      &&(!q||u.player.toLowerCase().includes(q))
      &&(!o.team||u.team===o.team))
    .map(u=>{
      const oppRaw=(J.sched26[u.team]||[])[wk-1]||'';
      const opp=oppRaw&&oppRaw!=='BYE'?oppRaw.replace('@',''):'';
      const d=opp&&D[opp]?D[opp]:null,stats=LABDEF[pos].stats(u.grp),gm=gameOf(u.team,wk);
      return {u,oppRaw,opp,stats,gm,
        ranks:stats.map(c=>d?d.stats[c].rank:null),
        raws:stats.map(c=>d?d.stats[c].avg:null),
        psi:d?d.comps[u.grp]:null,
        kickord:gm?SLATE_ORDER.indexOf(gm[GM.slate]):99};});
}
/* allowed-per-game, compact: whole numbers wherever a whole number still says it,
   one decimal only where rounding would collapse the value to 0 */
const tNum=v=>v==null?'':Math.abs(v)>=10?Math.round(v).toString():Math.abs(v)>=1?(+v).toFixed(1):(+v).toFixed(2).replace(/^0/,'');
/* one cell: the number, tinted by where that rank sits among the defenses */
const tCell=(v,r,tip)=>v==null?'<td class="op"><span class="dim">\u00b7</span></td>'
  :`<td class="op" title="${esc(tip||'')}${r==null?'':' \u00b7 rank '+(+r).toFixed(+r%1?1:0)+' of '+NT}">`
   +`<span class="badge" style="${r==null?'':gradeStyle(+r)}">${tNum(v)}</span></td>`;
const tPsi=v=>v==null?'<td class="md"><span class="dim">\u00b7</span></td>'
  :`<td class="md" title="mean of the opponent's ranks across this slot's stats \u00b7 1 = softest">`
   +`<span class="psi" style="color:${gradeColor(+v)}">${Math.round(v)}</span></td>`;
const tSortVal=(x,k,asc)=>k==='psi'?(x.psi==null?99:x.psi)
  :k==='player'?x.u.player:k==='team'?x.u.team:k==='opp'?(x.opp||'zzz'):k==='kick'?x.kickord
  :k[0]==='r'?(x.ranks[+k.slice(1)]==null?(asc?99:-1):x.ranks[+k.slice(1)])
  :k[0]==='v'?(x.raws[+k.slice(1)]==null?(asc?1e9:-1):x.raws[+k.slice(1)]):0;
function tWire(root){if(!root)return;root.querySelectorAll('.plink[data-p]').forEach(n=>n.onclick=()=>playerPop(n.dataset.p));
  try{logoize(root)}catch(_){}}

/* ---------------- TD Grid — cumulative + one column per position ---------------- */
const tdLbl=s=>/^\d{4}$/.test(s)?"'"+s.slice(2):s==='combined'?'cmb':s==='adjusted'?'adj':s.slice(0,4);
function tdGrid(){
  const srcs=Object.keys(J.dvp);
  /* A quarterback's slot carries TWO touchdown stats and they routinely point opposite ways —
     PHI allows the MOST quarterback rushing TDs in the league (rank 1) and nearly the fewest
     passing TDs (rank 31). Averaging those gives 16, a number that describes neither. So the
     QB stat is picked, never blended; everyone else has one TD stat and it is simply that one. */
  const tdStat=(grp,pos)=>{const st=LABDEF[pos].stats(grp).filter(c=>/TD/.test(c));
    if(st.length<2)return st;
    const mode=($('#tgQB')||{}).value||'rush';
    const pass=st.find(c=>c==='P TD'),rush=st.find(c=>c!=='P TD');
    return mode==='pass'?[pass]:mode==='both'?st:[rush]};
  const tdRank=(d,grp,pos)=>{if(!d)return null;
    const rs=tdStat(grp,pos).map(c=>d.stats[c]?d.stats[c].rank:null).filter(v=>v!=null);
    return rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:null};
  $('#tdgrid').innerHTML=`<div class="controls">
    <select id="tgDepth"><option value="1" selected>1st string only</option><option value="2">top 2 depths</option><option value="">all depths</option></select>
    <select id="tgInj"><option value="x" selected>hide OUT</option><option value="">incl. OUT</option></select>
    <select id="tgQB" title="a QB's slot has two TD-allowed stats; pick which one his column reads"><option value="rush" selected>QB: rushing / receiving TD</option><option value="pass">QB: passing TD</option><option value="both">QB: mean of both</option></select>
    <input id="tgQ" placeholder="search player..." size="15">
    <span class="note">touchdowns only. Each cell is the rank of the <b>touchdowns this week's opponent allows to that slot</b> in one data set, so a soft end zone can be read as a 2026 blip or as three years of it. rank 1 of ${NT} = allows the most = best TD matchup &middot; &mu; = mean across the sets &middot; the first column is every slot owner together, then one per position</span>
  </div>
  <div class="lgrid td5">${['ALL'].concat(TPOS).map(p=>`<section class="lgcol"><h3>${p==='ALL'?'◍ all':posIcon(p,12)+' '+p} <span class="f" id="tgN${p}"></span></h3><div id="tgB${p}"></div></section>`).join('')}</div>`;
  const sort={};['ALL'].concat(TPOS).forEach(p=>sort[p]={k:'mu',a:true});
  function col(p){
    const st=sort[p],o={dep:$('#tgDepth').value,hin:$('#tgInj').value,q:$('#tgQ').value};
    const R=[];(p==='ALL'?TPOS:[p]).forEach(pos=>{
      tRows(pos,srcs[0],o).forEach(x=>{
        const cells=srcs.map(s=>{const D=J.dvp[s]||{};return tdRank(x.opp&&D[x.opp]?D[x.opp]:null,x.u.grp,pos)});
        const got=cells.filter(v=>v!=null);
        R.push(Object.assign({},x,{pos,cells,mu:got.length?got.reduce((a,b)=>a+b,0)/got.length:null}))})});
    R.sort((a,b)=>{let x,y;
      if(st.k==='mu'){x=a.mu==null?99:a.mu;y=b.mu==null?99:b.mu}
      else if(st.k[0]==='s'){const i=+st.k.slice(1);x=a.cells[i]==null?(st.a?99:-1):a.cells[i];y=b.cells[i]==null?(st.a?99:-1):b.cells[i]}
      else if(st.k==='pos'){x=TPOS.indexOf(a.pos);y=TPOS.indexOf(b.pos)}
      else{x=tSortVal(a,st.k,st.a);y=tSortVal(b,st.k,st.a)}
      return (x<y?-1:x>y?1:0)*(st.a?1:-1)});
    $('#tgN'+p).textContent=R.length+(R.length===1?' player':' players');
    const th=(k,l,tip,cls)=>`<th class="${cls||''}" data-k="${k}" title="${esc(tip||'')}">${l}${st.k===k?(st.a?' ▲':' ▼'):''}</th>`;
    const ncol=srcs.length+1, wname=p==='ALL'?24:28, wpos=p==='ALL'?6:0, wopp=17, wnum=((100-wname-wpos-wopp)/ncol).toFixed(2);
    $('#tgB'+p).innerHTML=`<table class="lgt"><colgroup><col style="width:${wname}%">${p==='ALL'?`<col style="width:${wpos}%">`:''}<col style="width:${wopp}%">${
      Array.from({length:ncol},()=>`<col style="width:${wnum}%">`).join('')}</colgroup><thead>
      <tr class="grp"><th class="g0" colspan="${p==='ALL'?3:2}">player</th>
        <th class="op" colspan="${srcs.length}">TDs allowed to his slot \u00b7 rank of ${NT}</th>
        <th class="md">\u03bc</th></tr>
      <tr class="hd">
      ${th('player','Player')}${p==='ALL'?th('pos','')  :''}${th('opp','Opp')}
            ${srcs.map((s,i)=>th('s'+i,tdLbl(s),'touchdowns allowed to his slot \u00b7 '+s+' \u00b7 rank of '+NT)).join('')}
      ${th('mu','μ','mean rank across every data set')}</tr></thead><tbody>
      ${R.map(x=>`<tr><td class="plink" data-p="${esc(x.u.player)}">${esc(pshort(x.u.player))}${x.u.inj==='0'?' <span class="inj0">Q</span>':''}</td>
        ${p==='ALL'?`<td style="color:${POSC[x.pos]}">${posIcon(x.pos,10)}</td>`:''}<td>${oppcell(x.oppRaw)}</td>
        ${x.cells.map((v,i)=>v==null?`<td class="op${i===0?' gs':''}"><span class="dim">·</span></td>`

        ${tPsi(x.mu).replace('class="md"','class="md gs"')}</tr>`).join('')||`<tr><td colspan="${srcs.length+5}" class="dim">nothing matches</td></tr>`}</tbody></table>`;
    $('#tgB'+p).querySelectorAll('th[data-k]').forEach(h=>h.onclick=()=>{
      if(st.k===h.dataset.k)st.a=!st.a;else{st.k=h.dataset.k;st.a=true}col(p)});
    tWire($('#tgB'+p));
  }
  const all=()=>['ALL'].concat(TPOS).forEach(col);
  ['tgDepth','tgInj','tgQB'].forEach(i=>$('#'+i).onchange=all);$('#tgQ').oninput=all;all();
  RR.push(all);
}

/* ---------------- Game View — one game, everything the site knows about it ----------------
   Built out of the live pieces rather than copies: the card is the Matchups card, the depth
   tables are the Depth Charts tables, the scheme drills are the Intel drills. They are handed
   over by GV.* at boot, so when those tabs change this page changes with them. */
function gameView(){
  const srcs=Object.keys(J.dvp);
  $('#gameview').innerHTML=`<div class="controls">
    <select id="gvGame"></select>
    <select id="gvSrc" title="which data set the matchup ranks read">${srcs.map(s=>`<option ${s==='combined'?'selected':''}>${s}</option>`).join('')}</select>
    <span class="note">the game, then the number. The card is the Matchups card for this game and the row under it is the market with the model's disagreement beside it &middot; depth charts, scheme profiles, form and storylines sit behind the four strips at the bottom and build only when you open one &middot; click any name for his card</span>
  </div><div id="gvBody" class="gv"></div>`;

  /* ---- form: record, venue split, this slate, last five, ATS ---- */
  function form(t){
    const G26=(BET.games||[]).filter(g=>g.result!=null&&g.away_score!=null)
      .sort((a,b)=>a.week-b.week);
    const r={w:0,l:0,t:0,hw:0,hl:0,aw:0,al:0,pf:0,pa:0,last:[],atsW:0,atsL:0,atsP:0,ou:[0,0]};
    G26.forEach(g=>{const H=g.home_team===t,A=g.away_team===t;if(!H&&!A)return;
      const mine=+(H?g.home_score:g.away_score),theirs=+(H?g.away_score:g.home_score);
      r.pf+=mine;r.pa+=theirs;
      if(mine>theirs){r.w++;H?r.hw++:r.aw++;r.last.push('W')}
      else if(mine<theirs){r.l++;H?r.hl++:r.al++;r.last.push('L')}
      else{r.t++;r.last.push('T')}
      if(g.spread_line!=null){                       // spread_line is the home side's number
        const mySpread=H?+g.spread_line:-(+g.spread_line);
        const margin=mine-theirs+mySpread;
        if(margin>0)r.atsW++;else if(margin<0)r.atsL++;else r.atsP++;}
      if(g.total_line!=null)(mine+theirs>+g.total_line?r.ou[0]++:r.ou[1]++);
    });
    return r;
  }
  const streak=l=>l.slice(-5).map(c=>`<i class="sq ${c==='W'?'w':c==='L'?'l':''}" title="${c}"></i>`).join('');
  function formCard(t){
    const f=form(t),gp=Math.max(1,f.w+f.l+f.t);
    const bySlate=(()=>{const g=gameOf(t,G.week);if(!g)return '';const sl=g[GM.slate];
      const rows=(BET.games||[]).filter(x=>x.result!=null&&(x.away_team===t||x.home_team===t));
      let w=0,l=0;rows.forEach(x=>{const gg=(J.games26||[]).find(y=>y[GM.wk]===x.week&&y[GM.vis]===x.away_team&&y[GM.home]===x.home_team);
        if(!gg||gg[GM.slate]!==sl)return;const H=x.home_team===t;const m=+(H?x.home_score:x.away_score),o=+(H?x.away_score:x.home_score);
        if(m>o)w++;else if(m<o)l++});
      return w+l?`<tr><th>in ${SLATE_LBL[sl]||sl}</th><td>${w}-${l}</td></tr>`:''})();
    return `<table class="gvk"><tbody>
      <tr><th>record</th><td><b>${f.w}-${f.l}${f.t?'-'+f.t:''}</b> ${streak(f.last)}</td></tr>
      <tr><th>home</th><td>${f.hw}-${f.hl}</td></tr>
      <tr><th>away</th><td>${f.aw}-${f.al}</td></tr>
      <tr><th>scoring</th><td>${(f.pf/gp).toFixed(1)} for &middot; ${(f.pa/gp).toFixed(1)} against &middot; ${sgn((f.pf-f.pa)/gp)}</td></tr>
      <tr><th>ATS</th><td>${f.atsW}-${f.atsL}${f.atsP?'-'+f.atsP:''}</td></tr>
      <tr><th>O/U</th><td>${f.ou[0]}-${f.ou[1]}</td></tr>
      ${bySlate}</tbody></table>`;
  }
  /* ---- what this defense has allowed week by week, per slot ---- */
  function trend(def){
    const SL=['QB','RB1','WR1','TE1'].filter(g=>inP(posOf(g)));
    const rows=SL.map(sl=>{const stat=(J.primary||{})[sl]||(ORDER[sl]||[])[0];if(!stat)return '';
      const v=series(def,stat);if(!v||v.length<2)return '';
      const mAll=mean(v);
      const k=Math.min(3,Math.floor(v.length/2));                 // only compare a tail against a body that exists
      const recent=k>=2?mean(v.slice(-k)):null;
      const d=recent!=null&&mAll?100*(recent-mAll)/mAll:null;
      return `<tr><td>${slotchip(sl)}</td><td class="mini">${lbl(stat)}</td>
        <td>${sparkWave(v,gradeColor((J.dvp.combined[def]||{comps:{}}).comps[sl]||MID),104,20)}</td>
        <td class="mini">${mAll.toFixed(1)} <span class="dim">/g over ${v.length}</span></td>
        <td class="${d==null?'mini':d>8?'rise':d<-8?'fall':'mini'}" title="${d==null?'needs at least four weeks':'last '+k+' games vs the season'}">${d==null?'—':(d>0?'+':'')+d.toFixed(0)+'%'}</td></tr>`}).join('');
    return rows?`<table class="gvt lgt"><thead><tr class="hd"><th>slot</th><th>stat</th><th>week by week</th><th class="op">per game</th><th class="op">recent</th></tr></thead><tbody>${rows}</tbody></table>`
      :'<p class="note">not enough weekly history yet</p>';
  }
  /* ---- the market, and where the model disagrees ---- */
  function market(vis,home,wk){
    const b=(BET.games||[]).find(x=>x.week===wk&&x.away_team===vis&&x.home_team===home);
    const rows=[];
    if(b){
      const sp=b.spread_line==null?null:+b.spread_line,tt=b.total_line==null?null:+b.total_line;
      rows.push(['spread',sp==null?'—':`${home} ${sp>0?'+':''}${sp.toFixed(1)}`,
        b.model_spread==null?'—':`${home} ${+b.model_spread>0?'+':''}${(+b.model_spread).toFixed(1)}`,
        b.edge_spread==null?'':sgn(+b.edge_spread,1)+' pts',b.pick_ats||'']);
      rows.push(['total',tt==null?'—':tt.toFixed(1),
        b.model_total==null?'—':(+b.model_total).toFixed(1),
        b.edge_total==null?'':sgn(+b.edge_total,1)+' pts',b.pick_total||'']);
      rows.push(['moneyline',b.away_moneyline==null?'—':`${vis} ${mlTxt(b.away_moneyline)} / ${home} ${mlTxt(b.home_moneyline)}`,
        b.win_prob_home==null?'—':`${home} ${(100*+b.win_prob_home).toFixed(0)}%`,
        b.edge_ml_home==null?'':sgn(100*+b.edge_ml_home,1)+' pp','']);
      if(sp!=null&&tt!=null)rows.push(['implied',`${vis} ${((tt+sp)/2).toFixed(1)} &middot; ${home} ${((tt-sp)/2).toFixed(1)}`,'','','']);
    }
    const lines=rows.length?`<table class="gvk wide"><thead><tr><th></th><th>market</th><th>model</th><th>edge</th><th>pick</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td class="mini">${esc(r[4]||'')}</td></tr>`).join('')}</tbody></table>`
      :'<p class="note">no game line on file for this one</p>';
    /* player markets for this game, biggest disagreements first.
       The payload calls the edge `ev` (percent) and keeps anytime TD in its own array. */
    const mine=r=>r.week===wk&&(r.team===vis||r.team===home);
    const L=((J.betting||{}).lines||[]).filter(r=>mine(r)&&r.ev!=null)
      .map(r=>({p:r.player,m:r.market,side:r.side||'',line:r.line,proj:r.proj,ev:+r.ev,book:r.book,slot:r.slot}));
    const T=((J.betting||{}).td||[]).filter(r=>mine(r)&&r.ev!=null)
      .map(r=>({p:r.player,m:'anytime TD',side:'Yes',line:r.price==null?null:mlTxt(r.price),
                proj:r.p_model==null?null:100*+r.p_model,ev:+r.ev,book:r.book,slot:r.slot,pctProj:true}));
    const P=L.concat(T).sort((a,b)=>Math.abs(b.ev)-Math.abs(a.ev)).slice(0,14);
    const props=P.length?`<table class="gvt lgt"><thead><tr class="hd"><th>Player</th><th>Slot</th><th>market</th><th>line</th><th class="op">model</th><th class="op">EV</th></tr></thead><tbody>
      ${P.map(r=>`<tr><td class="plink" data-p="${esc(r.p)}">${esc(pshort(r.p))}</td>
        <td>${r.slot?slotchip(r.slot):''}</td>
        <td class="mini">${esc(String(r.m).replace(/_/g,' '))}${r.side?' <b>'+esc(r.side)+'</b>':''}${r.book?' <span class="dim">'+esc(r.book)+'</span>':''}</td>
        <td>${r.line==null?'—':r.line}</td>
        <td class="op">${r.proj==null?'—':(r.pctProj?(+r.proj).toFixed(0)+'%':(+r.proj).toFixed(1))}</td>
        <td class="op">${sgn(r.ev,1)}%</td></tr>`).join('')}</tbody></table>`
      :'<p class="note">no player markets posted for this game yet</p>';
    return {lines,props};
  }

  function fill(){
    const wk=G.week,gs=GAMES(wk),sel=$('#gvGame'),prev=sel.value;
    sel.innerHTML=gs.map(g=>`<option value="${g[GM.vis]}@${g[GM.home]}">${g[GM.vis]} @ ${g[GM.home]} · ${SLATE_LBL[g[GM.slate]]||g[GM.slate]}</option>`).join('');
    if(prev&&gs.some(g=>g[GM.vis]+'@'+g[GM.home]===prev))sel.value=prev;
    if(G.game&&gs.some(g=>g[GM.vis]+'@'+g[GM.home]===G.game))sel.value=G.game;
    draw();
  }
  function draw(){
    const key=$('#gvGame').value,src=$('#gvSrc').value,wk=G.week;if(!key)return;
    const [vis,home]=key.split('@');
    const g=GAMES(wk).find(x=>x[GM.vis]===vis&&x[GM.home]===home);
    if(!g){$('#gvBody').innerHTML='<p class="note">that game is not on this week\u2019s slate</p>';return}
    const D=J.dvp[src]||{};
    const se=(IN_SE&&IN_SE[0])||SE_NOW;
    const mk=market(vis,home,wk);
    /* the deep views are built only when you open one — the Intel drills alone are a few
       thousand pixels of season tables, and nobody opens four of them at once */
    const LAZY={
      depth:()=>GV.dcSide?`<div class="gvpair">${GV.dcSide(vis)}</div><div class="gvpair">${GV.dcSide(home)}</div>`
                        :'<p class="note">no depth chart on file</p>',
      scheme:()=>(GV.intelOff&&IN.off[se]&&IN.off[se][vis])
        ?`<div class="gvpair"><h4>${vis} offense vs ${home} defense</h4>${GV.intelOff(vis,se)}${GV.intelDef(home,se)}</div>
          <div class="gvpair"><h4>${home} offense vs ${vis} defense</h4>${GV.intelOff(home,se)}${GV.intelDef(vis,se)}</div>`
        :'<p class="note">no charted scheme data for this league</p>',
      form:()=>`<div class="gv2">
          <div class="panel"><h4>${tcell(vis)} <span class="mini">form</span></h4>${formCard(vis)}
            <h4>${tcell(home)} <span class="mini">defense — weekly</span></h4>${trend(home)}</div>
          <div class="panel"><h4>${tcell(home)} <span class="mini">form</span></h4>${formCard(home)}
            <h4>${tcell(vis)} <span class="mini">defense — weekly</span></h4>${trend(vis)}</div></div>`,
      story:()=>storyBlock(g,wk,{limit:40})||'<p class="note">nothing flagged for this one</p>'
    };
    const det=(id,title,sub)=>`<details class="gvd" data-k="${id}"><summary>${title}${sub?` <span class="f">${sub}</span>`:''}</summary><div class="gvdb"></div></details>`;
    $('#gvBody').innerHTML=
      (GV.card?GV.card(g,D):'<p class="note">the Matchups card is unavailable</p>')
     +`<div class="gv2 gvmkt">
         <div class="panel"><h4>market <span class="mini">the number, the model, the gap</span></h4>${mk.lines}</div>
         <div class="panel"><h4>edges <span class="mini">this game's player markets by EV</span></h4>${mk.props}</div></div>`
     +`<div class="gvdeep">${det('depth','depth charts','both sides, offense and defense')}
        ${det('scheme','scheme &amp; personnel',`how each unit plays · ${se}`)}
        ${det('form','form &amp; trend','records, venue, ATS · what each defense is giving up')}
        ${det('story','storylines','rivalries, revenge, homecomings, alumni')}</div>`;
    $('#gvBody').querySelectorAll('details.gvd').forEach(d=>d.ontoggle=()=>{
      if(!d.open)return;const box=d.querySelector('.gvdb');if(box.dataset.done)return;
      box.dataset.done='1';
      try{box.innerHTML=LAZY[d.dataset.k]()}catch(err){box.innerHTML='<p class="note">could not build this section</p>';console.error(err)}
      if(typeof logoize==='function')logoize(box);
      box.querySelectorAll('.plink[data-p],.pp[data-p]').forEach(n=>n.onclick=()=>playerPop(n.dataset.p));
    });
    if(typeof logoize==='function')logoize($('#gvBody'));
    $('#gvBody').querySelectorAll('.plink[data-p],.pp[data-p]').forEach(n=>n.onclick=()=>playerPop(n.dataset.p));
  }
  $('#gvGame').onchange=draw;$('#gvSrc').onchange=draw;
  fill();RR.push(fill);
}
