/* ============================================================
   RAINMAN v2 shell — Bloomberg-grade terminal
   type: Inter for UI chrome, JetBrains Mono for data · one accent (amber) · muted surfaces
   ============================================================ */
#legacyNav{display:none}
#app{display:flex;min-height:100vh}
#side{width:var(--side);flex:none;background:var(--panel);border-right:1px solid var(--edge);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;font-family:var(--ui);z-index:20}
#body{flex:1;min-width:0}
.brand{display:flex;align-items:center;gap:6px;padding:14px 10px 10px 12px;font:700 14px/1 var(--ui);letter-spacing:.1em;color:var(--txt);white-space:nowrap}
.brand .lgsw{margin-left:auto}
.lgsw{display:inline-flex;border:1px solid var(--edge2);border-radius:4px;overflow:hidden}
.lgsw a{padding:3px 7px;font:600 10px/1.2 var(--ui);letter-spacing:.06em;color:var(--dim);text-decoration:none;border-right:1px solid var(--edge2)}
.lgsw a:last-child{border-right:0}.lgsw a:hover{color:var(--txt)}.lgsw a.on{background:var(--accent);color:#1a1200}
#gFind{margin:4px 12px 10px;background:var(--s2);border:1px solid var(--edge2);color:var(--dim);padding:7px 10px;font:500 12px/1.2 var(--ui);text-align:left;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:6px;letter-spacing:0}
#gFind:hover{border-color:var(--accent);color:var(--txt)}#gFind kbd{margin-left:auto;font:500 10px/1 var(--mono);color:var(--dim2);border:1px solid var(--edge2);border-radius:3px;padding:2px 5px}
#snav{flex:1;overflow-y:auto;padding:0 8px 8px;scrollbar-width:thin}
#snav .sec{margin:6px 0 10px}
#snav .sech{font:600 10px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);padding:8px 8px 5px}
#snav .sitem{display:block;position:relative;padding:5px 26px 5px 10px;margin:1px 0;border-radius:6px;color:var(--txt);text-decoration:none;border-left:2px solid transparent}
#snav .sitem:hover{background:var(--s2)}
#snav .sitem.on{background:var(--s3);border-left-color:var(--accent)}
#snav .sitem .sl{display:block;font:500 12.5px/1.3 var(--ui)}
#snav .sitem.on .sl{color:var(--accent);font-weight:600}
#snav .sitem .sd{display:block;font:400 10.5px/1.35 var(--ui);color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#snav .sitem.on .sd{white-space:normal}
#snav .sitem kbd{position:absolute;right:8px;top:8px;font:500 10px/1 var(--mono);color:var(--dim2);border:1px solid var(--edge);border-radius:3px;padding:2px 4px}
.sfoot{border-top:1px solid var(--edge);padding:10px 14px 12px;font:400 10.5px/1.5 var(--ui);color:var(--dim2)}
.sfoot .sub{display:block;font-size:10px;letter-spacing:.02em;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sfoot .sub b{color:var(--dim);font-weight:600}
.sfl{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.sfl button,.sfl a{background:var(--s2);border:1px solid var(--edge2);color:var(--dim);padding:4px 8px;font:500 10.5px/1.2 var(--ui);border-radius:4px;cursor:pointer;text-decoration:none}
.sfl button:hover,.sfl a:hover{color:var(--txt);border-color:var(--accent)}
#sideClose{display:none}
/* top bar + filters */
#top{position:sticky;top:0;z-index:15;background:rgba(10,12,16,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--edge)}
#hdr{display:flex;align-items:center;gap:12px;padding:10px 20px 8px;font-family:var(--ui)}
#crumb{display:flex;align-items:baseline;gap:8px;min-width:0;flex-wrap:wrap}
#crumb .cs{color:var(--dim);font:500 12px/1.2 var(--ui);letter-spacing:.02em}
#crumb .sep{color:var(--dim2)}
#crumb b{font:600 17px/1.2 var(--ui);color:var(--txt);letter-spacing:-.01em}
#crumb .cd{color:var(--dim);font:400 12px/1.3 var(--ui);flex-basis:100%}
#hdr .gl{margin-left:auto}
#gSum{font:400 11px/1.3 var(--ui);color:var(--dim);margin-left:0;max-width:40vw;text-align:right}
.gl{color:var(--dim2);font:600 9.5px/1 var(--ui);letter-spacing:.14em}
#gbar{display:flex;gap:8px;align-items:center;padding:6px 20px 9px;flex-wrap:wrap;border-bottom:0;background:transparent}
#gbar.live{border-bottom:0}#gbar.has #gClear{color:var(--accent);border-color:var(--accent)}
#gbar .gl{margin-left:6px}#gbar .gl:first-child{margin-left:0}
.fanonly{display:none}body.fan .fanonly{display:inline-block}body.fan select.fanonly{display:inline-block}
.chips{display:flex;gap:3px;flex-wrap:wrap}
.chips button,#gClear,.tabs button,.r11seg button,.r11mk button,.r11lc button,.r11rg button{font-family:var(--ui)}
.chips button{background:var(--s2);border:1px solid var(--edge2);color:var(--dim);padding:3px 9px;border-radius:4px;font:500 10.5px/1.3 var(--ui);letter-spacing:.04em;text-transform:none;cursor:pointer}
.chips button:hover{border-color:var(--accent);color:var(--txt)}
.chips button.on{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:600}
.chips button .n{color:var(--dim2);font-size:9.5px;margin-left:3px}.chips button.on .n{color:#1a1200}
#gClear{background:var(--s2);border:1px solid var(--edge2);color:var(--dim);padding:3px 9px;border-radius:4px;font:500 10.5px/1.3 var(--ui);letter-spacing:0;cursor:pointer}
#gClear:hover{color:var(--red);border-color:var(--red)}
select,input{background:var(--s2);color:var(--txt);border:1px solid var(--edge2);padding:4px 8px;font:500 11.5px/1.3 var(--ui);border-radius:4px}
select:focus,input:focus{outline:none;border-color:var(--accent)}
#gWk{font-weight:600}
/* content */
main{padding:14px 20px 40px;font-family:var(--mono)}
main>div{animation:fadein .14s ease-out}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:12px 14px;margin-bottom:14px}
h3{color:var(--txt);font:600 12.5px/1.3 var(--ui);margin:0 0 10px;text-transform:none;letter-spacing:0;border-bottom:1px solid var(--edge);padding-bottom:8px}
h3 .f{color:var(--dim);font:400 11px/1.4 var(--ui);letter-spacing:0;text-transform:none;margin-left:6px}
table{font-size:11.5px}
th,td{border-bottom:1px solid var(--edge)}
th{color:var(--dim);background:var(--panel);font:600 10px/1.3 var(--ui);letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--edge2)}
th.rk{color:var(--cyan)}
tr:hover td{background:var(--s2)}
.note{color:var(--dim);font:400 11px/1.5 var(--ui)}
.mini{font-size:10.5px;color:var(--dim)}
.controls{gap:8px}
.tabs{gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:var(--s2);border:1px solid var(--edge2);color:var(--dim);padding:5px 12px;border-radius:5px;font:500 11.5px/1.3 var(--ui);text-transform:none;letter-spacing:0}
.tabs button:hover{color:var(--txt);border-color:var(--accent)}
.tabs button.on{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:600}
#defTabs,#r11Tabs{display:none}
.slate{border:1px solid var(--edge2);color:var(--cyan);border-radius:3px;font:600 9.5px/1.5 var(--ui);letter-spacing:.06em}
.tag{border-color:var(--edge2);background:var(--s2);color:var(--txt);border-radius:3px;font:500 10px/1.5 var(--ui)}
.pos{border-radius:3px;font:600 10px/15px var(--ui);letter-spacing:.04em}
.badge{border-radius:3px;font:700 11px/1.5 var(--mono)}
.plink:hover{color:var(--accent)}
.sep{border-top:1px solid var(--edge)}
.modalbox,.palbox{background:var(--panel);border:1px solid var(--edge2);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mclose{background:var(--s2);border:1px solid var(--edge2);border-radius:4px;color:var(--dim);font-family:var(--ui)}
#palIn{background:var(--s2);border-radius:6px}
.palrow.on,.palrow:hover{background:var(--s3)}
.specband{border-radius:6px}
.sm-row:hover,tr.mine td{background:var(--s2)}
.lineup{border-color:#2a5a3a}
/* F11 restyle to tokens */
.r11list,.r11det,.r11box,.r11lc,.r11sum>div,.r11mg>div,.r11ld,.b11tot,.b11mdl{background:var(--panel);border-color:var(--edge);border-radius:8px}
.r11row{border-bottom-color:var(--edge)}.r11row:hover{background:var(--s2)}.r11row.on{background:var(--s3)}
.r11p,.r11alt button,.r11hc{background:var(--s2);border-color:var(--edge2)}

// USG: season-to-date usage per player (latest season that has snap data) — snap share, target share, aDOT

  J.logs.forEach(l=>{if(l[LOG.season]!==se||l[LOG.snp]==null)return;const a=m[l[LOG.player]]=m[l[LOG.player]]||{n:0,snp:0,tsh:0,tn:0,ad:0,adn:0};a.n++;a.snp+=l[LOG.snp];if(l[LOG.tsh]!=null){a.tsh+=l[LOG.tsh];a.tn++}if(l[LOG.adot]!=null&&l[LOG.tgt]>0){a.ad+=l[LOG.adot]*l[LOG.tgt];a.adn+=l[LOG.tgt]}});
  Object.values(m).forEach(a=>{a.snp/=a.n;a.tsh=a.tn?a.tsh/a.tn:null;a.adot=a.adn?a.ad/a.adn:null});m._se=se;return m})();

function ranks(){
  const srcs=Object.keys(J.dvp);
  const tabs=[...J.slots,'ALL'];
  $('#ranks').innerHTML=`
  <div class="tabs" id="rkTabs">${tabs.map((s,i)=>`<button data-s="${s}" class="${i===0?'on':''}">${s==='ALL'?s:posIcon(posOf(s),11)+' '+s}</button>`).join('')}</div>

  <span class="note">per-slot: rank + raw allowed per game &middot; ALL: every stat rank in one field &middot; rank 1 = most allowed &middot; with a filter active: the filtered teams' defenses + the defenses they face this week</span></div>
  <div id="rkTbl"></div>`;
  let slot='QB',sortK='psi',sortA=true;
  function render(){
    const src=$('#rkSrc').value,D=J.dvp[src];
    const defs=Object.keys(D).filter(inD);
    if(slot==='ALL'){
      let R=defs.map(d=>({d,ranks:J.statCols.map(c=>D[d].stats[c].rank),
        avgPsi:mean(Object.values(D[d].comps))}));
      R.sort((a,b)=>(sortK==='d'?(a.d<b.d?-1:1):a.avgPsi-b.avgPsi)*(sortA?1:-1));
      const keep=J.statCols.map(c=>inP(c.startsWith('P TD')?'QB':posOf(c)));
      $('#rkTbl').innerHTML=`<table><thead><tr><th data-k="d">Defense</th>
        ${J.statCols.filter((c,i)=>keep[i]).map(c=>`<th class="rk">${c}</th>`).join('')}</tr></thead><tbody>
        ${R.map(r=>`<tr><td>${tcell(r.d)}</td>${r.ranks.filter((x,i)=>keep[i]).map(x=>`<td>${badge(x)}</td>`).join('')}</tr>`).join('')}
        </tbody></table>`;
      document.querySelectorAll('#rkTbl th').forEach(th=>th.onclick=()=>{
        sortA=(sortK===th.dataset.k)?!sortA:true;sortK=th.dataset.k||'psi';render()});
      return;
    }
    const stats=J.groupStats[slot];
    const colmax=stats.map(c=>Math.max(...defs.map(d=>D[d].stats[c].avg)));
    let R=defs.map(d=>({d,psi:D[d].comps[slot],
      ranks:stats.map(c=>D[d].stats[c].rank),raws:stats.map(c=>D[d].stats[c].avg)}));
    R.sort((a,b)=>{let x,y;
      if(sortK==='psi'){x=a.psi;y=b.psi}
      else if(sortK==='d'){x=a.d;y=b.d}
      else if(sortK.startsWith('r')){const i=+sortK.slice(1);x=a.ranks[i];y=b.ranks[i]}
      else{const i=+sortK.slice(1);x=a.raws[i];y=b.raws[i]}
      return (x<y?-1:x>y?1:0)*(sortA?1:-1)});
    $('#rkTbl').innerHTML=`<table><thead><tr><th data-k="d">Defense</th><th class="rk" data-k="psi">&Psi;</th><th>&omega; ${J.primary[slot]} wkly</th>
      ${stats.map((c,i)=>`<th class="rk" data-k="r${i}">*${c}*</th>`).join('')}
      ${stats.map((c,i)=>`<th data-k="v${i}">${c}</th>`).join('')}</tr></thead><tbody>
      ${R.map(r=>`<tr><td>${tcell(r.d)}</td><td>${psi(r.psi)}</td><td>${sparkWave(series(r.d,J.primary[slot]),vivid(r.d))}</td>
      ${r.ranks.map(x=>`<td>${badge(x)}</td>`).join('')}
      ${r.raws.map((v,i)=>`<td>${spec(v,colmax[i]||1)}</td>`).join('')}</tr>`).join('')}
      </tbody></table>`;
    document.querySelectorAll('#rkTbl th').forEach(th=>th.onclick=()=>{
      sortA=(sortK===th.dataset.k)?!sortA:true;sortK=th.dataset.k;render()});
  }
  document.querySelectorAll('#rkTabs button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#rkTabs button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');slot=b.dataset.s;sortK=slot==='ALL'?'psi':'psi';sortA=true;render()});
  $('#rkSrc').onchange=render;
  RR.push(()=>{const tabs=[...document.querySelectorAll('#rkTabs button')];tabs.forEach(b=>b.hidden=b.dataset.s!=='ALL'&&!inP(posOf(b.dataset.s)));
    if(slot!=='ALL'&&!inP(posOf(slot))){const f=tabs.find(b=>!b.hidden);if(f){f.click();return}}render()});
}

/* ---------- Grand Unified Insights ---------- */
function insights(){
  $('#insights').innerHTML=`<div class="controls">
    <span class="note"><b style="color:var(--cyan)">HOW TO READ THIS</b> — &Psi; = the opponent defense's average rank in the stats that matter for that role
(QB: pass yds / rush yds / pass+rush / pass TD / total TD &middot; RB: rush yds / catches / rec yds / rush+rec / TD &middot; WR &amp; TE: catches / rec yds / TD).
Rank 1 of 32 = that defense has given up the MOST of it. Each row shows the actual per-game production the opponent defense gives up to that role, its league rank per stat, whether the defense is trending softer or tighter, its weekly waveform, and the player's own recent scoring. Recomputed live from depth charts + the 26/27 schedule; OUT players excluded.</span></div>
    <div id="inSm"></div><div id="inRest"></div>`;
  const groups=['QB','RB1','RB2','WR1','WR2','WR3','TE1'];
  function smRender(){
    const wk=G.week,D=J.dvp.combined;
    const se=TREND_SE;
    const form={};
    J.logs.forEach(l=>{if(l[LOG.season]===se)(form[l[LOG.player]]=form[l[LOG.player]]||[]).push(l[LOG.fppr])});
    const cand=UNIVERSE.filter(u=>u.grp&&u.inj!=='-1'&&inU(u)&&u.slot===(u.grp==='QB'?'QB1':u.grp))
      .map(u=>{const o=(J.sched26[u.team]||[])[wk-1]||'';
        if(!o||o==='BYE')return null;
        const def=o.replace('@','');
        const v=(D[def]||{comps:{}}).comps[u.grp];
        return v==null?null:{player:u.player,team:u.team,o,def,comp:v,grp:u.grp}})
      .filter(Boolean);
    const line=r=>{
      const ser=series(r.def,J.primary[r.grp]);
      const tm=mean(ser),t3=mean(ser.slice(-3));const pct=tm?100*(t3-tm)/tm:0;
      const tr=pct>12?`<span class="up">&#9650;+${pct.toFixed(0)}%</span>`:pct<-12?`<span class="dn">&#9660;${pct.toFixed(0)}%</span>`:`<span class="mini">flat</span>`;
      const f=(form[r.player]||[]).slice(-3);
      return `<tr><td class="pp plink" data-p="${r.player}">${esc(r.player)}</td><td>${tcell(r.team)}</td><td>${oppcell(r.o)}</td><td>${psi(r.comp)}</td>
        ${allowCells(r.def,r.grp,D)}<td>${tr}</td><td>${sparkWave(ser,vivid(r.def),80,18)}</td>
        <td>${f.length?mean(f).toFixed(1):'—'}</td></tr>`};
    const hdr=g=>`<tr><th>player</th><th>tm</th><th>opp</th><th class="rk">&Psi;</th>
      ${ORDER[g].map(c=>`<th>${c?lbl(c)+' (rk)':''}</th>`).join('')}<th>def trend L3</th><th>&omega; wkly</th><th>L3 ppr</th></tr>`;
    const CG='<colgroup><col style="width:150px"><col style="width:58px"><col style="width:64px"><col style="width:46px"><col style="width:104px"><col style="width:104px"><col style="width:104px"><col style="width:104px"><col style="width:74px"><col style="width:88px"><col style="width:56px"></colgroup>';
    $('#inSm').innerHTML=groups.filter(g=>inP(posOf(g))).map(g=>{
      const rows=cand.filter(x=>x.grp===g).sort((a,b)=>a.comp-b.comp);
      return `<div class="panel"><h3 style="color:${POSC[posOf(g)]}">${posIcon(posOf(g),14)} ${g} — wk ${wk}</h3>
      <p class="mini" style="color:var(--green)">TARGET — softest fields this week</p>
      <table class="fx">${CG}<thead>${hdr(g)}</thead><tbody>${rows.slice(0,5).map(line).join('')}</tbody></table>
      <p class="mini" style="margin-top:8px;color:var(--red)">AVOID — hardest fields this week</p>
      <table class="fx">${CG}<thead>${hdr(g)}</thead><tbody>${rows.slice(-5).reverse().map(line).join('')}</tbody></table>
      </div>`}).join('');
  }
  function rest(){
  const season=TREND_SE;
  const defs=[...new Set(J.weekly.map(r=>r[0]))].filter(inD);
  const movers=[],vol=[];
  defs.forEach(d=>{const rows=J.weekly.filter(r=>r[0]===d&&r[1]===season).sort((a,b)=>a[2]-b[2]);
    J.slots.filter(x=>inP(posOf(x))).forEach(sl=>{const c=J.primary[sl],all=rows.map(r=>r[WCOL[c]]);
      const m=mean(all),m3=mean(all.slice(-3)),sd=stdev(all);
      if(m>2){movers.push({d,sl,c,m,m3,pct:100*(m3-m)/m});vol.push({d,sl,c,m,cv:sd/m})}})});
  movers.sort((a,b)=>Math.abs(b.pct)-Math.abs(a.pct));
  vol.sort((a,b)=>b.cv-a.cv);
  const mv=`<div class="panel"><h3>momentum shifts — last 3 wks vs season ${season}</h3>
    <table><thead><tr><th>defense</th><th>slot</th><th>stat</th><th>μ/gm</th><th>last3</th><th>Δp</th></tr></thead><tbody>
    ${movers.slice(0,12).map(x=>`<tr><td>${tcell(x.d)}</td><td>${slotchip(x.sl)}</td><td class="mini">${x.c}</td>
    <td>${x.m.toFixed(1)}</td><td>${x.m3.toFixed(1)}</td>
    <td class="${x.pct>0?'up':'dn'}">${x.pct>0?'&#9650; +':'&#9660; '}${x.pct.toFixed(0)}%</td></tr>`).join('')}
    </tbody></table><p class="note">&#9650; softening (target these defenses) &middot; &#9660; hardening (fade)</p></div>`;
  const un=`<div class="panel"><h3>uncertainty principle — most/least predictable defenses (${season})</h3>
    <div class="grid2"><div><p class="mini">HIGH σ/μ — BOOM/BUST</p>
    <table>${vol.slice(0,8).map(x=>`<tr><td>${tcell(x.d)}</td><td>${slotchip(x.sl)}</td><td class="mini">${x.c}</td><td>${(100*x.cv).toFixed(0)}%</td></tr>`).join('')}</table></div>
    <div><p class="mini">LOW σ/μ — DETERMINISTIC</p>
    <table>${vol.slice(-8).reverse().map(x=>`<tr><td>${tcell(x.d)}</td><td>${slotchip(x.sl)}</td><td class="mini">${x.c}</td><td>${(100*x.cv).toFixed(0)}%</td></tr>`).join('')}</table></div></div>
    <p class="note">coefficient of variation of weekly stat allowed &middot; high = matchup rank is less trustworthy week to week</p></div>`;
  const key=['QB','RB1','WR1','TE1'];
  const ss=key.filter(x=>inP(posOf(x))).map(sl=>{const per=Object.keys(J.sched26).filter(inF).map(t=>{
      const cs=J.sched26[t].filter(o=>o!=='BYE').map(o=>{const d=o.replace('@','');
        return (J.dvp.combined[d]||{comps:{}}).comps[sl]}).filter(v=>v!=null);
      return {t,avg:mean(cs)}}).sort((a,b)=>a.avg-b.avg);
    const line=r=>`<tr><td>${tcell(r.t)}</td><td>${psi(r.avg)}</td></tr>`;
    return `<div class="panel"><h3 style="color:${POSC[posOf(sl)]}">${posIcon(posOf(sl),13)} ${sl} geodesics — full 2026 schedule strength</h3><div class="grid2">
    <div><p class="mini">DOWNHILL (easiest)</p><table>${per.slice(0,5).map(line).join('')}</table></div>
    <div><p class="mini">UPHILL (hardest)</p><table>${per.slice(-5).reverse().map(line).join('')}</table></div></div></div>`}).join('');
  $('#inRest').innerHTML=mv+un+ss+`<p class="note"><b>momentum</b> = defenses trending softer/harder RIGHT NOW (recent form the season rank hasn't caught up to — target/fade before the market does) &middot; <b>uncertainty</b> = how trustworthy a defense's rank is week to week &middot; <b>geodesics</b> = full-season strength of schedule per role (planning signal, not a weekly call)</p>`;
  }
  RR.push(()=>{smRender();rest()});
}

        <div class="grid2">${A.html}${B.html}</div></div>`}).join('')

function glossary(){
  const G2=[['&Psi;','DvP composite: mean of the opponent\'s league ranks (1 = allows the most) across the stats that matter for the slot. Lower = softer matchup.'],
   ['&Psi;+','Conviction 0-100: &Psi; converted to 0-100 and shrunk toward neutral by the defense\'s trust, then blended with scheme edge (15%), game environment (15%) and the player\'s role (15%).'],
   ['PROJ','Projected PPR points: baseline (own PPR/gm — this season 2&times;, last 8 of \'25 — shrunk toward the slot mean) &times; matchup (PPR the opponent allows to his slot vs league, shrunk by trust) &times; scheme &times; environment &times; role trend.'],
   ['trust','0-100: how much the opponent\'s 2024-25 DvP still describes the 2026 unit — falls with starter turnover (returning-snap %) and a coordinator change, recovers as 2026 weeks accrue.'],
   ['scheme edge / schm','What the opponent\'s scheme family (Cover-1 man, single-high C3, two-high zone…) historically concedes to this slot, league-indexed from 2024-25 charting. A prior, half-weighted.'],
   ['env','Game environment: scoring index = both offenses\' EPA/play + both defenses\' EPA/play allowed, ranked within the week; pace and PROE tag it shootout / rock fight / fast / slow.'],
   ['role','Snap share and target share from nflverse snap counts + play-by-play; arrows compare the last game with the season.'],
   ['turnover','Share of last season\'s 11 highest-snap starters who are gone; returning-snap % is the share of their snaps still on the roster.'],
   ['&omega;','That defense\'s weekly allowed waveform for the stat (latest season with 4+ weeks), dashed line = its mean.'],
   ['slate chips','TNF / SUN 1P / SUN 4P / SNF / MNF etc. — click any chip in the bar to filter every tab to that window; combine several.'],
   ['game model','Opponent-adjusted margin rating (last 17 games, prior season ×0.6, shrunk) + 1.6 home field + rest; a pick needs a 3-point disagreement with the market. Picks are frozen when first built and graded against that line. Backtest: does not beat the closing spread; totals 54.6% on a small sample.'],
   ['props','DraftKings lines from ESPN\'s public odds feed. PROJ = own weighted stat average shrunk to the slot mean × trust-shrunk DvP at the Big Board\'s position weights; L10 = share of the last 10 games over the line; a lean needs a 10% gap, L10 agreement and 6+ games.']];

        <p class="mini" style="margin-top:6px">${envLine(away,home,wk)}</p><p class="mini">${tcell(away)} D ${schemeLine(away)} ${trustPill(away,true)}<br>${tcell(home)} D ${schemeLine(home)} ${trustPill(home,true)}</p></div>

  function ledger(){const L=BET.ledger,R=BET.retro;const wks=[...new Set([...L,...R].map(r=>r.week))].sort((a,b)=>a-b);

    const hdr=`<thead><tr><th>wk</th><th>game</th><th>score</th><th>market</th><th>model</th><th>ATS pick</th><th></th><th>total</th><th>model</th><th>total pick</th><th></th><th>status</th></tr></thead>`;
    const fro=L.filter(r=>r.pick_ats||r.pick_total),ret=R.filter(r=>r.pick_ats||r.pick_total);
    return `<div class="panel"><h3>record <span class="f">frozen picks are graded against the line they were frozen with; "retro" rows are what the model would have picked in weeks played before the ledger existed — shown for calibration, never counted as a real record</span></h3>
     <table><thead><tr><th></th><th>ATS</th><th>%</th><th>totals</th><th>%</th><th>picks</th></tr></thead><tbody>
     <tr><td>frozen (live record)</td><td>${recTxt(L,'res_ats')}</td><td>${wpct(L.filter(r=>r.res_ats==='W').length,L.filter(r=>r.res_ats==='L').length)}</td><td>${recTxt(L,'res_total')}</td><td>${wpct(L.filter(r=>r.res_total==='W').length,L.filter(r=>r.res_total==='L').length)}</td><td class="mini">${fro.length} (${L.filter(r=>r.result==null&&(r.pick_ats||r.pick_total)).length} pending)</td></tr>
     <tr><td class="dim">retro 2026 (not a record)</td><td>${recTxt(R,'res_ats')}</td><td>${wpct(R.filter(r=>r.res_ats==='W').length,R.filter(r=>r.res_ats==='L').length)}</td><td>${recTxt(R,'res_total')}</td><td>${wpct(R.filter(r=>r.res_total==='W').length,R.filter(r=>r.res_total==='L').length)}</td><td class="mini">${ret.length}</td></tr>

     ${R.map(p=>`<tr><td class="mini">${p.kick.slice(5,16).replace('T',' ')}Z</td><td class="pp plink" data-p="${p.player}">${esc(p.player)}</td><td>${tcell(p.team)}</td><td>${tcell(p.opp)}</td><td>${slotchip(p.slot)}</td><td style="text-align:left">${esc(p.market)}</td><td><b>${p.line}</b></td><td class="mini">${p.open??''}</td><td class="${p.move>0?'rise':p.move<0?'fall':'mini'}">${p.move?(p.move>0?'+':'')+p.move:''}</td><td class="mini">${p.own_avg??''}<sup class="dim" title="games of history">${p.n_games}</sup></td><td class="mini">${p.base}</td><td>${fmtX(p.matchup_x,3)}</td><td><b>${p.proj}</b></td><td class="${p.edge_pct>=10?'rise':p.edge_pct<=-10?'fall':'mini'}">${p.edge_pct>0?'+':''}${p.edge_pct}%</td><td>${p.l10_over!=null?`<span style="color:${p.l10_over>=.6?'#00c853':p.l10_over<=.4?'#ff5252':'var(--txt)'}">${(100*p.l10_over).toFixed(0)}%</span>`:'—'}</td><td>${p.dvp_rank?badge(p.dvp_rank):'<span class="dim">—</span>'}</td><td>${p.lean?`<span class="tag" style="color:${p.lean==='OVER'?'#00c853':'#ff5252'}">${p.lean}</span>`:''}</td></tr>`).join('')||'<tr><td colspan="17" class="dim">no markets match</td></tr>'}</tbody></table>

    const sb=[a,h].map(t=>{const hm=t===h,A=tg(t),r=rec(A.filter(x=>x.s===2026)),p=pH==null?null:hm?pH:1-pH,ml=m?(hm?m.home_moneyline:m.away_moneyline):null,last=A.filter(x=>x.s===2026).slice(-3);
      return `<tr><td class="r11tm" style="border-left:3px solid ${vivid(t)}">${tlogo(t,26)}<span><b style="color:${vivid(t)}">${hm?'@ ':''}${t}</b><em>${esc((m&&(hm?m.home_qb_name:m.away_qb_name))||'')}${m&&(hm?m.home_rest:m.away_rest)!=null?' · '+(hm?m.home_rest:m.away_rest)+'d rest':''}</em></span></td>

        <td class="r11l3">${last.map(x=>`<span class="${x.pf>x.pa?'w':x.pf<x.pa?'l':''}" title="wk ${x.w} ${x.hm?'vs':'@'} ${x.o}">${x.pf>x.pa?'W':x.pf<x.pa?'L':'T'} ${x.pf}-${x.pa}</span>`).join('')}</td></tr>`}).join('');
    const V={tt:['team points vs today\'s implied total',t=>impl(t),x=>x.pf,'scored more than'],gt:['game total vs today\'s total',()=>tot,x=>x.tot,'game went over'],ats:['cover margin vs that game\'s closing spread',()=>0,x=>x.cov,'covered']};
    const [vl,lnF,vF,word]=V[S.gv];

        tip:`${x.s} wk ${x.w} ${x.hm?'vs':'@'} ${x.o}: ${x.pf}-${x.pa} · closing ${t} ${spT(x.ln)} · total ${x.tl} (${x.tot>x.tl?'over':x.tot<x.tl?'under':'push'}) · ${x.cov>0?'covered':x.cov<0?'did not cover':'push'} by ${Math.abs(x.cov)}`}});
      const k=H.filter(x=>x.v>(ln??0)).length;
      return `<div class="r11box"><div class="k">${tlogo(t,16)} <b style="color:${vivid(t)}">${t}</b> · ${S.gv==='ats'?`covered ${k} of ${H.length}`:ln==null?'':`${word} ${ln.toFixed(1)} in ${k} of ${H.length}`}</div>${chart(H,{w:S.cw2,h:150,line:S.gv==='ats'?null:ln==null?null:+ln.toFixed(1)})}</div>`};
    const hh=GL.filter(r=>(r[2]===a&&r[3]===h)||(r[2]===h&&r[3]===a)).slice(-6).reverse();
    const mdS=m&&m.model_spread!=null?+m.model_spread:null,mdT=m&&m.model_total!=null?+m.model_total:null;
    return `<div class="r11dh g"><button class="r11back" id="r11Back">← list</button><div class="r11dn"><b>${tlogo(a,26)} <span style="color:${vivid(a)}">${a}</span> <span class="dim">@</span> ${tlogo(h,26)} <span style="color:${vivid(h)}">${h}</span></b>
        <span class="r11dm">${g[GM.date]} · ${kickLbl(g)}${m&&m.roof?' · '+esc(m.roof):''}</span></div>
        <div class="r11tot"><i>total</i><b>${tot??'—'}</b><div class="r11split">${m?`<span style="flex:${impl(a)};background:${vivid(a)}">${impl(a).toFixed(1)}</span><span style="flex:${impl(h)};background:${vivid(h)}">${impl(h).toFixed(1)}</span>`:''}</div></div></div>
      ${played?`<div class="r11final">FINAL ${a} ${m.away_score} – ${h} ${m.home_score} · ${+m.result-sp===0?'push':(+m.result-sp>0?h:a)+' covered'} · total ${m.total} ${+m.total>tot?'OVER':+m.total<tot?'UNDER':'PUSH'}</div>`:''}
      <div class="r11box"><table class="r11t r11sb"><thead><tr><th></th><th>spread</th><th>moneyline</th><th>implied</th><th>2026 SU</th><th>ATS</th><th>O/U</th><th>PF/g</th><th>PA/g</th><th>last 3</th></tr></thead><tbody>${sb}</tbody></table></div>
      <div class="r11mk">${Object.entries(V).map(([k,v])=>`<button data-gv="${k}" class="${S.gv===k?'on':''}">${v[0]}</button>`).join('')}</div>
      ${rngTabs(S.gsel?'each other':'')}
      <div class="r11two">${side(a)}${side(h)}</div>
      <div class="r11two"><div class="r11box"><div class="k">last meetings</div>${hh.length?`<table class="r11t"><tbody>${hh.map(r=>{const hm=r[3],aw=r[2],cov=r[5]-r[4]-r[6];
          return `<tr><td>${r[0]} w${r[1]}</td><td style="text-align:left">${aw} ${r[4]} @ ${hm} ${r[5]}</td><td>${hm} ${spT(-r[6])}</td><td>${cov===0?'push':(cov>0?hm:aw)+' cov'}</td><td>${r[4]+r[5]} ${r[4]+r[5]>r[7]?'o':r[4]+r[5]<r[7]?'u':'p'} ${r[7]}</td></tr>`}).join('')}</tbody></table>`:'<p class="note">no meetings since 2024</p>'}</div>
        <div class="r11box r11mdl"><div class="k">${IS_NFL?'model · reference only — its picks + record are on F9':'market only · no college model'}</div>
          <div class="r11mg"><div><i>spread</i><b>${mdS==null?'—':(mdS>0?h:a)+' '+Math.abs(mdS).toFixed(1)}</b><em>market ${sp>0?h+' '+sp:sp<0?a+' '+(-sp):'PK'}</em></div>
          <div><i>total</i><b>${mdT==null?'—':mdT.toFixed(1)}</b><em>${mdT==null?'':sgn(mdT-tot)+' vs market'}</em></div>
          <div><i>${h} win</i><b>${m&&m.win_prob_home!=null?pc(+m.win_prob_home):'—'}</b><em>market ${pc(pH)}</em></div></div>
          <p class="mini">${envLine(a,h,W)||''}</p></div></div>`}
  /* ---------- shell + wiring ---------- */
  const cnt=new Set(BT11.lines.map(l=>gkey(l.team))).size;
  const hasP=BT11.lines.length||BT11.td.length;
  el.innerHTML=`<div class="r11top"><div class="tabs" id="r11Tabs">${hasP?`<button data-t="P" class="on">Player props</button><button data-t="T">Anytime TD</button><button data-t="G">Game lines</button>`:`<button data-t="G" class="on">Game lines</button>`}</div>
    <span class="note">${hasP?`wk ${W} · DraftKings lines via ESPN · ${BT11.lines.length} props posted across ${cnt} of ${GW.length} games so far (DK fills the slate Thu–Sat) · pills = how often he cleared the line · model = reference only`:`wk ${W} · DraftKings game lines via ESPN · ${GW.length} games · no college player-prop feed is connected yet`}</span></div>
    <div id="r11Ctl"></div><div class="r11wrap"><div class="r11list" id="r11List"></div><div class="r11det" id="r11Det"></div></div>`;
  $('#r11Tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;[...$('#r11Tabs').children].forEach(x=>x.classList.toggle('on',x===b));S.tab=b.dataset.t;S.mob=false;S.lim=120;render()};
  const gameOpts=()=>`<select id="r11G"><option value="">all games</option>${GW.map(g=>{const k=g[GM.vis]+'@'+g[GM.home];return `<option value="${k}" ${S.game===k?'selected':''}>${g[GM.vis]} @ ${g[GM.home]} · ${g[GM.day]}</option>`}).join('')}</select>`;
  function controls(){const c=$('#r11Ctl');
    if(S.tab==='P'){const mk=B11.MORD.filter(m=>Object.values(IT).some(it=>it.market===m&&(S.src==='all'||it.dk)));

        <div class="r11seg" id="r11Side"><button data-v="o" class="${S.side==='o'?'on':''}">over</button><button data-v="u" class="${S.side==='u'?'on':''}">under</button></div>
        ${gameOpts()}<select id="r11S">${[['l10','sort: L10 hit %'],['l5','sort: L5 hit %'],['s26','sort: 2026 hit %'],['h2h','sort: vs opp hit %'],['diff','sort: L10 avg vs line'],['opp','sort: opp rank'],['move','sort: line move'],['model','sort: model P (ref)'],['time','sort: kickoff / team']].map(([v,t])=>`<option value="${v}" ${S.sort===v?'selected':''}>${t}</option>`).join('')}</select>

    else if(S.tab==='T')c.innerHTML=`<div class="r11ctl">${gameOpts()}<select id="r11S">${[['l10','sort: L10 TD %'],['l5','sort: L5 TD %'],['s26','sort: 2026 TD %'],['all','sort: TD % all games'],['opp','sort: opp rank'],['imp','sort: team implied pts'],['model','sort: model P (ref)']].map(([v,t])=>`<option value="${v}" ${S.tsort===v?'selected':''}>${t}</option>`).join('')}</select><input id="r11Q" placeholder="search player / team" value="${esc(S.q)}"></div>`;
    else c.innerHTML=`<div class="r11ctl"><span class="note">pills = last 10 games: share covering that game's closing spread / going over its closing total · click a game for the charts</span></div>`;

  let ROWS=[];

    if(S.tab==='P'){ROWS=pRows();if(!ROWS.some(r=>r.it.k===S.sel))S.sel=ROWS.length?ROWS[0].it.k:null;

    else{ROWS=GW.filter(g=>inF(g[GM.vis])||inF(g[GM.home]));if(!ROWS.some(g=>g[GM.vis]+'@'+g[GM.home]===S.gsel))S.gsel=ROWS.length?ROWS[0][GM.vis]+'@'+ROWS[0][GM.home]:null;

  $('#r11List').onclick=e=>{const r=e.target.closest('.r11row');if(!r)return;if(r.dataset.k)S.sel=r.dataset.k;else if(r.dataset.t)S.tsel=r.dataset.t;else if(r.dataset.g)S.gsel=r.dataset.g;
