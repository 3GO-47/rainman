  const TYPES=['ALL','ML','ATS','TOTAL','PROP','TD'];let ft='ALL',gsel='',one=true;
  const ALL=PICKS.filter(p=>p.type!=='DFS');const EB=[[-9,0],[0,.03],[.03,.06],[.06,.10],[.10,.18],[.18,9]];const GR=ALL.filter(p=>p.result==='W'||p.result==='L'||p.result==='P');
  const bOf=e=>e==null?-1:EB.findIndex(([lo,hi])=>e>=lo&&e<hi);
  const cohort=p=>{const b=bOf(pkEdgeVal(p));if(b<0)return null;const rs=GR.filter(q=>q.type===p.type&&bOf(pkEdgeVal(q))===b);return {...pkRec(rs),lo:EB[b][0],hi:EB[b][1]}};
  const mktRec=p=>pkRec(GR.filter(q=>q.type===p.type&&(p.type==='PROP'?q.market===p.market:true)));
  const bLbl=(lo,hi)=>lo<0?'other side':hi>1?`${(100*lo).toFixed(0)}%+`:`${(100*lo).toFixed(0)}–${(100*hi).toFixed(0)}%`;
  const recPill=(r,lbl)=>{if(!r||!r.graded)return `<span class="recp none" title="no graded history yet">${lbl}: none</span>`;const ok=r.hit>=BE110;return `<span class="recp ${ok?'ok':'bad'}" title="${lbl}: ${pkWL(r)} · ${pkPct(r.hit,1)} hit · ${pkU(r.units)} u">${lbl} ${pkWL(r)} · ${pkPct(r.hit,0)}</span>`};
  const kickOf=p=>{const [v,h]=pkGame(p).split('@');const g=GAMES(G.week).find(x=>x[GM.vis]===v&&x[GM.home]===h);return g};
  const dedupe=rows=>{if(!one)return rows;const seen={},out=[];rows.slice().sort((a,b)=>(pkEdgeVal(b)??-9)-(pkEdgeVal(a)??-9)).forEach(p=>{const k=p.player?`${p.player}|${p.market}`:`${pkGame(p)}|${p.type}`;if(seen[k])return;seen[k]=1;out.push(p)});return out};
  const pass=p=>{const t=pkTeams(p);if(ACT&&!t.some(inF))return false;if(gsel&&pkGame(p)!==gsel)return false;if(ft!=='ALL'&&p.type!==ft)return false;if(G.pos.size&&p.player){const u=UNIVERSE.find(x=>x.player===p.player&&x.team===p.team);if(u&&!G.pos.has(u.pos))return false}return true};
  const tier=e=>e==null?'none':e>=.10?'smash':e>=.06?'play':e>=.03?'lean':e>0?'thin':'against';
  const tierC={smash:'var(--green)',play:'#7dd87d',lean:'var(--amber)',thin:'var(--dim)',against:'var(--red)',none:'var(--dim2)'};
  const prob=v=>{const x=+v;if(isNaN(x))return esc(String(v));return `<b style="color:${x>=.6?'var(--green)':x<=.4?'var(--red)':'var(--txt)'}">${(100*x).toFixed(0)}%</b>`};
  const modelTxt=p=>p.type==='ML'||p.type==='TD'||p.type==='PROP'?prob(p.model):`<b>${esc(String(p.model))}</b>`;
  const mktTxt=p=>p.type==='ML'||p.type==='TD'?prob(p.market_ref):p.type==='PROP'?`<b>${esc(String(p.line))}</b>`:`<b>${esc(String(p.market_ref))}</b>`;
  const src=s=>s?`<span class="srcc ${/draftkings/i.test(s)?'dk':/fanduel/i.test(s)?'fd':/kalshi/i.test(s)?'kal':/espn/i.test(s)?'esp':''}">${esc(s.replace('draftkings','DK').replace('fanduel','FD').replace('espnbet','ESPN').replace('Kalshi','KAL'))}</span>`:'';
  const card=p=>{const e=pkEdgeVal(p),t=tier(e),c=cohort(p),g=kickOf(p);const [v,h]=pkGame(p).split('@');
    return `<div class="pkcard ${t}" style="--tc:${tierC[t]}"><div class="pcr1"><span class="ptype ${p.type}">${PK_TL[p.type]}</span><span class="mini">${g?`${g[GM.day]} ${g[GM.time]||''}`:''}</span>${p.result?resChip(p.result==='P'?'PUSH':p.result):''}</div>
      <div class="pcr2">${p.player?pn(p.player,p.team):''}${p.player?` <span class="mini">${p.opp?(p.opp[0]==='@'?'@ ':'vs ')+p.opp.replace('@',''):''}</span>`:`${tcell(v)} <span class="mini">@</span> ${tcell(h)}`}</div>

  const row=p=>{const e=pkEdgeVal(p),t=tier(e),c=cohort(p),g=kickOf(p);const [v,h]=pkGame(p).split('@');

  function gameModel(wk){const gs=(BET.games||[]).filter(g=>g.week===wk&&(inF(g.away_team)||inF(g.home_team))&&(!gsel||`${g.away_team}@${g.home_team}`===gsel)).sort((a,b)=>(a.gameday<b.gameday?-1:a.gameday>b.gameday?1:0));if(!gs.length)return '';

    return `<div class="panel"><h3>game model vs the market <span class="f">every game: the line, the model's number, the gap (green / red at 3+ points), home win % model vs market, and the model's call · click a game for its Game View</span></h3><table class="fx"><thead><tr><th>kick</th><th>game</th><th>spread</th><th>model</th><th>gap</th><th>total</th><th>model</th><th>gap</th><th>home win</th><th>market</th><th>call</th><th>result</th></tr></thead><tbody>
      ${gs.map(g=>{const k=gameOf(g.away_team,wk);const fav=g.model_spread>0?g.home_team:g.away_team;const wp=g.win_prob_home!=null?+g.win_prob_home:null,mp=g.imp_home_fair!=null?+g.imp_home_fair:null;

  function render(){const wk=G.week;const pool=ALL.filter(p=>+p.week===wk);const F=dedupe(pool.filter(pass)).sort((a,b)=>(pkEdgeVal(b)??-9)-(pkEdgeVal(a)??-9));

      <div class="panel"><div class="controls pkctl"><span class="tabs" id="bdChips">${TYPES.map(t=>`<button data-t="${t}" class="${ft===t?'on':''}">${PK_TL[t]}${t==='ALL'?'':` <span class="mini">${pool.filter(p=>p.type===t).length}</span>`}</button>`).join('')}</span>

        <details class="pkpass"><summary><h3 style="margin:0;border:0;padding:0;display:inline">passed <span class="f">${rest.length} priced lines the model does not like — under 3% or on the other side · expand</span></h3></summary>${table(rest)}</details></div>`
      +gameModel(wk)
      +`<details class="panel"><summary><h3 style="margin:0;border:0;padding:0;display:inline">earlier weeks <span class="f">${ALL.filter(p=>+p.week!==wk&&pass(p)).length} positions · graded · expand</span></h3></summary>${table(dedupe(ALL.filter(p=>+p.week!==wk&&pass(p))).sort((a,b)=>(+b.week-+a.week)||(pkEdgeVal(b)??-9)-(pkEdgeVal(a)??-9)).slice(0,400))}</details>`;

    $('#bdChips').onclick=e=>{const b=e.target.closest('button');if(!b)return;ft=b.dataset.t;render()};
    $('#bdGame').onchange=e=>{gsel=e.target.value;render()};$('#bdOne').onclick=()=>{one=true;render()};$('#bdAll').onclick=()=>{one=false;render()};

  if(ung.length)notes.push(['flat',`Still live, nothing graded: ${ung.map(x=>`${PK_TL[x.t]} (${x.n})`).join(', ')}.`]);
  if(buckets.length>=2){const a=buckets[0],b=buckets[buckets.length-1];
    notes.push([b.hit>a.hit?'up':'down',`Bigger disagreements with the market ${b.hit>a.hit?'have done better':'have not done better'} so far: ${pkPct(a.hit,1)} in the smallest edge bucket (${a.graded} plays) vs ${pkPct(b.hit,1)} in the largest (${b.graded}).`])}
  if(probRows.length>=25){const exp=probRows.reduce((a,p)=>a+pkProb(p),0)/probRows.length,act=probRows.filter(p=>p.result==='W').length/probRows.length;
    notes.push([act>=exp?'up':'down',`Calibration: the model expected ${pkPct(exp,1)} on its ${probRows.length} priced positions and hit ${pkPct(act,1)} — ${act>=exp?'it is landing at or above its own numbers':`it is ${(100*(exp-act)).toFixed(1)} points overconfident, so trim its probabilities before pricing off them`}.`])}
  if(maeM!=null&&maeK!=null)notes.push([maeM<maeK?'up':'down',`Game model this season: it misses the final margin by ${maeM.toFixed(1)} points a game, the closing spread by ${maeK.toFixed(1)} — ${maeM<maeK?'ahead of':'behind'} the market by ${Math.abs(maeM-maeK).toFixed(1)}.`]);
  const bestSk=Object.entries(SK).filter(([k,v])=>v.n>=500&&v.skill!=null).sort((a,b)=>b[1].skill-a[1].skill);
  if(bestSk.length)notes.push(['up',`Prop markets where the model adds the most over just using recent form: ${bestSk.slice(0,3).map(([k,v])=>`${pkMk(k)} (+${(v.skill-(v.skill_form_only||0)).toFixed(1)} pts of skill)`).join(', ')}.`]);
  const weak=Object.entries(SK).filter(([k,v])=>v.n>=500&&v.skill!=null&&v.skill<2);
  if(weak.length)notes.push(['down',`Markets the model barely beats a coin flip on: ${weak.map(([k])=>pkMk(k)).join(', ')} — low skill, so its edges there are mostly noise.`]);

  /* ---- drawing */
  const W=720,H=140,PAD=28;
  const curveSvg=()=>{if(curve.length<2)return `<div class="pkempty">one week of results on file — the bankroll curve starts at two</div>`;
    const lo=Math.min(0,...curve.map(c=>c.cum),...curve.map(c=>c.wkU)),hi=Math.max(0,...curve.map(c=>c.cum),...curve.map(c=>c.wkU));const sp=(hi-lo)||1;

      ${curve.map((c,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(c.cum).toFixed(1)}" r="3" class="dot"><title>after wk ${c.week}: ${pkU(c.cum)} u</title></circle>`).join('')}

      <text x="${(W-10).toFixed(1)}" y="${(Y(last.cum)-8).toFixed(1)}" class="ax ${pkTone(last.cum)}" text-anchor="end">${pkU(last.cum)} u</text>
      ${curve.map((c,i)=>`<text x="${X(i).toFixed(1)}" y="${H-6}" class="ax" text-anchor="middle">wk ${c.week}</text>`).join('')}</svg>`};
  const hitBar=(hit,n)=>{if(hit==null)return '<span class="dim">—</span>';const x=Math.max(0,Math.min(100,(hit-0.35)/0.35*100));
    return `<span class="pkhit"><span class="t"><i style="width:${x.toFixed(0)}%;background:${hit>=BE110?'var(--green)':'var(--red)'}"></i><em style="left:${((BE110-0.35)/0.35*100).toFixed(0)}%"></em></span><b class="${hit>=BE110?'g':'r'}">${pkPct(hit,1)}</b><i class="mini">${n}</i></span>`};

  el.innerHTML=`<div class="kpis">

const pkWho=p=>p.player?pn(p.player,p.team):p.team?p.team.split('@').map(x=>tcell(x)).join(' <span class="mini">@</span> '):'';
const pkMref=p=>p.type==='ML'||p.type==='TD'?`${(100*+p.market_ref).toFixed(0)}%`:p.type==='PROP'?`${p.line}`:`${p.market_ref}`;
const pkModel=p=>p.type==='ML'||p.type==='TD'||p.type==='PROP'?`${(100*+p.model).toFixed(0)}%`:String(p.model);
const pkEdge=p=>p.edge===''||p.edge==null?'':p.type==='PROP'?`${(+p.edge).toFixed(1)}% EV`:p.type==='ML'||p.type==='TD'?`${(+p.edge>0?'+':'')}${(100*+p.edge).toFixed(0)}%`:`${Math.abs(+p.edge).toFixed(1)} pts`;

function games(root='#games',px='',v2=false){
  $(root).innerHTML=`<div id="${px}gmOut"></div>`;
  const bt=BET.backtest;const TYPES=['ALL','ML','ATS','TOTAL','PROP','TD'];
  let ft='ALL',hist=false,grp=true,minE=3,one=true,sk='edge',sa=false,gsel='';
  const ALL=PICKS.filter(p=>p.type!=='DFS');
  const pkEdgePct=pkEdgeVal;
  /* v2: every live position carries the graded record of its own cohort — same type, same edge bucket — and of its market */
  const EB=[[-9,0],[0,.03],[.03,.06],[.06,.10],[.10,.18],[.18,9]];
  const GR=ALL.filter(p=>p.result==='W'||p.result==='L'||p.result==='P');
  const bOf=e=>e==null?-1:EB.findIndex(([lo,hi])=>e>=lo&&e<hi);

     (game-by-game chart vs the line, adjustable line, splits, what the opponent allows, model as a labeled reference). */
  const el=$('#bets'),W=BT11.week||G.week;
  const S={tab:BT11.lines.length||BT11.td.length?'P':'G',mk:'',game:'',q:'',src:'dk',side:'o',sort:'l10',rng:'L10',sel:null,tsel:null,gsel:null,gv:'tt',ln:{},lim:120,mob:false,tsort:'l10'};
  const DEP={};(J.depth||[]).forEach(d=>{if(!DEP[d.player])DEP[d.player]=d});
  const GW=GAMES(W),KICK={},GORD={};GW.forEach((g,i)=>{KICK[g[GM.vis]]=g;KICK[g[GM.home]]=g;GORD[g[GM.vis]+'@'+g[GM.home]]=i});
  const GBW={};(BET.games||[]).filter(g=>g.season===2026&&g.week===W).forEach(g=>{GBW[g.away_team]=g;GBW[g.home_team]=g});
  const impl=t=>{const m=GBW[t];if(!m||m.total_line==null)return null;const sp=+m.spread_line,tot=+m.total_line;return t===m.home_team?tot/2+sp/2:tot/2-sp/2};
  const tspr=t=>{const m=GBW[t];if(!m||m.spread_line==null)return null;return t===m.home_team?-m.spread_line:+m.spread_line};
  const gkey=t=>{const g=KICK[t];return g?g[GM.vis]+'@'+g[GM.home]:''};
  const o0=o=>String(o||'').replace('@',''),vsx=o=>String(o||'')[0]==='@'?'@':'vs';
  const f1=B11.f1,sgn=B11.sgn,pc=p=>p==null||isNaN(p)?'—':Math.round(100*p)+'%';
  const spT=v=>v==null||isNaN(v)?'—':v<0?'−'+Math.abs(v):v>0?'+'+v:'PK';
  const YDS=new Set(['pass_yds','rush_yds','rec_yds','rush_rec_yds','pass_rush_yds']);
  const face=(n,t,px)=>{const id=(J.ph||{})[n];return `<span class="r11f" style="width:${px}px;height:${px}px;border-color:${vivid(t)};background-image:url(${LOGO(t)})">${id?`<img src="${HEAD(id)}" alt="" loading="lazy" onerror="this.remove()">`:''}</span>`};
  const injT=n=>{const d=DEP[n];return !d?'':d.injury==='0'?'<span class="r11inj q">Q</span>':d.injury==='-1'?'<span class="r11inj o">OUT</span>':''};
  const kick=t=>{const g=KICK[t];return g?`${g[GM.day]} ${g[GM.date].slice(5).replace('-','/')} · ${g[GM.time]||'TBD'}${g[GM.time]?' ET':''}`:''};
  const pOver=(m,mu,line)=>{const dd=(BT11.dists||{})[m];if(!dd||!(mu>0))return null;const d=dd.find(d=>d.lo<=mu&&mu<d.hi)||dd[dd.length-1];const x=line/mu;let c=0;for(const q of d.q)if(q<=x)c++;return 1-c/101};
  const colName=c=>!c?'':c.replace('P TD','QB pass TD').replace('QB P+R','QB pass+rush yds').replace('RB R+R','RB rush+rec yds').replace('RecY','rec yds').replace('Recep','receptions').replace(/ RY$/,' rush yds').replace(/ PY$/,' pass yds');
  /* ---------- universe: every posted DK line + every projected player x market (research lines) ---------- */
  const IT={};
  BT11.lines.forEach(l=>{IT[l.player+'|'+l.market]={k:l.player+'|'+l.market,player:l.player,team:l.team,opp:l.opp,slot:l.slot,market:l.market,dk:true,dkline:+l.line,
    open:l.open!=null&&l.open!==''?+l.open:null,def:+l.line,proj:+l.proj,q10:+l.q10,q50:+l.q50,q90:+l.q90,n_eff:l.n_eff,mx:l.matchup_x,gx:l.game_x,upd:l.updated}});
  const STARTER=new Set(['QB1','RB1','RB2','WR1','WR2','WR3','TE1']);
  const medLine=(n,m,q50)=>{const f=B11.ST[m];const v=f?B11.PL(n).slice(-10).map(f).sort((a,b)=>a-b):[];if(v.length<3)return Math.max(.5,Math.floor(+q50)+.5);const h=v.length>>1,md=v.length%2?v[h]:(v[h-1]+v[h])/2;return Math.max(.5,Math.floor(md)+.5)};
  (BT11.proj||[]).forEach(r=>{const k=r[0]+'|'+r[4];if(IT[k]||!STARTER.has(r[3]))return;IT[k]={k,player:r[0],team:r[1],opp:r[2],slot:r[3],market:r[4],dk:false,dkline:null,open:null,
    def:medLine(r[0],r[4],r[7]),proj:+r[5],q10:+r[6],q50:+r[7],q90:+r[8],n_eff:r[9],mx:r[10],gx:r[11]}});
  const LN=it=>S.ln[it.k]!=null?S.ln[it.k]:it.def;
  const RNG=['L5','L10','L20','2026','2025','2024','H2H'];
  const pick=(L,r,opp)=>r==='L5'?L.slice(-5):r==='L10'?L.slice(-10):r==='L20'?L.slice(-20):r==='H2H'?L.filter(l=>l[LOG.opp]===opp):/^\d{4}$/.test(r)?L.filter(l=>l[LOG.season]===+r):L;
  const med=v=>{if(!v.length)return null;const s=[...v].sort((a,b)=>a-b),h=s.length>>1;return s.length%2?s[h]:(s[h-1]+s[h])/2};
  const hr=(L,f,line)=>{const v=L.map(f);return {n:v.length,o:v.filter(x=>x>line).length,u:v.filter(x=>x<line).length,avg:v.length?mean(v):null,med:med(v),hi:v.length?Math.max(...v):null,lo:v.length?Math.min(...v):null}};
  const hit=h=>S.side==='o'?h.o:h.u,pct=h=>h.n?hit(h)/h.n:null,bay=h=>h.n?(hit(h)+1)/(h.n+2):null;
  const hcls=(p,n)=>p==null||n<3?'h-na':p>=.7?'h-g2':p>=.55?'h-g1':p>.45?'h-nn':p>.3?'h-r1':'h-r2';
  const pill=(lab,h,p=pct(h),k=hit(h))=>`<span class="r11p ${hcls(p,h.n)}" title="${lab}: ${k} of ${h.n} games"><i>${lab}</i><b>${p==null?'—':Math.round(100*p)+'%'}</b><em>${h.n?k+'/'+h.n:'no g'}</em></span>`;
  const rkCell=rk=>`<span class="r11rk" title="opponent rank allowing this stat to his slot (combined DvP, 1 = allows the most)"><i>opp</i>${rk?badge(rk.rk):'<span class="dim">—</span>'}</span>`;
  /* ---------- SVG game-by-game chart ---------- */
  const nice=r=>{const p=Math.pow(10,Math.floor(Math.log10(r||1))),f=r/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p};
  function chart(H,o){const n=H.length;if(!n)return '<p class="note r11empty">no games in this range</p>';
    const w=Math.max(300,Math.floor(o.w||600)),ch=o.h||200,pl=38,pr=8,pt=22,U=o.usage||[],pb=34+U.length*15;
    const vs=H.map(x=>x.v);const mx=Math.max(...vs,o.line!=null?o.line*1.15:0,o.min||1)*1.08,mn=Math.min(0,...vs)*1.1;
    const y=v=>pt+(ch-pt)*(mx-v)/((mx-mn)||1),bw=(w-pl-pr)/n,bar=Math.max(3,Math.min(44,bw*.72)),step=nice((mx-mn)/4);
    let s=`<svg class="r11ch" width="${w}" height="${ch+pb}" viewBox="0 0 ${w} ${ch+pb}">`;
    for(let v=Math.ceil(mn/step)*step;v<=mx;v+=step)s+=`<line x1="${pl}" x2="${w-pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="${v===0?'#3d3d3d':'#141414'}"/>`+(o.line!=null&&Math.abs(y(v)-y(o.line))<11?'':`<text x="${pl-6}" y="${(y(v)+3.5).toFixed(1)}" text-anchor="end" class="ax">${+v.toFixed(2)}</text>`);
    const lab=Math.max(1,Math.ceil(30/bw));
    H.forEach((x,i)=>{const cx=pl+i*bw+bw/2;
      if(i&&H[i-1].s!==x.s||!i)s+=`${i?`<line x1="${(pl+i*bw).toFixed(1)}" x2="${(pl+i*bw).toFixed(1)}" y1="6" y2="${ch}" stroke="#2a3542" stroke-dasharray="2,3"/>`:''}<text x="${(pl+i*bw+3).toFixed(1)}" y="11" class="sn">${x.s}</text>`;
      if(x.segs){let acc=0;x.segs.forEach(([v,c])=>{if(v<=0)return;s+=`<rect x="${(cx-bar/2).toFixed(1)}" y="${y(acc+v).toFixed(1)}" width="${bar.toFixed(1)}" height="${(y(acc)-y(acc+v)-1).toFixed(1)}" fill="${c}" rx="1.5"/>`;acc+=v});
        if(!x.v)s+=`<rect x="${(cx-bar/2).toFixed(1)}" y="${(y(0)-2).toFixed(1)}" width="${bar.toFixed(1)}" height="2" fill="#3a2226"/>`}
      else{const y0=y(0),y1=y(x.v);s+=`<rect x="${(cx-bar/2).toFixed(1)}" y="${Math.min(y0,y1).toFixed(1)}" width="${bar.toFixed(1)}" height="${Math.max(1.5,Math.abs(y0-y1)).toFixed(1)}" fill="${x.c}" rx="1.5"/>`}
      if(bw>=15)s+=`<text x="${cx.toFixed(1)}" y="${(x.v<0?y(x.v)+12:y(x.v)-4).toFixed(1)}" text-anchor="middle" class="vl">${+(+x.v).toFixed(1)}</text>`;
      s+=`<rect x="${(pl+i*bw).toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${ch+pb}" fill="transparent"><title>${esc(x.tip||'')}</title></rect>`;
      if(i%lab===0){s+=`<text x="${cx.toFixed(1)}" y="${ch+14}" text-anchor="middle" class="xa">${esc(x.a||'')}</text><text x="${cx.toFixed(1)}" y="${ch+26}" text-anchor="middle" class="xb">${esc(x.b||'')}</text>`;
        U.forEach((u,j)=>{const t=u[1](x);s+=`<text x="${cx.toFixed(1)}" y="${ch+42+j*15}" text-anchor="middle" class="us">${t==null?'·':t}</text>`})}});
    U.forEach((u,j)=>s+=`<text x="${pl-6}" y="${ch+42+j*15}" text-anchor="end" class="ul">${u[0]}</text>`);
    if(o.line!=null){const yl=y(o.line).toFixed(1);s+=`<line x1="${pl}" x2="${w-pr}" y1="${yl}" y2="${yl}" stroke="#ffd54f" stroke-width="1.5" stroke-dasharray="5,3"/><rect x="0" y="${yl-8}" width="${pl-3}" height="16" rx="2" fill="#ffd54f"/><text x="${(pl-3)/2}" y="${+yl+4}" text-anchor="middle" class="ll">${o.line}</text>`}
    return s+'</svg>'}
  const tipLog=(l,v,unit)=>`${l[LOG.season]} wk ${l[LOG.week]} ${l[LOG.ha]==='A'?'@':'vs'} ${l[LOG.opp]} · ${unit} ${v} · as ${l[LOG.slot]}`;
  const usageFor=m=>{const tg=['TGT',l=>l[LOG.tgt]],ca=['CAR',l=>l[LOG.ra]],sn=['SNAP',l=>l[LOG.snp]?Math.round(100*l[LOG.snp])+'%':null],ts=['TGT%',l=>l[LOG.tsh]?Math.round(100*l[LOG.tsh])+'%':null],at=['ATT',l=>l[LOG.patt]];
    return /^pass|completions|interceptions/.test(m)?[at,ca,sn]:m==='rush_yds'||m==='rush_att'?[ca,tg,sn]:m==='rush_rec_yds'||m==='td'?[ca,tg,sn]:[tg,ts,sn]};
  /* ---------- shared detail pieces ---------- */
  const dHead=(n,t,slot,op)=>{const m=GBW[t],imp=impl(t);
    return `<div class="r11dh" style="--tc:${vivid(t)}"><button class="r11back" id="r11Back">← list</button>${face(n,t,66)}<div class="r11dn"><b>${esc(n)} ${injT(n)}</b>
      <span>${tlogo(t,15)}<span style="color:${vividC(t)}">${TEAM[t]?TEAM[t].n:t}</span> ${slotchip(slot)}</span>
      <span class="r11dm">${vsx(op)} ${tlogo(o0(op),15)}<b>${o0(op)}</b> · ${kick(t)}${m?` · ${t} ${spT(tspr(t))} · total ${m.total_line} · ${t} implied <b>${imp.toFixed(1)}</b>`:''}</span></div>
      <span class="pp r11prof" data-p="${esc(n)}">profile ↗</span></div>`};
  const rngTabs=o=>`<div class="r11rg">${RNG.map(r=>`<button data-r="${r}" class="${S.rng===r?'on':''}">${r==='H2H'?'vs '+o:r}</button>`).join('')}</div>`;
  const oppPanel=(op,slot,m,lab)=>{const o=o0(op),rk=B11.rank(m,slot,op);if(!rk)return `<div class="r11box"><div class="k">${o} defense</div><p class="note">no DvP column for this market</p></div>`;

    const lg=mean(Object.values(J.dvp['2026']||{}).map(d=>d.stats[rk.col]&&d.stats[rk.col].avg).filter(v=>v!=null));
    const sr=s=>{const d=(J.dvp[s]||{})[o];const x=d&&d.stats[rk.col];return x?`<td>${badge(x.rank)}</td><td>${f1(x.avg)}</td>`:'<td>—</td><td>—</td>'};
    const H=Wk.map(r=>{const v=+r[4+ci];return {v,s:2026,c:v>lg?'#1f8f4e':'#8a2f35',a:'vs '+r[3],b:'w'+r[2],tip:`2026 wk ${r[2]} vs ${r[3]} offense: ${colName(rk.col)} allowed ${v} (league avg ${lg.toFixed(1)})`}});
    return `<div class="r11box"><div class="k">${tlogo(o,15)} ${o} defense vs ${colName(rk.col)}${lab?` <span class="dim">(${lab})</span>`:''}</div>
      <table class="r11t"><thead><tr><th></th><th>rank</th><th>allowed/g</th></tr></thead><tbody><tr><td>blend 24-26</td><td>${badge(rk.rk)}</td><td>${f1(rk.avg)}</td></tr><tr><td>2026</td>${sr('2026')}</tr><tr><td>2025</td>${sr('2025')}</tr></tbody></table>
      <div class="r11cap">allowed each week of 2026 · dashed = league avg ${lg.toFixed(1)} · green = more than avg</div>
      ${chart(H.map(x=>({...x})),{w:S.cw2,h:110,line:+lg.toFixed(1)})}</div>`};
  const splitRows=(L,o,slot)=>[['all logged',L],['2026',L.filter(l=>l[LOG.season]===2026)],['2025',L.filter(l=>l[LOG.season]===2025)],['2024',L.filter(l=>l[LOG.season]===2024)],
    ['home',L.filter(l=>l[LOG.ha]==='H')],['away',L.filter(l=>l[LOG.ha]==='A')],['as '+slot,L.filter(l=>l[LOG.slot]===slot)],['vs '+o,L.filter(l=>l[LOG.opp]===o)],['last 3',L.slice(-3)]];
  /* ---------- PLAYER PROPS ---------- */
  function pRows(){let A=Object.values(IT).filter(it=>(S.src==='all'||it.dk)&&inF(it.team)&&inP(posOf(it.slot))&&(!S.mk||it.market===S.mk)&&(!S.game||gkey(it.team)===S.game)&&(!S.q||(it.player+' '+it.team).toLowerCase().includes(S.q)));
    A=A.map(it=>{const L=B11.PL(it.player),f=B11.ST[it.market],ln=LN(it),o=o0(it.opp),s={ln,rk:B11.rank(it.market,it.slot,it.opp)};['L5','L10','2026','2025','H2H'].forEach(r=>s[r]=hr(pick(L,r,o),f,ln));return {it,s}});
    const sd=S.side==='o'?1:-1,K={l10:x=>bay(x.s.L10),l5:x=>bay(x.s.L5),s26:x=>bay(x.s['2026']),h2h:x=>bay(x.s.H2H),opp:x=>x.s.rk?-sd*x.s.rk.rk:null,
      diff:x=>x.s.L10.avg!=null?sd*(x.s.L10.avg-x.s.ln)/Math.max(1,x.s.ln):null,move:x=>x.it.open!=null?Math.abs(x.it.dkline-x.it.open):null,
      model:x=>{const p=pOver(x.it.market,x.it.proj,x.s.ln);return p==null?null:S.side==='o'?p:1-p}}[S.sort];
    const tc=(a,b)=>(GORD[gkey(a.it.team)]??99)-(GORD[gkey(b.it.team)]??99)||(KICK[a.it.team]&&KICK[a.it.team][GM.vis]===a.it.team?0:1)-(KICK[b.it.team]&&KICK[b.it.team][GM.vis]===b.it.team?0:1)||(B11.SORD[a.it.slot]??20)-(B11.SORD[b.it.slot]??20)||a.it.player.localeCompare(b.it.player)||B11.MORD.indexOf(a.it.market)-B11.MORD.indexOf(b.it.market);
    A.sort(K?(a,b)=>{const x=K(a),y=K(b);return (x==null)-(y==null)||(y-x)||(b.s.L10.n-a.s.L10.n)||tc(a,b)}:tc);return A}
  const pRow=({it,s})=>{const mv=it.open!=null&&it.open!==it.dkline?it.dkline-it.open:0,ed=S.ln[it.k]!=null;

      <div class="r11ln"><span>${B11.LBL[it.market]}</span><b><small>${S.side==='o'?'o':'u'}</small>${s.ln}</b><em>${ed?(it.dk?'DK '+it.dkline+' · edited':'research · edited'):!it.dk?'research line':mv?`<span class="${mv>0?'rise':'fall'}">${mv>0?'▲':'▼'}${Math.abs(mv)}</span> since open`:'DraftKings'}</em></div>
      <div class="r11pills">${pill('L5',s.L5)}${pill('L10',s.L10)}${pill("'26",s['2026'])}${pill("'25",s['2025'])}${pill('vs '+o0(it.opp),s.H2H)}${rkCell(s.rk)}</div></div>`};

        <span class="r11side"><button data-s="o" class="${S.side==='o'?'on':''}">over</button><button data-s="u" class="${S.side==='u'?'on':''}">under</button></span></div>

/* ---------------- TD Grid — cumulative + one column per position ---------------- */
const tdLbl=s=>/^\d{4}$/.test(s)?"'"+s.slice(2):s==='combined'?'cmb':s==='adjusted'?'adj':s.slice(0,4);
/* The five-column touchdown grid. It renders twice from one implementation: as the live TD Board
   under F2 (root '#tdgrid', slot chips, full-length columns) and as the untouched draft under
   F6 TEST (root '#tdgridTest', the original depth select and 72vh scrolling columns). Every
   element id is prefixed, so the two instances never collide. */
const TD_SLOTS=['QB1','RB1','RB2','WR1','WR2','WR3','WR4','TE1','TE2'];
/* His own touchdowns per game, counted the same way the columns beside him are read: in rushing mode
   the board asks what the defense gives up on the ground, so the figure is his rush + receiving TDs;
   in passing mode it is his passing TDs. A player with no games yet this season falls back to his
   whole log, shown dim, so an empty cell always means no touchdown data at all rather than a new year. */
function tdRate(u,mode){const L=PLOGS[u.ln||u.player]||[];if(!L.length)return null;
  const pick=l=>mode==='pass'?l[LOG.ptd]:mode==='both'?l[LOG.ptd]+l[LOG.rtd]+l[LOG.rectd]:l[LOG.rtd]+l[LOG.rectd];
  const cur=L.filter(l=>l[LOG.season]===LAST_SE);
  const avg=a=>a.reduce((t,l)=>t+pick(l),0)/a.length;
  return cur.length?{v:avg(cur),gp:cur.length,se:LAST_SE,old:false}
                   :{v:avg(L),gp:L.length,se:'all seasons',old:true}};
function tdGrid(root,px,legacy){
  root=root||'#tdgrid';px=px||'tg';legacy=!!legacy;

  /* A quarterback's slot carries TWO touchdown stats and they routinely point opposite ways —
     PHI allows the MOST quarterback rushing TDs in the league (rank 1) and nearly the fewest
     passing TDs (rank 31). Averaging those gives 16, a number that describes neither. So the
     QB stat is picked, never blended; everyone else has one TD stat and it is simply that one. */
  const qbMode=()=>($('#'+px+'QB')||{}).value||'rush';
  const tdStat=(grp,pos)=>{const st=LABDEF[pos].stats(grp).filter(c=>/TD/.test(c));
    if(st.length<2)return st;
    const mode=qbMode();
    const pass=st.find(c=>c==='P TD'),rush=st.find(c=>c!=='P TD');
    return mode==='pass'?[pass]:mode==='both'?st:[rush]};
  const tdRank=(d,grp,pos)=>{if(!d)return null;
    const rs=tdStat(grp,pos).map(c=>d.stats[c]?d.stats[c].rank:null).filter(v=>v!=null);
    return rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:null};
  const depthCtl=legacy
    ? `<select id="${px}Depth"><option value="1" selected>1st string only</option><option value="2">top 2 depths</option><option value="">all depths</option></select>`

  $(root).innerHTML=`<div class="controls">
    ${depthCtl}
    <select id="${px}Inj"><option value="x" selected>hide OUT</option><option value="">incl. OUT</option></select>

    <input id="${px}Q" placeholder="search player..." size="15">
    <span class="note">touchdowns only. Each rank cell is the <b>touchdowns this week's opponent allows to that slot</b> in one data set, so a soft end zone can be read as a 2026 blip or as three years of it. rank 1 of ${NT} = allows the most = best TD matchup &middot; <b>TD/G is the player's own</b>, not the defense: his touchdowns per game this season, counted the way his rank columns read &middot; the first column is every slot owner together, then one per position${legacy?' &middot; \u03bc = mean across the sets':' &middot; rows are ordered by the mean rank across the sets, which the player tooltip carries'}</span>
  </div>
  <div class="lgrid td5${legacy?'':' wide full'}">${['ALL'].concat(TPOS).map(p=>`<section class="lgcol"><h3>${p==='ALL'?'◉ all':posIcon(p,12)+' '+p}${legacy?'':` <span class="gl" title="touchdowns this week's opponent allows to that slot, ranked among the ${NT} defenses · 1 = allows the most">${p==='ALL'?`TDs allowed to his slot · rank of ${NT}`:'TD rank'}</span>`} <span class="f" id="${px}N${p}"></span></h3><div id="${px}B${p}"></div></section>`).join('')}</div>`;
  const sort={};['ALL'].concat(TPOS).forEach(p=>sort[p]={k:'mu',a:true});
  function col(p){
    const st=sort[p],o={hin:$('#'+px+'Inj').value,q:$('#'+px+'Q').value};
    if(legacy)o.dep=$('#'+px+'Depth').value; else if(live.size)o.slots=live;
    const R=[];(p==='ALL'?TPOS:[p]).forEach(pos=>{
      tRows(pos,srcs[0],o).forEach(x=>{
        const cells=srcs.map(s=>{const D=J.dvp[s]||{};return tdRank(x.opp&&D[x.opp]?D[x.opp]:null,x.u.grp,pos)});
        const got=cells.filter(v=>v!=null);

      else if(st.k==='pos'){x=TPOS.indexOf(a.pos);y=TPOS.indexOf(b.pos)}
      else{x=tSortVal(a,st.k,st.a);y=tSortVal(b,st.k,st.a)}

    $('#'+px+'N'+p).textContent=R.length+(R.length===1?' player':' players');

      ${legacy?th('mu','μ','mean rank across every data set'):''}</tr></thead><tbody>
      ${R.map(x=>`<tr><td class="plink" data-p="${esc(x.u.player)}" title="${esc(x.u.player)} · ${esc(x.u.dslot||x.u.slot)} · ${esc(x.u.team)}${x.mu==null?'':' · mean rank '+x.mu.toFixed(1)+' of '+NT}">${esc(pshort(x.u.player))}${x.u.inj==='0'?' <span class="inj0">Q</span>':''}</td>
        ${p==='ALL'?`<td style="color:${POSC[x.pos]}">${posIcon(x.pos,10)}</td>`:''}<td>${oppcell(x.oppRaw)}</td>
        ${legacy?'':(x.td==null?'<td class="md"><span class="dim">·</span></td>'
          :`<td class="md tdg${x.td.old?' stale':''}" title="${esc(x.u.player)} · ${x.td.v.toFixed(2)} TD/gm over ${x.td.gp} game${x.td.gp===1?'':'s'} (${x.td.se})">${x.td.v>=1?x.td.v.toFixed(1):x.td.v.toFixed(2).replace(/^0/,'')}</td>`)}
        ${x.cells.map((v,i)=>v==null?`<td class="op${i===0?' gs':''}"><span class="dim">·</span></td>`

        ${legacy?tPsi(x.mu).replace('class="md"','class="md gs"'):''}</tr>`).join('')||`<tr><td colspan="${srcs.length+5}" class="dim">nothing matches</td></tr>`}</tbody></table>`;
    $('#'+px+'B'+p).querySelectorAll('th[data-k]').forEach(h=>h.onclick=()=>{

  }
  const all=()=>['ALL'].concat(TPOS).forEach(col);
  (legacy?[px+'Depth',px+'Inj',px+'QB']:[px+'Inj',px+'QB']).forEach(i=>$('#'+i).onchange=all);

  RR.push(all);

/* ---------------- Head to Head (F6 TEST draft) — what each starter has actually done against this week's opponent ----------------
   The Lab and the TD Grid answer "what does this defense give up to his slot". This answers the narrower, blunter
   question: when THIS player has faced THIS defense before — any season we have logs for, whichever team he was
   on at the time — what did he put up? One row per slot owner, four columns by position, the Lab's own layout.
   Every figure is a straight mean of his game-log rows where opp == this week's opponent; n is how many such
   games exist. PPR carries a ▲/▼ against his own average over every logged game, so the row says at a glance
   whether this matchup has historically been better or worse than his norm. No model, no blending: the logs. */
const H2H_STATS={
  QB:[['PaY',l=>l[LOG.py]],['PaTD',l=>l[LOG.ptd]],['RuY',l=>l[LOG.ry]],['RuTD',l=>l[LOG.rtd]]],
  RB:[['RuY',l=>l[LOG.ry]],['Rec',l=>l[LOG.rec]],['ReY',l=>l[LOG.recy]],['TD',l=>l[LOG.rtd]+l[LOG.rectd]]],
  WR:[['Tgt',l=>l[LOG.tgt]],['Rec',l=>l[LOG.rec]],['ReY',l=>l[LOG.recy]],['TD',l=>l[LOG.rectd]+l[LOG.rtd]]],
  TE:[['Tgt',l=>l[LOG.tgt]],['Rec',l=>l[LOG.rec]],['ReY',l=>l[LOG.recy]],['TD',l=>l[LOG.rectd]+l[LOG.rtd]]]};
/* ---------- Depth Delta (F6): what changed on the depth charts since the previous snapshot, and what it means this week ---------- */
function depthDelta(){const ddLive=new Set(TD_SLOTS);
  const el=$('#ddelta');if(!el)return;const PV=J.depthPrev;
  if(!PV){el.innerHTML='<p class="note">only one depth-chart snapshot in the build — the diff appears once a second week is pulled</p>';return}
  const INJ={'1':'active','0':'Q','-1':'OUT'};const injOrd={'1':0,'0':1,'-1':2};
  const prev={};PV.rows.forEach(([pl,tm,sl,inj,dep])=>{prev[pl+'|'+tm]={slot:sl,inj:String(inj),depth:+dep||0}});
  const cur={};UNIVERSE.forEach(u=>{cur[u.player+'|'+u.team]=u});
  const curByName={};UNIVERSE.forEach(u=>{curByName[u.player]=u});
  const wk=G.week,D=J.dvp.combined||{};
  const rowsAll=[];
  UNIVERSE.forEach(u=>{const k=u.player+'|'+u.team,p=prev[k];const inj=String(u.inj);
    const kinds=[];let was='';
    if(!p){const moved=PV.rows.find(r=>r[0]===u.player);if(moved){kinds.push('team');was=`${moved[1]} ${moved[2]}`}else if(u.depth<=2){kinds.push('new')}}
    else{
      if(p.inj!==inj)kinds.push(injOrd[inj]>injOrd[p.inj]?'hurt':'back');
      if(p.slot!==u.slot){const sn=x=>parseInt(String(x).replace(/\D/g,''))||9;const dn=sn(u.slot)>sn(p.slot);if(!(dn&&inj==='-1'))kinds.push(dn?'down':'up');was=p.slot}
    }
    if(!kinds.length)return;
    const d=u.opp&&D[u.opp]?D[u.opp]:null;const comp=d?d.comps[u.grp]:null;
    const L=PLOGS[u.ln||u.player]||[],Lc=L.filter(l=>l[LOG.season]===LAST_SE);
    const ppr=Lc.length?Lc.reduce((t,l)=>t+l[LOG.fppr],0)/Lc.length:null;const ug=USG[u.ln||u.player]||{};
    // who steps in: the man now holding the slot this player used to hold (OUT / demotion), or the man he displaced (promotion)
    let next='';if(kinds.includes('hurt')&&inj==='-1'){const n=UNIVERSE.find(x=>x.team===u.team&&x.slot===u.slot&&x!==u&&x.inj!=='-1')||UNIVERSE.find(x=>x.team===u.team&&x.grp===u.grp&&x!==u&&x.inj!=='-1'&&x.depth===u.depth+1);if(n)next=n.player}

  });
  // off the chart entirely (cut, traded away, IR): on the previous snapshot, nowhere on the current one
  const gone=PV.rows.filter(r=>!curByName[r[0]]&&(+r[4]||9)<=2).map(r=>({u:{player:r[0],team:r[1],slot:r[2],grp:SLOTG(r[2]),inj:String(r[3]),depth:+r[4]||0,pos:r[2].replace(/[0-9+]/g,''),opp:'',oppRaw:''},kinds:['off'],was:r[2],inj:String(r[3]),injWas:String(r[3]),comp:null,ppr:null,snp:null,next:(UNIVERSE.find(x=>x.team===r[1]&&x.slot===r[2])||{}).player||'',kick:'',kickord:99}));
  const KINDS=[['hurt','injury worse'],['back','injury cleared'],['up','promoted'],['down','demoted'],['new','new on chart'],['team','changed teams'],['off','off the chart']];
  const KCOL={hurt:'var(--red)',back:'var(--green)',up:'var(--green)',down:'var(--red)',new:'var(--cyan)',team:'var(--acc)',off:'var(--dim)'};
  const teams=[...new Set(rowsAll.concat(gone).map(r=>r.u.team))].sort();
  el.innerHTML=`<div class="kpis" id="ddKpi"></div><div class="controls">
    <span class="tabs" id="ddKinds"><button data-k="" class="on">all</button>${KINDS.map(([k,l])=>`<button data-k="${k}">${l}</button>`).join('')}</span>
    ${slotChipsHTML('ddSlots',ddLive)}
    <select id="ddTeam"><option value="">all teams</option>${teams.map(t=>`<option>${t}</option>`).join('')}</select>
    
    <input id="ddQ" placeholder="search player..." size="15">
    <span class="note">every body whose slot, injury flag or team is different from the <b>${PV.date}</b> chart, with what it means this week: the opponent, how soft that opponent is to his new slot (Ψ, 1 = allows the most), his own PPR per game and snap share this season, and who steps in behind an OUT or demoted player &middot; every column sorts &middot; click a name for his card</span>
  </div><div id="ddTbl"></div>`;
  let sk='kind',sa=true;
  const kindOrd=r=>KINDS.findIndex(([k])=>r.kinds.includes(k));
  const S={kind:r=>kindOrd(r),team:r=>r.u.team,player:r=>r.u.player,pos:r=>r.u.pos,slot:r=>r.u.slot,was:r=>r.was,inj:r=>injOrd[r.inj]??9,opp:r=>r.u.opp||'zz',kick:r=>r.kickord,comp:r=>r.comp==null?(sa?99:-1):r.comp,ppr:r=>r.ppr==null?(sa?1e9:-1):r.ppr,snp:r=>r.snp==null?(sa?1e9:-1):r.snp,next:r=>r.next||'zz'};

    const th=(k,l,t)=>`<th data-k="${k}" class="${sk===k?(sa?'srt-asc':'srt-desc'):''}" title="${t||''}">${l}</th>`;
    const chip=r=>r.kinds.map(k=>`<span class="badge" style="background:${KCOL[k]};color:#000">${KINDS.find(x=>x[0]===k)[1]}</span>`).join(' ');
    const injc=r=>r.inj==='-1'?'<span class="injm1">OUT</span>':r.inj==='0'?'<span class="inj0">Q</span>':'<span class="dim">active</span>';
    $('#ddTbl').innerHTML=R.length?`<table class="lab2 dd"><thead><tr>${th('player','Player')}${th('team','Tm')}${th('pos','Pos')}${th('kind','change')}${th('was','was','slot or flag on the previous chart')}${th('slot','now')}${th('inj','flag')}${th('next','steps in','the man now holding the slot he left (OUT / demoted) or the one he displaced')}${th('opp','Opp')}${th('kick','Kick')}${th('comp','Ψ','how soft this week\'s opponent is to his current slot · mean rank of its stats, 1 = allows the most')}${th('ppr','PPR/g','his own PPR per game this season')}${th('snp','snp%','season snap share')}</tr></thead><tbody>
      ${R.map(r=>`<tr><td class="plink" data-p="${esc(r.u.player)}">${esc(r.u.player)}</td><td>${tcell(r.u.team)}</td><td style="color:${POSC[r.u.pos]||'inherit'}">${r.u.pos}</td><td>${chip(r)}</td>

/* ---------------- META (F6 TEST) — every board's best signal on one grid ----------------

     ATD = the anytime-TD model's chance he scores (the TD Board column), shaded within his own position

     H2H = his own PPR per game in prior meetings with this opponent, ▲ / ▼ against his norm (the H2H Grid number)
     SCH = what the opponent's defensive family gives up to his slot vs league, plus 0.6 × the lift from its missing men (Scheme)

    $('#wkAhead').innerHTML=AH.length?TPOS.filter(p=>inP(p)).map(p=>{const L=AH.filter(x=>x.pos===p);return `<div class="wkacol"><h4>${posIcon(p,11)} ${p} <b>${Math.min(5,L.length)}</b><span class="mini">of ${L.length} on the slate</span></h4>${L.slice(0,5).map(card).join('')||'<span class="mini dim">nobody</span>'}</div>`}).join(''):'<p class="mini dim">no schedule for the current week</p>';
    const rows=SS.filter(r=>r.kind==='pos').sort((a,b)=>(b.hr??-1)-(a.hr??-1)).concat(SS.filter(r=>r.kind==='neg').sort((a,b)=>(a.hr??9)-(b.hr??9)));
    const pip=v=>`<i class="pip ${v>0?'w':v<0?'l':'o'}"></i>`;
    $('#wkMh').innerHTML=`season heatmap — every signal, every week <span class="f">cell = hit rate that week, green = beat the field, red = fell short, faded = small sample · dots = weeks it beat the field</span>`;

      <tr class="fld"><td><b>the field</b></td>${AL.map(a=>`<td class="c" data-v="${a.base??''}">${wkPct(a.base)}</td>`).join('')}<td class="c gs" data-v="${sBase??''}"><b>${wkPct(sBase)}</b></td><td class="c"></td></tr>
      ${rows.map(r=>`<tr class="${r.kind==='neg'?'neg':''}"><td title="${esc(r.long)}">${r.kind==='neg'?'<span class="dim">fade · </span>':''}${r.lbl}</td>${AL.map((a,i)=>{const x=a.sig.find(y=>y.id===r.id),thin=x.n<a.minN;
          return `<td class="c${thin?' thin':''}" data-v="${x.hr??''}" title="${esc(`${r.lbl} · wk ${a.w}: ${x.k} of ${x.n} scored${x.lift!=null?' · '+wkX(x.lift)+' the field':''}`)}">${x.hr==null?'<span class="dim">·</span>':`<span class="hc" style="color:${col(r,x.lift)};background:color-mix(in srgb, ${col(r,x.lift)} 16%, transparent)">${wkPct(x.hr)}</span>`}</td>`}).join('')}
        <td class="c gs" data-v="${r.hr??''}" title="${r.k} of ${r.n} · ${wkX(r.lift)} the field">${r.hr==null?'<span class="dim">·</span>':`<b style="color:${col(r,r.lift)}">${wkPct(r.hr)}</b>`}</td>
        <td class="c" data-v="${r.qw?r.bw/r.qw:''}" title="beat the field in ${r.bw} of ${r.qw} weeks with a usable sample">${r.pips.map(pip).join('')}</td></tr>`).join('')}</tbody></table>`;
    /* ---- the full table, folded away ---- */

    let P=show==='sc'?st.sc:show==='nm'?st.P.filter(x=>x.td===0&&x.cs>=4):st.P;P=P.slice().sort((a,b)=>b.td-a.td||b.cs-a.cs||b.ppr-a.ppr);
    const ck=v=>v===true?'<b style="color:var(--green)">✓</b>':v===false?'<span class="dim">·</span>':'<span class="dim">—</span>';

    $('#wkPh').innerHTML=`player table — week ${W} <span class="mini">${SH[show]} · ${P.length} · open for every player's pre-game profile</span>`;

      <th title="snap share this season before this week">snap</th><th title="team implied total from the closing line">implied</th><th title="core signals he carried going in (of 8)">signals</th></tr></thead><tbody>
      ${P.map(x=>`<tr><td>${pn(x.name,x.team,true)}</td><td>${slotchip(x.grp)}</td><td>${x.home?'':'@'}${tcell(x.opp)}</td>
        <td class="n" data-v="${x.td}" title="${x.rtd} rushing · ${x.rectd} receiving">${x.td?`<b style="color:var(--green)">${x.td}</b>`:'<span class="dim">0</span>'}</td><td class="n" data-v="${x.ppr}">${x.ppr.toFixed(1)}</td>

        <td class="c">${ck(x.last)}</td><td class="n" data-v="${x.l3??''}">${x.l3==null?'<span class="dim">—</span>':`<b style="color:${x.l3>=2?'var(--green)':x.l3===0?'var(--dim)':'var(--txt)'}">${x.l3}</b>`}</td>
        <td class="n" data-v="${x.rate??''}">${x.rate==null?'<span class="dim">—</span>':x.rate.toFixed(2)}</td><td class="n" data-v="${x.snp??''}">${x.snp==null?'<span class="dim">—</span>':Math.round(100*x.snp)+'%'}</td>

/* ---------------- TD Picks (F6 TEST) — the coming week's anytime touchdowns ----------------
   Everything here is computed by scripts/build_td_picks.py and embedded as J.tdpicks: a ridge logistic model on the pre-kickoff profile
   the Weeklies tab tests (form vs career, career TD rate, share of his team's TDs, touches / targets / carries, snap share, implied
   total, spread, what the defense allows his slot season-long and lately, a TD vs this opponent before, slot), calibrated with
   isotonic regression fitted only on earlier weeks. The record on this page is walk-forward (every week of 2025-26 scored by a model
   that had not seen it) plus the frozen ledger: a week's picks are written down the first time it is scored and graded from the logs. */
function tdPicks(){
  const el=$('#tdpicks');if(!el)return;const T=J.tdpicks;
  if(!T){el.innerHTML='<p class="note">no TD picks in this build yet — scripts/build_td_picks.py writes them</p>';return}
  const live=new Set(TD_SLOTS);let sortK='p',show='board';
  const TIER={lock:['lock','50%+','g'],strong:['strong','40–50%','g2'],solid:['solid','30–40%','a'],long:['longshot','20–30%','b'],low:['low','under 20%','d']};
  const pct=v=>v==null?'—':Math.round(100*v)+'%',ml=v=>v==null?'—':(v>0?'+':'')+v;
  const BT=T.bt||{},tk=Object.keys(TIER);
  el.innerHTML=`<div class="controls">
    ${slotChipsHTML('tpSlots',live)}
    <select id="tpInj"><option value="x" selected>hide OUT</option><option value="">incl. OUT</option></select>
    <select id="tpSort" title="how each column is ordered"><option value="p" selected>rank by chance to score</option><option value="ev">rank by value at the posted price</option></select>
    <input id="tpQ" placeholder="search player..." size="15">
    <span class="note kept">week ${T.week} · depth chart ${T.depth} · built ${T.built}</span>
  </div>
  <div class="wktiles" id="tpTiles" data-mg="1"></div>
  <div class="panel"><h3 id="tpBh"></h3><div class="tpcols" id="tpCols" data-mg="1"></div></div>
  <div class="panel"><h3 id="tpVh"></h3><div id="tpVal"></div></div>
  <div class="wk2b"><div class="panel"><h3>track record — every week of 2025–26, scored blind <span class="f">the model is refit before each week on games it has already seen, then graded on that week</span></h3><div id="tpRec"></div></div>
    <div class="panel"><h3>does the % mean what it says? <span class="f">predicted chance vs how often those players actually scored · white tick = the prediction</span></h3><div id="tpCal"></div></div></div>
  <div class="panel"><h3 id="tpLh"></h3><div id="tpLed"></div></div>
  <details class="panel wkdet"><summary id="tpAh"></summary><div id="tpAll"></div></details>`;
  const keep=x=>slotOK(live,x.s==='WR4+'?'WR4':x.s)&&($('#tpInj').value!=='x'||x.inj!=='-1')&&inP(x.pos)&&inF(x.t)&&(()=>{const q=$('#tpQ').value.toLowerCase();return !q||x.n.toLowerCase().includes(q)})();
  const trk=x=>TRK.btn({kind:'player',league:'nfl',away:x.h?x.o:x.t,home:x.h?x.t:x.o,kickoff:'',market:'td',stat:'anytime_td',player:x.n,team:x.t,selection:'Yes',point:'',price:x.price!=null?String(x.price):'',source:x.book||'',label:`${x.n} anytime TD`,from:'td picks'});
  const evC=v=>v==null?'var(--dim)':v>=.05?'var(--green)':v<=-.05?'var(--red)':'var(--txt)';
  const card=x=>{const t=TIER[x.tier]||TIER.low;return `<div class="tpc ${t[2]}${x.inj==='-1'?' out':''}">
      <div class="h">${pn(x.n,x.t,true)} ${slotchip(x.b)} <span class="mini">${x.h?'vs':'@'} ${tcell(x.o)}</span>${x.inj==='0'?' <span class="inj0">Q</span>':x.inj==='-1'?' <span class="injm1">OUT</span>':''}<span class="st">${trk(x)}</span></div>
      <div class="m"><b class="pp2">${pct(x.p)}</b><span class="tier">${t[0]}</span><span class="fo" title="the price this chance is worth">fair <b>${ml(x.fair)}</b></span>${x.price!=null?`<span class="fo" title="best posted anytime-TD price">${esc(x.book||'')} <b>${ml(x.price)}</b></span><span class="ev" style="color:${evC(x.ev)}" title="expected return at that price">${x.ev>=0?'+':''}${Math.round(100*x.ev)}%</span>`:''}</div>
      <div class="why">${(x.why||[]).map(w=>`<i>${esc(w)}</i>`).join('')}${x.risk?`<i class="risk">${esc(x.risk)}</i>`:''}</div></div>`};
  function render(){
    const P=T.picks.filter(keep),sk=$('#tpSort').value;
    const ord=(a,b)=>sk==='ev'?((b.ev??-9)-(a.ev??-9)||b.p-a.p):b.p-a.p;
    /* tiles */
    const lk=P.filter(x=>x.tier==='lock'),rec=(T.record||[]).filter(r=>r.graded),rw=rec.reduce((s,r)=>s+r.wins,0),rg=rec.reduce((s,r)=>s+r.graded,0),bl=BT.tiers&&BT.tiers.lock;
    $('#tpTiles').innerHTML=wkTile(`week ${T.week}`,String(T.games),`games · ${T.dates?T.dates[0].slice(5)+' to '+T.dates[1].slice(5):''}`)
      +wkTile('locks',String(lk.length),lk.slice(0,2).map(x=>esc(pshort(x.n))).join(' · ')||'none above 50%','g')
      +wkTile('top 10 each week',BT.top10?pct(BT.top10[0]/BT.top10[1]):'—',`scored · ${BT.top10?BT.top10[0]+' of '+BT.top10[1]:''} blind picks`,'g')
      +wkTile('lock tier',bl&&bl[0]?pct(bl[1]/bl[0]):'—',`hit · ${bl?bl[1]+' of '+bl[0]:''} picks rated 50%+`,'g')
      +wkTile('prices posted',String(T.priced),T.priced?'best anytime-TD price across books':'books post props midweek — fair odds until then',T.priced?'':'')
      +wkTile('frozen record',rg?`${rw}-${rg-rw}`:'—',rg?`${pct(rw/rg)} of frozen picks scored`:`week ${T.week} picks frozen ${(T.record||[]).length?(T.record[T.record.length-1].frozen||'').slice(5):''} · graded as games log`);
    /* the board: four positions */
    const N={QB:5,RB:10,WR:12,TE:7};
    $('#tpBh').innerHTML=`week ${T.week} — the picks <span class="f">chance he scores a rushing or receiving TD · tier = lock 50%+, strong 40–50%, solid 30–40%, longshot 20–30% · fair = the odds that chance is worth${T.priced?' · EV = expected return at the best posted price':''} · ★ sends it to Tracking</span>`;
    $('#tpCols').innerHTML=TPOS.filter(p=>inP(p)).map(p=>{const L=P.filter(x=>x.pos===p).sort(ord);return `<div class="tpcol"><h4>${posIcon(p,11)} ${p} <b>${Math.min(N[p],L.length)}</b><span class="mini">of ${L.length}</span></h4>${L.slice(0,N[p]).map(card).join('')||'<span class="mini dim">nobody matches</span>'}</div>`}).join('');
    /* value: the posted price beats the model's fair price */
    const V=P.filter(x=>x.ev!=null&&x.ev>=.05).sort((a,b)=>b.ev-a.ev);
    $('#tpVh').innerHTML=`value at the posted price <span class="f">players whose best posted anytime-TD price pays more than the model's fair price · biggest edge first</span>`;
    $('#tpVal').innerHTML=!T.priced?'<p class="mini dim">no week-'+T.week+' anytime-TD prices are posted yet — the loop picks them up as books open them, and this fills in on its own</p>'
      :V.length?`<div class="tpvals">${V.slice(0,16).map(x=>`<div class="tpv"><span>${pn(x.n,x.t,true)} ${slotchip(x.b)}</span><span class="mini">model <b>${pct(x.p)}</b> · fair ${ml(x.fair)}</span><span class="mini">${esc(x.book||'')} <b>${ml(x.price)}</b></span><b style="color:var(--green)">+${Math.round(100*x.ev)}%</b>${trk(x)}</div>`).join('')}</div>`:'<p class="mini dim">every posted price is at or below the model\'s fair price right now</p>';
    /* track record: weekly top-10, tiers */
    const W=BT.weeks||[];
    $('#tpRec').innerHTML=`<div class="tpwk">${W.map(w=>{const r=w[5]?w[4]/w[5]:0;return `<span class="b" title="${w[0]} wk ${w[1]}: ${w[4]} of the top ${w[5]} scored · field ${pct(w[3]/w[2])}"><i style="height:${Math.max(4,Math.round(100*r))}%;background:${r>=.6?'var(--green)':r>=.4?'var(--amber)':'var(--red)'}"></i><em>${w[1]}</em></span>`}).join('')}</div>
      <div class="mini" style="margin:4px 0 10px">each bar = how many of that week's ten highest-rated players scored · ${BT.top10?BT.top10[0]+' of '+BT.top10[1]:''} overall · top three per position ${BT.top3pos?pct(BT.top3pos[0]/BT.top3pos[1]):''} · model AUC ${BT.auc} vs ${BT.auc_base} for slot alone</div>
      ${tk.map(k=>{const v=(BT.tiers||{})[k]||[0,0],t=TIER[k],r=v[0]?v[1]/v[0]:null;return `<div class="wkb"><span class="l">${t[0]} <span class="mini">${t[1]}</span></span><span class="t"><i style="width:${(100*(r||0)/.75).toFixed(1)}%;background:${k==='lock'||k==='strong'?'var(--green)':k==='solid'?'var(--amber)':k==='long'?'#6db3e8':'#55606a'}"></i></span><span class="r"><b>${pct(r)}</b><span class="mini"> ${v[1]}/${v[0]}</span></span></div>`}).join('')}`;
    $('#tpCal').innerHTML=(BT.calib||[]).map(c=>{const off=Math.abs(c[1]-c[0]);return `<div class="wkb" title="${c[2]} players rated about ${pct(c[0])} — ${pct(c[1])} scored"><span class="l">rated ~${pct(c[0])}</span><span class="t"><i style="width:${(100*c[1]/.75).toFixed(1)}%;background:${off<=.04?'var(--green)':off<=.08?'var(--amber)':'var(--red)'}"></i><u style="left:${(100*c[0]/.75).toFixed(1)}%"></u></span><span class="r"><b>${pct(c[1])}</b><span class="mini"> ${c[2]}</span></span></div>`}).join('');
    /* the frozen ledger */
    const R=T.record||[];
    $('#tpLh').innerHTML=`frozen picks <span class="f">written down the first time a week is scored and never re-scored · ✓ scored · ✗ didn't · blank = not played yet</span>`;
    $('#tpLed').innerHTML=R.length?R.slice().reverse().map(r=>`<div class="tpled"><h4>week ${r.w} <span class="mini">frozen ${r.frozen} · ${r.graded?`${r.wins} of ${r.graded} graded picks scored · top ten ${r.top10[0]}/${r.top10[1]}`:'not graded yet'}</span></h4>
      <div class="wkpcs">${r.rows.slice().sort((a,b)=>(a[6]||99)-(b[6]||99)).slice(0,24).map(x=>`<span class="wkpc ${x[9]==='W'?'w':x[9]==='L'?'l':''}">${pn(x[0],x[1],true)}<i>${pct(x[4])}</i>${x[9]==='W'?'<b>✓</b>':x[9]==='L'?'<b>✗</b>':''}</span>`).join('')}</div></div>`).join(''):'<p class="mini dim">no frozen week yet</p>';

    $('#tpAll').innerHTML=`<table class="fx wkp"><thead><tr><th>player</th><th>slot</th><th>opp</th><th title="chance he scores">P(TD)</th><th>tier</th><th title="the odds that chance is worth">fair</th><th title="best posted price">price</th><th title="expected return at the posted price">EV</th><th title="games with a TD this season">season</th><th title="games with a TD in his last three">L3</th><th title="his share of his team's TDs">team TD share</th><th title="carries + targets a game">touches</th><th title="team implied total">implied</th><th title="TDs the defense allows his slot per game">D allows</th><th>★</th></tr></thead><tbody>
      ${A.map(x=>`<tr><td>${pn(x.n,x.t,true)}${x.inj==='0'?' <span class="inj0">Q</span>':x.inj==='-1'?' <span class="injm1">OUT</span>':''}</td><td>${slotchip(x.b)}</td><td>${x.h?'':'@'}${tcell(x.o)}</td>
        <td class="n" data-v="${x.p}"><span class="badge" style="${gradeStyle(1+(1-Math.min(1,x.p/.6))*(NT-1))}">${pct(x.p)}</span></td><td>${(TIER[x.tier]||TIER.low)[0]}</td><td class="n" data-v="${x.fair}">${ml(x.fair)}</td>
        <td class="n" data-v="${x.price??''}">${x.price!=null?`${ml(x.price)} <span class="mini">${esc(x.book||'')}</span>`:'<span class="dim">—</span>'}</td><td class="n" data-v="${x.ev??''}">${x.ev!=null?`<b style="color:${evC(x.ev)}">${x.ev>=0?'+':''}${Math.round(100*x.ev)}%</b>`:'<span class="dim">—</span>'}</td>
        <td class="n" data-v="${x.gpS?x.hitS/x.gpS:''}">${x.gpS?`${x.hitS}/${x.gpS}`:'<span class="dim">—</span>'}</td><td class="n" data-v="${x.l3n?x.l3k/x.l3n:''}">${x.l3n?`${x.l3k}/${x.l3n}`:'<span class="dim">—</span>'}</td>

        <td class="n" data-v="${x.imp??''}">${x.imp!=null?`<span style="color:${x.imp>=24?'var(--green)':x.imp<19?'var(--red)':'var(--txt)'}">${x.imp}</span>`:'<span class="dim">—</span>'}</td><td class="n" data-v="${x.dr??''}">${x.dr??'—'}</td><td>${trk(x)}</td></tr>`).join('')}</tbody></table>`;
    tWire(el);TRK.paint()}
  slotChipsWire('tpSlots',live,render);['tpInj','tpSort'].forEach(i=>$('#'+i).onchange=render);$('#tpQ').oninput=render;
  render();RR.push(render);

/* ---------------- Game View — one game, everything the site knows about it ----------------
   Built out of the live pieces rather than copies: the card is the Matchups card, the depth
   tables are the Depth Charts tables, the scheme drills are the Intel drills. They are handed
   over by GV.* at boot, so when those tabs change this page changes with them. */
function gameView(){
  const srcs=Object.keys(J.dvp);
  $('#gameview').innerHTML=`<div class="controls">
    <select id="gvGame"></select>
    <select id="gvSrc" title="which data set the matchup ranks read">${srcs.map(s=>`<option ${s==='combined'?'selected':''}>${s}</option>`).join('')}</select>
    <span class="note">the game, then the number. The card is the Matchups card for this game and the row under it is the market with the model's disagreement beside it &middot; depth charts, scheme profiles, form and storylines sit behind the four strips at the bottom and build only when you open one &middot; click any name for his card</span>
  </div><div id="gvBody" class="gv"></div>`;

  /* ---- form: record, venue split, this slate, last five, ATS ---- */
  function form(t){
    const G26=(BET.games||[]).filter(g=>g.result!=null&&g.away_score!=null)
      .sort((a,b)=>a.week-b.week);
    const r={w:0,l:0,t:0,hw:0,hl:0,aw:0,al:0,pf:0,pa:0,last:[],atsW:0,atsL:0,atsP:0,ou:[0,0]};
    G26.forEach(g=>{const H=g.home_team===t,A=g.away_team===t;if(!H&&!A)return;
      const mine=+(H?g.home_score:g.away_score),theirs=+(H?g.away_score:g.home_score);
      r.pf+=mine;r.pa+=theirs;
      if(mine>theirs){r.w++;H?r.hw++:r.aw++;r.last.push('W')}
      else if(mine<theirs){r.l++;H?r.hl++:r.al++;r.last.push('L')}
      else{r.t++;r.last.push('T')}
      if(g.spread_line!=null){                       // spread_line is the home side's number
        const mySpread=H?+g.spread_line:-(+g.spread_line);
        const margin=mine-theirs+mySpread;
        if(margin>0)r.atsW++;else if(margin<0)r.atsL++;else r.atsP++;}
      if(g.total_line!=null)(mine+theirs>+g.total_line?r.ou[0]++:r.ou[1]++);
    });
    return r;
  }
  const streak=l=>l.slice(-5).map(c=>`<i class="sq ${c==='W'?'w':c==='L'?'l':''}" title="${c}"></i>`).join('');
  function formCard(t){
    const f=form(t),gp=Math.max(1,f.w+f.l+f.t);
    const bySlate=(()=>{const g=gameOf(t,G.week);if(!g)return '';const sl=g[GM.slate];
      const rows=(BET.games||[]).filter(x=>x.result!=null&&(x.away_team===t||x.home_team===t));
      let w=0,l=0;rows.forEach(x=>{const gg=(J.games26||[]).find(y=>y[GM.wk]===x.week&&y[GM.vis]===x.away_team&&y[GM.home]===x.home_team);
        if(!gg||gg[GM.slate]!==sl)return;const H=x.home_team===t;const m=+(H?x.home_score:x.away_score),o=+(H?x.away_score:x.home_score);
        if(m>o)w++;else if(m<o)l++});
      return w+l?`<tr><th>in ${SLATE_LBL[sl]||sl}</th><td>${w}-${l}</td></tr>`:''})();
    return `<table class="gvk"><tbody>
      <tr><th>record</th><td><b>${f.w}-${f.l}${f.t?'-'+f.t:''}</b> ${streak(f.last)}</td></tr>
      <tr><th>home</th><td>${f.hw}-${f.hl}</td></tr>
      <tr><th>away</th><td>${f.aw}-${f.al}</td></tr>
      <tr><th>scoring</th><td>${(f.pf/gp).toFixed(1)} for &middot; ${(f.pa/gp).toFixed(1)} against &middot; ${sgn((f.pf-f.pa)/gp)}</td></tr>
      <tr><th>ATS</th><td>${f.atsW}-${f.atsL}${f.atsP?'-'+f.atsP:''}</td></tr>
      <tr><th>O/U</th><td>${f.ou[0]}-${f.ou[1]}</td></tr>
      ${bySlate}</tbody></table>`;
  }
  /* ---- what this defense has allowed week by week, per slot ---- */
  function trend(def){
    const SL=['QB','RB1','WR1','TE1'].filter(g=>inP(posOf(g)));
    const rows=SL.map(sl=>{const stat=(J.primary||{})[sl]||(ORDER[sl]||[])[0];if(!stat)return '';
      const v=series(def,stat);if(!v||v.length<2)return '';
      const mAll=mean(v);
      const k=Math.min(3,Math.floor(v.length/2));                 // only compare a tail against a body that exists
      const recent=k>=2?mean(v.slice(-k)):null;
      const d=recent!=null&&mAll?100*(recent-mAll)/mAll:null;
      return `<tr><td>${slotchip(sl)}</td><td class="mini">${lbl(stat)}</td>
        <td>${sparkWave(v,gradeColor((J.dvp.combined[def]||{comps:{}}).comps[sl]||MID),104,20)}</td>
        <td class="mini">${mAll.toFixed(1)} <span class="dim">/g over ${v.length}</span></td>
        <td class="${d==null?'mini':d>8?'rise':d<-8?'fall':'mini'}" title="${d==null?'needs at least four weeks':'last '+k+' games vs the season'}">${d==null?'—':(d>0?'+':'')+d.toFixed(0)+'%'}</td></tr>`}).join('');
    return rows?`<table class="gvt lgt"><thead><tr class="hd"><th>slot</th><th>stat</th><th>week by week</th><th class="op">per game</th><th class="op">recent</th></tr></thead><tbody>${rows}</tbody></table>`
      :'<p class="note">not enough weekly history yet</p>';
  }
  /* ---- the market, and where the model disagrees ---- */
  function market(vis,home,wk){
    const b=(BET.games||[]).find(x=>x.week===wk&&x.away_team===vis&&x.home_team===home);
    const rows=[];
    if(b){
      const sp=b.spread_line==null?null:+b.spread_line,tt=b.total_line==null?null:+b.total_line;
      rows.push(['spread',sp==null?'—':`${home} ${sp>0?'+':''}${sp.toFixed(1)}`,
        b.model_spread==null?'—':`${home} ${+b.model_spread>0?'+':''}${(+b.model_spread).toFixed(1)}`,
        b.edge_spread==null?'':sgn(+b.edge_spread,1)+' pts',b.pick_ats||'']);
      rows.push(['total',tt==null?'—':tt.toFixed(1),
        b.model_total==null?'—':(+b.model_total).toFixed(1),
        b.edge_total==null?'':sgn(+b.edge_total,1)+' pts',b.pick_total||'']);
      rows.push(['moneyline',b.away_moneyline==null?'—':`${vis} ${mlTxt(b.away_moneyline)} / ${home} ${mlTxt(b.home_moneyline)}`,
        b.win_prob_home==null?'—':`${home} ${(100*+b.win_prob_home).toFixed(0)}%`,
        b.edge_ml_home==null?'':sgn(100*+b.edge_ml_home,1)+' pp','']);
      if(sp!=null&&tt!=null)rows.push(['implied',`${vis} ${((tt+sp)/2).toFixed(1)} &middot; ${home} ${((tt-sp)/2).toFixed(1)}`,'','','']);
    }
    const lines=rows.length?`<table class="gvk wide"><thead><tr><th></th><th>market</th><th>model</th><th>edge</th><th>pick</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td class="mini">${esc(r[4]||'')}</td></tr>`).join('')}</tbody></table>`
      :'<p class="note">no game line on file for this one</p>';
    /* player markets for this game, biggest disagreements first.
       The payload calls the edge `ev` (percent) and keeps anytime TD in its own array. */
    const mine=r=>r.week===wk&&(r.team===vis||r.team===home);
    const L=((J.betting||{}).lines||[]).filter(r=>mine(r)&&r.ev!=null)
      .map(r=>({p:r.player,m:r.market,side:r.side||'',line:r.line,proj:r.proj,ev:+r.ev,book:r.book,slot:r.slot}));
    const T=((J.betting||{}).td||[]).filter(r=>mine(r)&&r.ev!=null)
      .map(r=>({p:r.player,m:'anytime TD',side:'Yes',line:r.price==null?null:mlTxt(r.price),
                proj:r.p_model==null?null:100*+r.p_model,ev:+r.ev,book:r.book,slot:r.slot,pctProj:true}));
    const P=L.concat(T).sort((a,b)=>Math.abs(b.ev)-Math.abs(a.ev)).slice(0,14);
    const props=P.length?`<table class="gvt lgt"><thead><tr class="hd"><th>Player</th><th>Slot</th><th>market</th><th>line</th><th class="op">model</th><th class="op">EV</th></tr></thead><tbody>
      ${P.map(r=>`<tr><td class="plink" data-p="${esc(r.p)}">${esc(pshort(r.p))}</td>
        <td>${r.slot?slotchip(r.slot):''}</td>
        <td class="mini">${esc(String(r.m).replace(/_/g,' '))}${r.side?' <b>'+esc(r.side)+'</b>':''}${r.book?' <span class="dim">'+esc(r.book)+'</span>':''}</td>
        <td>${r.line==null?'—':r.line}</td>
        <td class="op">${r.proj==null?'—':(r.pctProj?(+r.proj).toFixed(0)+'%':(+r.proj).toFixed(1))}</td>
        <td class="op">${sgn(r.ev,1)}%</td></tr>`).join('')}</tbody></table>`
      :'<p class="note">no player markets posted for this game yet</p>';
    return {lines,props};
  }

  function fill(){
    const wk=G.week,gs=GAMES(wk),sel=$('#gvGame'),prev=sel.value;
    sel.innerHTML=gs.map(g=>`<option value="${g[GM.vis]}@${g[GM.home]}">${g[GM.vis]} @ ${g[GM.home]} · ${SLATE_LBL[g[GM.slate]]||g[GM.slate]}</option>`).join('');
    if(prev&&gs.some(g=>g[GM.vis]+'@'+g[GM.home]===prev))sel.value=prev;
    if(G.game&&gs.some(g=>g[GM.vis]+'@'+g[GM.home]===G.game))sel.value=G.game;
    draw();
  }
  function draw(){
    const key=$('#gvGame').value,src=$('#gvSrc').value,wk=G.week;if(!key)return;
    const [vis,home]=key.split('@');
    const g=GAMES(wk).find(x=>x[GM.vis]===vis&&x[GM.home]===home);
    if(!g){$('#gvBody').innerHTML='<p class="note">that game is not on this week\u2019s slate</p>';return}
    const D=J.dvp[src]||{};
    const se=(IN_SE&&IN_SE[0])||SE_NOW;
    const mk=market(vis,home,wk);
    /* the deep views are built only when you open one — the Intel drills alone are a few
       thousand pixels of season tables, and nobody opens four of them at once */
    const LAZY={
      depth:()=>GV.dcSide?`<div class="gvpair">${GV.dcSide(vis)}</div><div class="gvpair">${GV.dcSide(home)}</div>`
                        :'<p class="note">no depth chart on file</p>',
      scheme:()=>(GV.intelOff&&IN.off[se]&&IN.off[se][vis])
        ?`<div class="gvpair"><h4>${vis} offense vs ${home} defense</h4>${GV.intelOff(vis,se)}${GV.intelDef(home,se)}</div>
          <div class="gvpair"><h4>${home} offense vs ${vis} defense</h4>${GV.intelOff(home,se)}${GV.intelDef(vis,se)}</div>`
        :'<p class="note">no charted scheme data for this league</p>',
      form:()=>`<div class="gv2">
          <div class="panel"><h4>${tcell(vis)} <span class="mini">form</span></h4>${formCard(vis)}
            <h4>${tcell(home)} <span class="mini">defense — weekly</span></h4>${trend(home)}</div>
          <div class="panel"><h4>${tcell(home)} <span class="mini">form</span></h4>${formCard(home)}
            <h4>${tcell(vis)} <span class="mini">defense — weekly</span></h4>${trend(vis)}</div></div>`,
      story:()=>storyBlock(g,wk,{limit:40})||'<p class="note">nothing flagged for this one</p>'
    };
    const det=(id,title,sub)=>`<details class="gvd" data-k="${id}"><summary>${title}${sub?` <span class="f">${sub}</span>`:''}</summary><div class="gvdb"></div></details>`;
    $('#gvBody').innerHTML=
      (GV.card?GV.card(g,D):'<p class="note">the Matchups card is unavailable</p>')
     +`<div class="gv2 gvmkt">
         <div class="panel"><h4>market <span class="mini">the number, the model, the gap</span></h4>${mk.lines}</div>
         <div class="panel"><h4>edges <span class="mini">this game's player markets by EV</span></h4>${mk.props}</div></div>`
     +`<div class="gvdeep">${det('depth','depth charts','both sides, offense and defense')}
        ${det('scheme','scheme &amp; personnel',`how each unit plays · ${se}`)}
        ${det('form','form &amp; trend','records, venue, ATS · what each defense is giving up')}
        ${det('story','storylines','rivalries, revenge, homecomings, alumni')}</div>`;
    $('#gvBody').querySelectorAll('details.gvd').forEach(d=>d.ontoggle=()=>{
      if(!d.open)return;const box=d.querySelector('.gvdb');if(box.dataset.done)return;
      box.dataset.done='1';
      try{box.innerHTML=LAZY[d.dataset.k]()}catch(err){box.innerHTML='<p class="note">could not build this section</p>';console.error(err)}
      if(typeof logoize==='function')logoize(box);
      box.querySelectorAll('.plink[data-p],.pp[data-p]').forEach(n=>n.onclick=()=>playerPop(n.dataset.p));
    });
    if(typeof logoize==='function')logoize($('#gvBody'));
    $('#gvBody').querySelectorAll('.plink[data-p],.pp[data-p]').forEach(n=>n.onclick=()=>playerPop(n.dataset.p));
  }
  $('#gvGame').onchange=draw;$('#gvSrc').onchange=draw;
  fill();RR.push(fill);
}
