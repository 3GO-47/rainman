<style>

</style></head><body>
<header><h1><svg width="17" height="17" viewBox="0 0 16 16" style="vertical-align:-3px"><ellipse cx="8" cy="8" rx="7" ry="4.4" transform="rotate(-28 8 8)" fill="#5c3a1e" stroke="#8b98a5" stroke-width=".8"/><path d="M5.8 9.7 L10.2 6.3 M6.7 10.1 L7.4 8.4 M8.3 7.7 L9 6" stroke="#e6e6e6" stroke-width="1" fill="none"/></svg> RAINMAN</h1><span class="sub">DVP TERMINAL &middot; NFL DEFENSE-VS-POSITION &middot; DATA <b>__SEASONS__</b> (__GAMES__ GM &middot; __ROWS__ ROWS) &middot; SCHED <b>26/27</b> &middot; BUILT <b>__BUILT__</b> &middot; BLEND <b>__BLEND__</b> &middot; RANK <b>1</b>/32 = MOST ALLOWED &middot; p&#8407; = m&middot;v&#8407;</span></header>
<div id="top"><nav>

<script>
const J = __DATA__;
/* ---------- helpers ---------- */
const $=q=>document.querySelector(q);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const stdev=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)*(x-m))))};
function gradeColor(rank,n=32){const t=Math.max(0,Math.min(1,(rank-1)/(n-1)));
  const h=t<.5?145-(t*2)*85:60-((t-.5)*2)*60;return `hsl(${h},52%,${45-t*4}%)`}
function gradeBg(rank){ // 6 discrete bands: greens -> slate middle -> reds
  if(rank<=5)  return 'hsla(145,70%,38%,.85)';
  if(rank<=10) return 'hsla(150,45%,29%,.85)';
  if(rank<=16) return 'hsla(210,16%,30%,.85)';
  if(rank<=21) return 'hsla(222,18%,22%,.85)';
  if(rank<=27) return 'hsla(8,45%,33%,.85)';
  return 'hsla(2,70%,42%,.85)';}
const SCACHE={};
function series(def,stat){const se=TREND_SE;const k=def+'|'+stat;
  if(SCACHE[k])return SCACHE[k];
  return SCACHE[k]=J.weekly.filter(r=>r[0]===def&&r[1]===se).sort((a,b)=>a[2]-b[2]).map(r=>r[WCOL[stat]]);}
function sparkWave(vals,color,w=96,h=24){
  if(!vals||vals.length<2)return '';
  const mx=Math.max(...vals,1),mn=Math.min(...vals,0);
  const X=i=>(i/(vals.length-1))*(w-4)+2, Y=v=>h-3-((v-mn)/((mx-mn)||1))*(h-7);
  let dp=`M${X(0).toFixed(1)},${Y(vals[0]).toFixed(1)}`;
  for(let i=1;i<vals.length;i++){const xc=((X(i-1)+X(i))/2).toFixed(1);
    dp+=` Q${xc},${Y(vals[i-1]).toFixed(1)} ${X(i).toFixed(1)},${Y(vals[i]).toFixed(1)}`;}
  const ym=Y(mean(vals)).toFixed(1);
  return `<svg class="wave" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`+
   `<path d="${dp} L${X(vals.length-1).toFixed(1)},${h} L2,${h} Z" fill="${color}22" stroke="none"/>`+
   `<path d="${dp}" fill="none" stroke="${color}" stroke-width="1.4"/>`+
   `<line x1="2" y1="${ym}" x2="${w-2}" y2="${ym}" stroke="#5d7186" stroke-dasharray="3,3" stroke-width=".7"/>`+
   `<circle cx="${X(vals.length-1).toFixed(1)}" cy="${Y(vals[vals.length-1]).toFixed(1)}" r="1.8" fill="${color}"/></svg>`;}
const lbl=c=>c.includes('P+R')||c.includes('R+R')?'+':c.includes('PY')?'PaYd':c==='P TD'?'PaTD':c.includes('RecY')?'RcYd':c.includes('Recep')?'Rec':c.includes('RY')?'RuYd':c.includes('TD')?'TD':c;
function allowLine(def,grp,D){
  const d=D[def];if(!d||!J.groupStats[grp])return '—';
  return J.groupStats[grp].filter(c=>!c.includes('P+R')&&!c.includes('R+R')).map(c=>{const o=d.stats[c];
    return `${(+o.avg).toFixed(1)}<span class="mini">${lbl(c)}</span>&nbsp;${badge(o.rank)}`}).join(' &nbsp;');}
const ORDER={QB:['QB PY','QB RY','P TD','QB TD'],
 RB1:['RB1 RY','RB1 Recep','RB1 RecY','RB1 TD'],
 RB2:['RB2+ RY','RB2 Recep','RB2 RecY','RB2 TD'],
 WR1:['WR1 RecY','WR1 Recep',null,'WR1 TD'],WR2:['WR2 RecY','WR2 Recep',null,'WR2 TD'],
 WR3:['WR3 RecY','WR3 Recep',null,'WR3 TD'],'WR4+':['WR4+ RecY','WR4+ Recep',null,'WR4+ TD'],
 TE1:['TE1 RecY','TE1 Recep',null,'TE1 TD'],TE2:['TE2 RecY','TE2 Recep',null,'TE2 TD'],
 'D/ST':[null,null,null,'D/ST TD']};
function allowCells(def,grp,D){const d=D[def];
  return (ORDER[grp]||[null,null,null,null]).map(c=>{
    if(!c||!d)return '<td class="st"></td>';
    const o=d.stats[c];
    return `<td class="st">${badge(o.rank)} ${(+o.avg).toFixed(1)}<span class="mini">${lbl(c)}</span></td>`}).join('');}
function fieldTilt(vis,home,pos){
  let yl='';for(let i=1;i<10;i++){const x=26+i*26.8;
    yl+=`<line x1="${x.toFixed(1)}" y1="2" x2="${x.toFixed(1)}" y2="16" stroke="${i===5?'#3f7a4e':'#274d33'}" stroke-width="${i===5?1.6:1}"/>`;
    yl+=`<line x1="${(x-13.4).toFixed(1)}" y1="6" x2="${(x-13.4).toFixed(1)}" y2="8" stroke="#274d33" stroke-width="1"/>`;
    yl+=`<line x1="${(x-13.4).toFixed(1)}" y1="10" x2="${(x-13.4).toFixed(1)}" y2="12" stroke="#274d33" stroke-width="1"/>`;}
  const cx=26+(Math.max(0,Math.min(100,pos))/100)*268;
  return `<svg viewBox="0 0 320 18" preserveAspectRatio="none" style="width:100%;height:16px;display:block;margin:2px 0 10px">
   <rect x="0" y="2" width="320" height="14" fill="#0a2414"/>
   <rect x="0" y="2" width="26" height="14" fill="${hex2rgba(vivid(vis),.55)}"/>
   <rect x="294" y="2" width="26" height="14" fill="${hex2rgba(vivid(home),.55)}"/>${yl}
   <ellipse cx="${cx.toFixed(1)}" cy="9" rx="5.2" ry="3.4" fill="#5c3a1e" stroke="#cfd8dc" stroke-width=".6"/>
   <line x1="${(cx-2.4).toFixed(1)}" y1="9" x2="${(cx+2.4).toFixed(1)}" y2="9" stroke="#e6e6e6" stroke-width=".8"/></svg>`;}

  <div id="rkTbl"></div>`;
  let slot='QB',sortK='psi',sortA=true;
  function render(){
    const src=$('#rkSrc').value,D=J.dvp[src];

    if(slot==='ALL'){
      let R=defs.map(d=>({d,ranks:J.statCols.map(c=>D[d].stats[c].rank),

    $('#rkTbl').innerHTML=`<table><thead><tr><th data-k="d">Defense</th><th class="rk" data-k="psi">&Psi;</th><th>&omega; ${J.primary[slot]} wkly</th>
      ${stats.map((c,i)=>`<th class="rk" data-k="r${i}">*${c}*</th>`).join('')}
      ${stats.map((c,i)=>`<th data-k="v${i}">${c}</th>`).join('')}</tr></thead><tbody>
      ${R.map(r=>`<tr><td>${tcell(r.d)}</td><td>${psi(r.psi)}</td><td>${sparkWave(series(r.d,J.primary[slot]),vivid(r.d))}</td>

      </tbody></table>`;
    document.querySelectorAll('#rkTbl th').forEach(th=>th.onclick=()=>{
      sortA=(sortK===th.dataset.k)?!sortA:true;sortK=th.dataset.k;render()});
  }
  document.querySelectorAll('#rkTabs button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#rkTabs button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');slot=b.dataset.s;sortK=slot==='ALL'?'psi':'psi';sortA=true;render()});

/* ---------- Grand Unified Insights ---------- */
function insights(){
  $('#insights').innerHTML=`<div class="controls">
    <span class="note"><b style="color:var(--cyan)">HOW TO READ THIS</b> — &Psi; = the opponent defense's average rank in the stats that matter for that role
(QB: pass yds / rush yds / pass+rush / pass TD / total TD &middot; RB: rush yds / catches / rec yds / rush+rec / TD &middot; WR &amp; TE: catches / rec yds / TD).
Rank 1 of 32 = that defense has given up the MOST of it. Each row shows the actual per-game production the opponent defense gives up to that role, its league rank per stat, whether the defense is trending softer or tighter, its weekly waveform, and the player's own recent scoring. Recomputed live from depth charts + the 26/27 schedule; OUT players excluded.</span></div>
    <div id="inSm"></div><div id="inRest"></div>`;
  const groups=['QB','RB1','RB2','WR1','WR2','WR3','TE1'];
  function smRender(){
    const wk=G.week,D=J.dvp.combined;
    const se=TREND_SE;
    const form={};
    J.logs.forEach(l=>{if(l[LOG.season]===se)(form[l[LOG.player]]=form[l[LOG.player]]||[]).push(l[LOG.fppr])});
    const cand=UNIVERSE.filter(u=>u.grp&&u.inj!=='-1'&&inF(u.team)&&u.slot===(u.grp==='QB'?'QB1':u.grp))
      .map(u=>{const o=(J.sched26[u.team]||[])[wk-1]||'';
        if(!o||o==='BYE')return null;
        const def=o.replace('@','');
        const v=(D[def]||{comps:{}}).comps[u.grp];
        return v==null?null:{player:u.player,team:u.team,o,def,comp:v,grp:u.grp}})
      .filter(Boolean);
    const line=r=>{
      const ser=series(r.def,J.primary[r.grp]);
      const tm=mean(ser),t3=mean(ser.slice(-3));const pct=tm?100*(t3-tm)/tm:0;
      const tr=pct>12?`<span class="up">&#9650;+${pct.toFixed(0)}%</span>`:pct<-12?`<span class="dn">&#9660;${pct.toFixed(0)}%</span>`:`<span class="mini">flat</span>`;
      const f=(form[r.player]||[]).slice(-3);
      return `<tr><td class="pp plink" data-p="${r.player}">${esc(r.player)}</td><td>${tcell(r.team)}</td><td>${oppcell(r.o)}</td><td>${psi(r.comp)}</td>
        ${allowCells(r.def,r.grp,D)}<td>${tr}</td><td>${sparkWave(ser,vivid(r.def),80,18)}</td>
        <td>${f.length?mean(f).toFixed(1):'—'}</td></tr>`};
    const hdr=g=>`<tr><th>player</th><th>tm</th><th>opp</th><th class="rk">&Psi;</th>
      ${ORDER[g].map(c=>`<th>${c?lbl(c)+' (rk)':''}</th>`).join('')}<th>def trend L3</th><th>&omega; wkly</th><th>L3 ppr</th></tr>`;
    const CG='<colgroup><col style="width:150px"><col style="width:58px"><col style="width:64px"><col style="width:46px"><col style="width:104px"><col style="width:104px"><col style="width:104px"><col style="width:104px"><col style="width:74px"><col style="width:88px"><col style="width:56px"></colgroup>';
    $('#inSm').innerHTML=groups.filter(g=>inP(posOf(g))).map(g=>{
      const rows=cand.filter(x=>x.grp===g).sort((a,b)=>a.comp-b.comp);
      return `<div class="panel"><h3 style="color:${POSC[posOf(g)]}">${posIcon(posOf(g),14)} ${g} — wk ${wk}</h3>
      <p class="mini" style="color:var(--green)">TARGET — softest fields this week</p>
      <table class="fx">${CG}<thead>${hdr(g)}</thead><tbody>${rows.slice(0,5).map(line).join('')}</tbody></table>
      <p class="mini" style="margin-top:8px;color:var(--red)">AVOID — hardest fields this week</p>
      <table class="fx">${CG}<thead>${hdr(g)}</thead><tbody>${rows.slice(-5).reverse().map(line).join('')}</tbody></table>
      </div>`}).join('');
  }
  function rest(){
  const season=TREND_SE;
  const defs=[...new Set(J.weekly.map(r=>r[0]))].filter(inD);
  const movers=[],vol=[];
  defs.forEach(d=>{const rows=J.weekly.filter(r=>r[0]===d&&r[1]===season).sort((a,b)=>a[2]-b[2]);
    J.slots.filter(x=>inP(posOf(x))).forEach(sl=>{const c=J.primary[sl],all=rows.map(r=>r[WCOL[c]]);
      const m=mean(all),m3=mean(all.slice(-3)),sd=stdev(all);
      if(m>2){movers.push({d,sl,c,m,m3,pct:100*(m3-m)/m});vol.push({d,sl,c,m,cv:sd/m})}})});
  movers.sort((a,b)=>Math.abs(b.pct)-Math.abs(a.pct));
  vol.sort((a,b)=>b.cv-a.cv);
  const mv=`<div class="panel"><h3>momentum shifts — last 3 wks vs season ${season}</h3>
    <table><thead><tr><th>defense</th><th>slot</th><th>stat</th><th>μ/gm</th><th>last3</th><th>Δp</th></tr></thead><tbody>
    ${movers.slice(0,12).map(x=>`<tr><td>${tcell(x.d)}</td><td>${slotchip(x.sl)}</td><td class="mini">${x.c}</td>
    <td>${x.m.toFixed(1)}</td><td>${x.m3.toFixed(1)}</td>
    <td class="${x.pct>0?'up':'dn'}">${x.pct>0?'&#9650; +':'&#9660; '}${x.pct.toFixed(0)}%</td></tr>`).join('')}
    </tbody></table><p class="note">&#9650; softening (target these defenses) &middot; &#9660; hardening (fade)</p></div>`;
  const un=`<div class="panel"><h3>uncertainty principle — most/least predictable defenses (${season})</h3>
    <div class="grid2"><div><p class="mini">HIGH σ/μ — BOOM/BUST</p>
    <table>${vol.slice(0,8).map(x=>`<tr><td>${tcell(x.d)}</td><td>${slotchip(x.sl)}</td><td class="mini">${x.c}</td><td>${(100*x.cv).toFixed(0)}%</td></tr>`).join('')}</table></div>
    <div><p class="mini">LOW σ/μ — DETERMINISTIC</p>
    <table>${vol.slice(-8).reverse().map(x=>`<tr><td>${tcell(x.d)}</td><td>${slotchip(x.sl)}</td><td class="mini">${x.c}</td><td>${(100*x.cv).toFixed(0)}%</td></tr>`).join('')}</table></div></div>
    <p class="note">coefficient of variation of weekly stat allowed &middot; high = matchup rank is less trustworthy week to week</p></div>`;
  const key=['QB','RB1','WR1','TE1'];
  const ss=key.filter(x=>inP(posOf(x))).map(sl=>{const per=Object.keys(J.sched26).filter(inF).map(t=>{
      const cs=J.sched26[t].filter(o=>o!=='BYE').map(o=>{const d=o.replace('@','');
        return (J.dvp.combined[d]||{comps:{}}).comps[sl]}).filter(v=>v!=null);
      return {t,avg:mean(cs)}}).sort((a,b)=>a.avg-b.avg);
    const line=r=>`<tr><td>${tcell(r.t)}</td><td>${psi(r.avg)}</td></tr>`;
    return `<div class="panel"><h3 style="color:${POSC[posOf(sl)]}">${posIcon(posOf(sl),13)} ${sl} geodesics — full 2026 schedule strength</h3><div class="grid2">
    <div><p class="mini">DOWNHILL (easiest)</p><table>${per.slice(0,5).map(line).join('')}</table></div>
    <div><p class="mini">UPHILL (hardest)</p><table>${per.slice(-5).reverse().map(line).join('')}</table></div></div></div>`}).join('');
  $('#inRest').innerHTML=mv+un+ss+`<p class="note"><b>momentum</b> = defenses trending softer/harder RIGHT NOW (recent form the season rank hasn't caught up to — target/fade before the market does) &middot; <b>uncertainty</b> = how trustworthy a defense's rank is week to week &middot; <b>geodesics</b> = full-season strength of schedule per role (planning signal, not a weekly call)</p>`;
  }
  RR.push(()=>{smRender();rest()});
}

/* ---------- Collision Chamber: weekly comprehensive matchups ---------- */
function chamber(){
  $('#chamber').innerHTML=`<div class="controls">
    <select id="chSrc">${Object.keys(J.dvp).map(x=>`<option ${x==='combined'?'selected':''}>${x}</option>`).join('')}</select>

    <div id="chOut"></div>`;
  const ROWS=['QB','RB1','RB2','WR1','WR2','WR3','WR4+','TE1','TE2'];
  const starter=(t,g)=>UNIVERSE.filter(u=>u.team===t&&u.slot===(g==='QB'?'QB1':g)).sort((a,b)=>(a.ord||9)-(b.ord||9))[0];
  function side(off,def,D){
    const RW=ROWS.filter(g=>inP(posOf(g)));
    const rows=RW.map(g=>{
      const u=starter(off,g);
      const v=(D[def]||{comps:{}}).comps[g];
      const inj=u&&u.inj==='0'?' <span class="inj0">Q</span>':u&&u.inj==='-1'?' <span class="injm1">OUT</span>':'';
      return `<tr><td>${slotchip(g)}</td><td class="pp plink" data-p="${u?u.player:''}">${u?esc(u.player):'—'}${inj}</td>`+
        `${allowCells(def,g,D)}<td>${sparkWave(series(def,J.primary[g]),vivid(def),80,18)}</td></tr>`}).join('');
    const avg=mean(RW.map(g=>(D[def]||{comps:{}}).comps[g]).filter(v=>v!=null));
    return {html:`<div><table class="fx"><colgroup><col style="width:58px"><col><col style="width:104px"><col style="width:104px"><col style="width:104px"><col style="width:104px"><col style="width:88px"></colgroup><thead><tr><th></th><th>${tcell(off)} offense</th>`+
      `<th colspan="4" style="text-align:center">${tcell(def)} def allows /gm (rank)</th><th>&omega;</th></tr></thead><tbody>${rows}</tbody></table>`+
      `<p class="mini" style="text-align:right">mean field &Psi; ${avg.toFixed(1)}</p></div>`,avg};
  }
  function render(){

    let lastSlate=null;
    $('#chOut').innerHTML=(games.length?'':'<p class="note">no games match the current filter</p>')+games.map(g=>{const [w,vis,home,date]=g;
      const hdr=g[GM.slate]!==lastSlate?`<h3 style="margin-top:14px;border-bottom:1px solid var(--edge2)">${slateChip(g[GM.slate])} <span class="f">${SLATE_TIP[g[GM.slate]]||''} &middot; ${games.filter(x=>x[GM.slate]===g[GM.slate]).length} game${games.filter(x=>x[GM.slate]===g[GM.slate]).length===1?'':'s'}</span></h3>`:'';
      lastSlate=g[GM.slate];
      const A=side(vis,home,D),B=side(home,vis,D);
      const diff=B.avg-A.avg;
      const favT=diff>0?vis:home;
      const dot=(50-Math.max(-45,Math.min(45,diff*6))).toFixed(1);
      return hdr+`<div class="panel gamecard" style="border-top:2px solid ${vivid(favT)}">
        <h3>${tlogo(vis,20)} ${vis} @ ${tlogo(home,20)} ${home}
          <span class="f">${date} &middot; ${kickLbl(g)} &middot; field tilt: ${tcell(favT)} +${Math.abs(diff).toFixed(1)}&Psi;</span></h3>
        ${fieldTilt(vis,home,+dot)}
        <p class="mini" style="margin:2px 0 6px">${tcell(vis)} D &rarr; ${schemeLine(vis)||'<span class="dim">no scheme data</span>'} ${trustPill(vis)} &nbsp;&nbsp; ${tcell(home)} D &rarr; ${schemeLine(home)||'<span class="dim">no scheme data</span>'} ${trustPill(home)}<br>${envLine(vis,home,wk)}</p>
        <div class="grid2">${A.html}${B.html}</div></div>`}).join('')
      +(byes.length?`<p class="note">out of phase this week (bye): ${byes.map(t=>tcell(t)).join(' &nbsp;')}</p>`:'');
  }
  $('#chSrc').onchange=render;RR.push(render);
}
/* ---------- Home: the command center ---------- */

     <div class="sm-role" style="color:${c}">${x.flex?'<span style="font-size:13px">&#10033;</span>':posIcon(posOf(x.g),13)}<b>${x.label}</b>${x.flex?`<span class="mini">${x.g}</span>`:''}</div>
     <div class="sm-who"><span class="pp plink" data-p="${x.u.player}">${tlogo(x.u.team,17)}<b>${esc(x.u.player)}</b></span>
       <span class="mini">${x.o[0]==='@'?'@':'vs'} ${tcell(x.def)} &middot; wk ${wk}</span></div>
     <div><div class="sm-track"><div class="sm-fill" style="width:${(val/mx*100).toFixed(1)}%;background:${c}"></div>
       <div class="sm-tick" style="left:${(av2/mx*100).toFixed(1)}%"></div></div>
       <span class="mini">${val.toFixed(1)} ${lbl(pr)}/gm &middot; lg avg ${av2.toFixed(1)} &middot; lg max ${mx.toFixed(1)}</span></div>

  /* TD phase space: defense-level scatter of the TD rankings (static across weeks) */
  (function(){
    const acc={};
    J.logs.forEach(l=>{const d=l[LOG.opp];const a=acc[d]=acc[d]||{air:0,gnd:0,g:new Set()};
      a.air+=l[LOG.ptd];a.gnd+=l[LOG.rtd];a.g.add(l[LOG.season]+'-'+l[LOG.week]);});
    const ps=Object.keys(acc).map(d=>({t:d,x:+(acc[d].air/acc[d].g.size).toFixed(2),y:+(acc[d].gnd/acc[d].g.size).toFixed(2)}));
    const XM2=mean(ps.map(p2=>p2.x)),YM2=mean(ps.map(p2=>p2.y));
    const equip={id:'equip',afterDraw(ch){const x2=ch.scales.x,y3=ch.scales.y;if(!x2||!y3)return;
      const ctx=ch.ctx;ctx.save();

      [1.6,2.0,2.4,2.8].forEach(c2=>{

      ctx.beginPath();ctx.moveTo(x2.left,y3.getPixelForValue(YM2));ctx.lineTo(x2.right,y3.getPixelForValue(YM2));ctx.stroke();
      ctx.restore();}};

        return `<tr><td class="mini">${e.rank}</td><td>${tcell(g[GM.vis])} @ ${tcell(g[GM.home])}</td><td style="color:${c}" title="mean(off EPA + opp def EPA allowed)">${e.score>0?'+':''}${e.score.toFixed(3)}</td><td class="mini">${e.plays.toFixed(0)} pl</td><td class="mini">${e.pace.toFixed(1)}s</td><td class="mini">${e.proe>0?'+':''}${e.proe.toFixed(1)} PROE</td><td class="mini">${e.tags.join(' · ')}</td><td class="mini" title="side with the better EPA edge">${tcell(fav)}</td></tr>`}).join('')||'<tr><td class="dim">no games in filter</td></tr>'}</tbody></table>
      <p class="mini" style="margin-top:6px"><b style="color:var(--txt)">fragile priors</b> &middot; defenses whose 2024-25 DvP may not describe the 2026 unit</p>
      <table><tbody>${frag.slice(0,6).map(x=>`<tr><td>${tcell(x.d)}</td><td>${trustPill(x.d)}</td><td class="mini">${Math.round(x.t.ret*100)}% snaps back${x.t.newDC?' · new DC':''} · ${x.t.wk}wk '26</td></tr>`).join('')}</tbody></table></div>
     <div><p class="mini"><b style="color:var(--txt)">role movers</b> &middot; last game vs season-to-date (2026 snap + target share)</p>
      ${mv.length?`<table><tbody>${ups.map(mvRow).join('')}${dns.length?`<tr><td colspan="7" class="mini" style="padding-top:6px;color:var(--red)">shrinking roles</td></tr>${dns.map(mvRow).join('')}`:''}</tbody></table>`:'<p class="note">needs two 2026 games with snap data in the current filter</p>'}</div>
     <div><p class="mini"><b style="color:var(--txt)">scheme edges</b> &middot; opponent's scheme family vs this slot, league-indexed (2024-25)</p>
      <table><tbody>${eUp.map(x=>`<tr><td class="pp plink" data-p="${x.u.player}">${esc(x.u.player)}</td><td>${slotchip(x.u.grp)}</td><td>${oppcell(x.o)}</td><td>${edgeChip(x.def,x.u.grp)}</td><td>${x.psi==null?'':psi(x.psi)}</td><td class="mini" title="${esc(x.e.fam)}">${esc(x.e.fam.split(/ [\/(·]/)[0].slice(0,16))}</td></tr>`).join('')}
      ${eDn.length?`<tr><td colspan="6" class="mini" style="padding-top:6px;color:var(--red)">scheme headwinds</td></tr>${eDn.map(x=>`<tr><td class="pp plink" data-p="${x.u.player}">${esc(x.u.player)}</td><td>${slotchip(x.u.grp)}</td><td>${oppcell(x.o)}</td><td>${edgeChip(x.def,x.u.grp)}</td><td>${x.psi==null?'':psi(x.psi)}</td><td class="mini" title="${esc(x.e.fam)}">${esc(x.e.fam.split(/ [\/(·]/)[0].slice(0,16))}</td></tr>`).join('')}`:''}</tbody></table>
      <p class="note">&Psi; = DvP composite rank (1 = softest) &middot; a green edge with a green &Psi; is conviction; a green edge against a red &Psi; means the scheme prior and the results disagree — check the defense's trust score</p></div>
    </div></div>`}
}
/* ---------- command palette: Ctrl/⌘-K or "/" — jump to any player or team ---------- */
function palette(){
  const items=[];UNIVERSE.forEach(u=>items.push({k:'p',n:u.player,s:u.team+' · '+u.dslot,t:u.team}));Object.keys(J.sched26).sort().forEach(t=>items.push({k:'t',n:t+' '+(TEAM[t]?TEAM[t].n:''),s:'team filter',t}));
  const open=()=>{if($('#pal'))return;document.body.insertAdjacentHTML('beforeend',`<div id="pal" class="modal"><div class="palbox"><input id="palIn" placeholder="player or team… (Enter = open · Esc = close)" autocomplete="off"><div id="palList"></div></div></div>`);
    const inp=$('#palIn'),list=$('#palList');let sel=0,hits=[];
    const draw=()=>{list.innerHTML=hits.map((h,i)=>`<div class="palrow ${i===sel?'on':''}" data-i="${i}">${h.k==='t'?tlogo(h.t,16):posIcon(posOf(h.s.split(' · ')[1]||''),12)} <b>${esc(h.n)}</b> <span class="mini">${esc(h.s)}</span></div>`).join('')||'<p class="note">no match</p>'};
    const go=h=>{if(!h)return;close();if(h.k==='p')playerPop(h.n);else{G.team=h.t;$('#gTeam').value=h.t;apply()}};
    const close=()=>{const m=$('#pal');if(m)m.remove()};
    inp.oninput=()=>{const q=inp.value.trim().toLowerCase();hits=q?items.filter(x=>x.n.toLowerCase().includes(q)||x.t.toLowerCase()===q).sort((a,b)=>(b.k==='t'&&b.t.toLowerCase()===q)-(a.k==='t'&&a.t.toLowerCase()===q)||a.n.toLowerCase().indexOf(q)-b.n.toLowerCase().indexOf(q)).slice(0,12):[];sel=0;draw()};
    inp.onkeydown=e=>{if(e.key==='ArrowDown'){sel=Math.min(hits.length-1,sel+1);draw();e.preventDefault()}else if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);draw();e.preventDefault()}else if(e.key==='Enter'){go(hits[sel])}else if(e.key==='Escape')close()};
    list.onclick=e=>{const r=e.target.closest('.palrow');if(r)go(hits[+r.dataset.i])};$('#pal').onclick=e=>{if(e.target.id==='pal')close()};inp.focus()};
  addEventListener('keydown',e=>{const tag=(e.target.tagName||'').toLowerCase();if(((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k')||(e.key==='/'&&tag!=='input'&&tag!=='select'&&tag!=='textarea')){e.preventDefault();open()}});
  $('#gFind').onclick=open;
}
/* click any team code anywhere → toggle it as the team filter */
document.addEventListener('click',e=>{const t=e.target.closest('.tc');if(!t||e.target.closest('select,option'))return;const code=t.textContent.trim().slice(-3);if(!J.sched26[code])return;
  G.team=G.team===code?'':code;$('#gTeam').value=G.team;apply();e.stopPropagation()},true);
home();dchart();lab();ranks();matrix();sked();tdboard();chamber();defense();player();insights();intel();brief();palette();
gbarInit();
</script></body></html>
