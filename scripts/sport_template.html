<script>const J=__DATA__;</script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;const fmt=(v,d=1)=>v==null||isNaN(v)?'·':(+v).toFixed(d);
const LC=Object.fromEntries(J.logCols.map((c,i)=>[c,i]));const STAT=Object.fromEntries(J.stats.map(s=>[s.k,s]));const NT=Object.keys(J.dvp.combined).length||30;
const TEAM=J.teams;const logo=t=>TEAM[t]?`<img src="${TEAM[t].logo}" alt="" onerror="this.style.visibility='hidden'">`:'';const tc=t=>`<span class="tc">${logo(t)}<span style="color:${TEAM[t]&&TEAM[t].color?'var(--tc-'+t+','+TEAM[t].color+')':'var(--dim)'}">${t}</span></span>`;
const tname=t=>TEAM[t]&&TEAM[t].name||t;
const gradeT=r=>Math.max(0,Math.min(1,(r-1)/(NT-1)));const gradeStyle=r=>{if(r==null)return 'background:var(--s3);color:var(--dim)';const t=gradeT(r);const h=t<.5?145-(t/.5)*(145-48):48-((t-.5)/.5)*44;return `background:hsla(${h},${t<.5?55:60}%,${t<.5?30:36}%,.95);color:#f3f3f3`};
const gradeColor=r=>{if(r==null)return 'var(--dim)';const t=gradeT(r);const h=t<.5?145-(t/.5)*(145-48):48-((t-.5)/.5)*44;return `hsl(${h},60%,55%)`};
const hc=(rank,label,avg)=>`<span class="hc" style="${gradeStyle(rank)}" title="${label}: opponent allows ${fmt(avg,2)} per game to this slot — rank ${rank} of ${NT} (1 = allows the most)">${rank==null?'·':rank}<i>${label}${avg!=null?' '+fmt(avg,STAT[label.toLowerCase()]?STAT[label.toLowerCase()].dec:1):''}</i></span>`;
const TZD='America/Chicago';const fmtT=d=>{const x=new Date(d);return isNaN(x)?'':x.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:TZD}).replace(':00','')};const dayKey=d=>{const x=new Date(d);return isNaN(x)?String(d).slice(0,10):x.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:TZD})};
const PL={};J.players.forEach(p=>PL[p.pid]=p);const PLOGS={};J.logs.forEach(l=>{(PLOGS[l[LC.pid]]=PLOGS[l[LC.pid]]||[]).push(l)});
const PJ={};J.proj.forEach(r=>{(PJ[r.pid]=PJ[r.pid]||{})[r.market]=r});
const MK=J.markets.map(k=>STAT[k]);const PRIMARY=J.sport==='basketball'?'pts':'sog';const GOALIE=['sv','ga','sa'].filter(k=>STAT[k]);const mkFor=slot=>J.sport==='hockey'?(slot==='G'?GOALIE.map(k=>STAT[k]):MK.filter(m=>!GOALIE.includes(m.k))):MK;
const slotOf=p=>p.slot;const primaryOf=p=>p[PRIMARY]??p[PRIMARY+'_prior']??0;
/* ---- universal table sorting ---- */
function sortableAll(root){(root||document).querySelectorAll('table').forEach(t=>{const head=t.tHead||t.querySelector('thead');if(!head||t.dataset.srt)return;t.dataset.srt='1';
  [...head.rows].forEach(hr=>{let col=0;[...hr.cells].forEach(th=>{const span=th.colSpan||1,c0=col;col+=span;if(th.classList.contains('nosort')||!th.textContent.trim())return;th.classList.add('srt');
    th.addEventListener('click',()=>{const asc=th.dataset.dir!=='asc';head.querySelectorAll('th.srt').forEach(x=>{x.classList.remove('srt-asc','srt-desc');delete x.dataset.dir});th.dataset.dir=asc?'asc':'desc';th.classList.add(asc?'srt-asc':'srt-desc');
      const tb=t.tBodies[0];if(!tb)return;const rows=[...tb.rows];const num=v=>{const m=String(v).replace(/,/g,'').match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):null};
      const val=r=>{const c=r.cells[Math.min(c0,r.cells.length-1)];if(!c)return '';if(c.dataset.v!=null)return c.dataset.v;const b=c.querySelector('.hc,b');return (b?b.textContent:c.textContent).trim()};
      const vs=rows.map(r=>({r,v:val(r)}));const numeric=vs.filter(x=>num(x.v)!=null).length>=Math.max(1,vs.length*.5);
      vs.sort((a,b)=>{if(numeric){const x=num(a.v),y=num(b.v);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return asc?x-y:y-x}const x=String(a.v).toLowerCase(),y=String(b.v).toLowerCase();return asc?x.localeCompare(y):y.localeCompare(x)});
      vs.forEach(x=>tb.appendChild(x.r))})})})})}

 {id:'home',label:'Home',items:[{id:'overview',label:'Overview',desc:'the slate with lines and the model, softest matchups per market, the defensive field, team ratings'}]},

 {id:'players',label:'Players',items:[{id:'lab',label:'Matchup Lab',desc:'every player: season · prior · last-10 averages beside the opponent\'s rank for his slot'},{id:'explorer',label:'Player Explorer',desc:'any player\'s full game log across the loaded seasons'}]},
 {id:'intel',label:'Intel',items:[{id:'dvp',label:'Defenses',desc:'what each defense allows per slot and stat, ranked — compare two data sets side by side'},{id:'ratings',label:'Ratings',desc:'team scoring, margin and pace ratings behind the game model'}]},
 {id:'picks',label:'Picks',items:[{id:'lines',label:'Game lines',desc:'DraftKings lines on the slate beside the model: win probability, margin, total, implied team totals'},{id:'ledger',label:'Ledger',desc:'frozen ML / spread / total positions, graded'}]}];

const INTRO={
 overview:{what:'The slate with lines and the model\'s view of each game, the softest matchups per market, every defense ranked by slot, and the standings.',how:['rank 1 = that defense allows the MOST to that slot (best matchup)','implied = team totals derived from the line and the total','green = good for the player / offense, red = bad']},
 cards:{what:'Every upcoming game: both rotations against the defense they face, market by market.',how:['colored number = the opponent\'s rank allowing that stat to his slot (1 = allows the most)','his averages are this season, blended with last season when the sample is thin','proj = projection for this game']},
 board:{what:'Every player on the slate, one row per market: projection, range and the opponent\'s rank. Sort any column.',how:['click a header to sort','rank 1 = softest opponent for that stat']},

    <span class="mini">vs</span><select id="dvCmp"><option value="">— compare with —</option>${srcs.map(s=>`<option ${s===DV.cmp?'selected':''}>${s}</option>`).join('')}</select><span class="note">allowed per game to the ${DV.slot} slot (sum of the opposing players at that position) · source ${G.src} · rank 1 = allows the most · pick a second data set for both ranks side by side with the shift (negative = softer in ${G.src})</span></div>
    <div class="panel wrap-x"><table class="heat"><thead><tr><th>defense</th><th>gp</th><th>next</th>${J.stats.map(s=>B?`<th colspan="3">${s.label}<div class="mini">${G.src} · ${DV.cmp} · Δ</div></th>`:`<th>${s.label}</th>`).join('')}</tr></thead><tbody>
    ${teams.map(t=>`<tr><td>${tc(t)}</td><td class="mini">${T[t][DV.slot]._gp}</td><td class="mini">${oppOf(t)}</td>${J.stats.map(s=>{const a=T[t][DV.slot][s.k];const b=B&&B[t]&&B[t][DV.slot]?B[t][DV.slot][s.k]:null;const cell=x=>x?`<span class="hc" style="${gradeStyle(x.rank)}">${x.rank}<i>${fmt(x.avg,s.dec)}</i></span>`:'·';
      return B?`<td>${cell(a)}</td><td>${cell(b)}</td><td class="mini ${a&&b?(a.rank-b.rank<0?'rise':a.rank-b.rank>0?'fall':''):''}">${a&&b?((a.rank-b.rank>0?'+':'')+(a.rank-b.rank)):''}</td>`:`<td>${cell(a)}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;
  el.querySelectorAll('#dvSlot button').forEach(b=>b.onclick=()=>{DV.slot=b.dataset.s;dvp()});el.querySelectorAll('#dvStat button').forEach(b=>b.onclick=()=>{DV.stat=b.dataset.s;dvp()});$('#dvCmp').onchange=()=>{DV.cmp=$('#dvCmp').value;dvp()}}
function ratingsView(){const el=$('#intel');const rat=Object.values(J.ratings).sort((a,b)=>b.rating-a.rating);
  el.innerHTML=`<div class="panel wrap-x"><h3>team ratings <span class="f">this season weighted up as games accumulate (full weight at ${J.sport==='basketball'?10:8} games) over last season · rating = margin · pace = PF + PA · the game model: margin = rating gap + home edge, win probability from a normal with sd ${J.sport==='basketball'?'12':'1.9'}</span></h3>
    <table><thead><tr><th>team</th><th>W-L</th><th>rating</th><th>PF</th><th>PA</th><th>pace</th><th>L10 margin</th><th>prior PF</th><th>prior PA</th><th>next</th></tr></thead><tbody>${rat.map(r=>`<tr><td>${tc(r.team)}</td><td class="mono">${r.wins}-${r.losses}</td><td><b class="${r.rating>0?'rise':'fall'}">${r.rating>0?'+':''}${fmt(r.rating,2)}</b></td><td>${fmt(r.pf,1)}</td><td>${fmt(r.pa,1)}</td><td>${fmt(r.pace,1)}</td><td class="${r.l10>0?'rise':'fall'}">${r.l10!=null?(r.l10>0?'+':'')+fmt(r.l10,1):'·'}</td><td class="dim">${fmt(r.pf_prior,1)}</td><td class="dim">${fmt(r.pa_prior,1)}</td><td class="mini">${oppOf(r.team)}</td></tr>`).join('')}</tbody></table></div>`}
/* ---- PICKS ---- */
function lines(){const el=$('#picks');const gs=GAMES();
  el.innerHTML=`<div class="panel wrap-x"><h3>game lines <span class="f">DraftKings via ESPN beside the model · implied = DK moneyline probability for the home side · edge = model − market · every header sorts</span></h3>
    <table><thead><tr><th>kick (CT)</th><th>game</th><th>tv</th><th>DK line</th><th>DK total</th><th>DK home %</th><th>model home %</th><th>ML edge</th><th>model margin</th><th>model total</th><th>total edge</th><th>implied</th></tr></thead><tbody>
    ${gs.map(g=>{const e=g.imp_home!=null&&g.p_home!=null?g.p_home-g.imp_home:null;const te=g.ou&&g.model_total!=null?g.model_total-parseFloat(g.ou):null;return `<tr><td class="mono">${dayKey(g.date).replace(/,.*$/,'')} ${fmtT(g.date)}</td><td>${tc(g.away)} <span class="dim">@</span> ${tc(g.home)}</td><td class="mini">${esc(g.tv||'')}</td><td class="mono">${g.odds?lineTxt(g):'—'}</td><td class="mono">${g.ou||'—'}</td><td class="mono">${g.imp_home!=null?(100*g.imp_home).toFixed(0)+'%':'—'}</td><td class="mono">${g.p_home!=null?(100*g.p_home).toFixed(0)+'%':'—'}</td><td class="${e>0?'rise':e<0?'fall':''}">${e!=null?(e>0?'+':'')+(100*e).toFixed(0)+'%':''}</td><td class="mono">${g.model_margin!=null?`${g.home} ${g.model_margin>0?'-':'+'}${Math.abs(g.model_margin).toFixed(1)}`:'—'}</td><td class="mono">${g.model_total??'—'}</td><td class="${te>0?'rise':te<0?'fall':''}">${te!=null?(te>0?'+':'')+te.toFixed(1):''}</td><td class="mini">${g.away_implied!=null?`${g.away_implied} · ${g.home_implied}`:''}</td></tr>`}).join('')}</tbody></table>
    <p class="note">positions are frozen the first time a game is built with a line (ML edge ≥ 6 points, spread ≥ ${J.sport==='basketball'?'2.5':'0.5'}, total ≥ ${J.sport==='basketball'?'3':'0.45'}) and graded from the final score — see the ledger</p></div>`}
function ledger(){const el=$('#picks');const P=J.picks.slice().sort((a,b)=>a.date<b.date?1:-1);const rec=t=>{const r=P.filter(p=>(!t||p.type===t)&&(p.result==='W'||p.result==='L'));const w=r.filter(p=>p.result==='W').length;return {w,l:r.length-w,n:P.filter(p=>!t||p.type===t).length}};
  el.innerHTML=`<div class="kpis">${['','ML','ATS','TOTAL'].map(t=>{const r=rec(t);return `<div class="kpi ${r.w>r.l?'g':r.l>r.w?'r':''}"><div class="k">${t||'all'}</div><div class="v">${r.w}-${r.l}</div><div class="s">${r.n} positions</div></div>`}).join('')}</div>
    <div class="panel wrap-x"><table><thead><tr><th>date</th><th>type</th><th>game</th><th>side</th><th>line</th><th>model</th><th>market</th><th>edge</th><th>frozen</th><th>result</th><th>actual</th></tr></thead><tbody>${P.map(p=>`<tr><td class="mono">${p.date}</td><td class="mini">${p.type}</td><td>${p.game.split('@').map(t=>tc(t)).join(' <span class="dim">@</span> ')}</td><td><b>${esc(String(p.side))}</b></td><td class="mono">${p.line??''}</td><td class="mono">${p.type==='ML'?(100*p.model).toFixed(0)+'%':p.model}</td><td class="mono">${p.type==='ML'?(100*p.market_ref).toFixed(0)+'%':p.market_ref}</td><td class="mini">${p.type==='ML'?'+'+(100*p.edge).toFixed(0)+'%':'+'+p.edge}</td><td class="mini">${p.frozen_on}</td><td>${p.result?`<span class="res ${p.result}">${p.result==='P'?'PUSH':p.result}</span>`:'<span class="mini">pending</span>'}</td><td class="mini">${p.actual??''}</td></tr>`).join('')||'<tr><td colspan="11" class="note">no positions yet — they freeze as lines post</td></tr>'}</tbody></table></div>`}
