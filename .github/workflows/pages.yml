# Deploys dashboard/v2/index.html (root + /v2/) and the classic dashboard/rainman.html (/v1/) to GitHub Pages on every push to main.
# One-time setup: repo Settings -> Pages -> Source = "GitHub Actions".
# Live URL: https://3go-47.github.io/rainman/
name: deploy-dashboard
on:
  push:
    branches: [main]
    paths: ['dashboard/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir -p _site
          # root = v2 (new UI over the same engine); v1 classic kept as the backup at /v1/ (and /rainman.html)
          mkdir -p _site/v1 _site/v2
          cp dashboard/rainman.html _site/v1/index.html
          cp dashboard/rainman.html _site/rainman.html
          # frozen snapshots for one-step revert / side-by-side comparison: /archive/<file>.html
          if [ -d dashboard/archive ]; then mkdir -p _site/archive && cp -r dashboard/archive/. _site/archive/; fi
          if [ -f dashboard/v2/index.html ]; then cp dashboard/v2/index.html _site/index.html; cp -r dashboard/v2/. _site/v2/; else cp dashboard/rainman.html _site/index.html; fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
