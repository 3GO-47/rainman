# Deploys dashboard/rainman.html to GitHub Pages on every push to main.
# One-time setup: repo Settings -> Pages -> Source = "GitHub Actions".
# Live URL: https://3go-47.github.io/rainman/
name: deploy-dashboard
on:
  push:
    branches: [main]
    paths: ['dashboard/rainman.html', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir -p _site
          cp dashboard/rainman.html _site/index.html
          cp dashboard/rainman.html _site/rainman.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
